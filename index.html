<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moss · Hours Report</title>
  <link rel="icon" href="https://brand.foundingcreative.com/favicon.svg" />

  <!-- Founding Creative design-system tokens (fonts, colors, radius, shadows, spacing) -->
  <link rel="stylesheet" href="https://brand.foundingcreative.com/css/tokens.css" />

  <style>
    /* ─────────────────────────────────────────────────────────────
       Report-specific styling, layered on the DS dark scheme.

       Series colors: FC's brand mint / lavender hues, stepped into the
       dark-mode lightness band for the chart + meter fills, with the full
       brand values kept for strokes, swatches and text accents.
       ───────────────────────────────────────────────────────────── */
    :root {
      /* Series fills sit at matched lightness gaps below their brand ink, so the
         outline reads against the fill with the same weight in both colours:
         mint 0.884 over 0.654, lavender 0.779 over 0.549. */
      --creative-fill: #27AC4B;
      --creative-ink: var(--mint);                  /* #7EF893 */
      --noncreative-fill: #7F5CB2;
      --noncreative-ink: var(--holo-lavender);      /* #C6A2FF */

      /* Semantic status. Green means the retainer is being used, which is good
         all the way to 100%; only going over is a warning. Yellow is reserved
         for data integrity, never for utilisation. */
      --ok: var(--mint);
      --over: #FF8A80;
      --over-surface: rgba(255, 138, 128, 0.12);

      --warn: #F5C26B;              /* base: icons, rules */
      --warn-strong: #FFD68F;       /* titles on a warn surface */
      --warn-body: #EBD3AE;         /* body copy on a warn surface */
      --warn-surface: rgba(245, 194, 107, 0.09);
      --warn-surface-2: rgba(245, 194, 107, 0.16);
      --warn-line: rgba(245, 194, 107, 0.38);

      --surface: rgba(255, 255, 255, 0.05);
      --surface-2: rgba(255, 255, 255, 0.10);
      --line: rgba(255, 255, 255, 0.14);
      --line-soft: rgba(255, 255, 255, 0.08);

      /* Text ramp. --dim-2 was 0.45, which measured 4.6:1 and was doing real
         work at 11 to 13px; the whole ramp is lifted for legibility. */
      --ink-strong: rgba(255, 255, 255, 0.92);
      --dim: rgba(255, 255, 255, 0.78);
      --dim-2: rgba(255, 255, 255, 0.62);
      --tick-cut: var(--n-black);   /* meter segment gaps: always the page surface */

      /* One badge geometry for every chip, tag and pill in the report. */
      --badge-size: 12.5px;
      --badge-pad: 4px 10px;
      --badge-weight: 700;
    }

    /* One badge geometry, shared by every chip and tag in the report. */
    .badge, .pct-chip, .flag-tag, .flag-btn.labelled {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--font-body); font-size: var(--badge-size);
      font-weight: var(--badge-weight); letter-spacing: .01em; line-height: 1.35;
      padding: var(--badge-pad); border-radius: var(--r-full);
      border: 1px solid currentColor; white-space: nowrap;
    }
    .badge svg, .pct-chip svg, .flag-tag svg { width: 13px; height: 13px; flex: none; }

    body {
      background:
        radial-gradient(1100px 560px at 82% -8%, rgba(126, 248, 147, 0.10), transparent 60%),
        radial-gradient(820px 460px at -10% 6%, rgba(198, 162, 255, 0.08), transparent 55%),
        var(--n-black);
      background-attachment: fixed;
      font-size: 17px;
    }
    .page { max-width: 1060px; margin: 0 auto; padding: 0 28px 90px; }
    .num { font-variant-numeric: tabular-nums; }

    /* ── Masthead: agency × client lockup + live status bar ─────── */
    .masthead {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
      gap: 20px; flex-wrap: wrap;
      padding: 16px 0 24px; margin-bottom: 34px;
      border-bottom: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    /* The two wordmarks are balanced optically, not by box height. Measured
       from the artwork: Founding's F is 84.4% of its artboard with the baseline
       at 83.6%; Moss's caps are 55.7% with the baseline at 56.8% (the spear
       descender eats the rest). So the boxes are bottom-aligned and Moss is
       pulled down by --moss-drop to put both baselines on the same line, then
       set to ~0.74x Founding's cap height, because matching cap heights lets
       Moss's heavy sans overpower Founding's light serif. The spear overhangs
       into the masthead's bottom padding. */
    .lockup {
      --fc-h: 22px; --moss-h: 24.6px; --moss-drop: 7px;
      display: flex; align-items: flex-end; gap: 15px; height: var(--fc-h);
    }
    .lockup img { display: block; width: auto; }
    .lockup img.fc { height: var(--fc-h); }
    .lockup img.moss { height: var(--moss-h); margin-bottom: calc(var(--moss-drop) * -1); }
    .lockup .x { width: 1px; height: var(--fc-h); background: var(--line); display: block; flex: none; }
    .lockup .role {
      font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: var(--dim-2); padding-left: 3px; line-height: var(--fc-h);
    }

    .status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .clock {
      display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
      font-size: 13px; line-height: 1.35; text-align: right;
    }
    .clock .now { color: var(--white); font-weight: 600; }
    .clock .now .live-dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: var(--mint); margin-right: 6px; vertical-align: middle;
      box-shadow: 0 0 0 0 rgba(126, 248, 147, 0.6); animation: pulse 2.4s ease-out infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(126, 248, 147, 0.5); }
      70% { box-shadow: 0 0 0 7px rgba(126, 248, 147, 0); }
      100% { box-shadow: 0 0 0 0 rgba(126, 248, 147, 0); }
    }
    .clock .fetched { color: var(--dim-2); }

    /* ── Buttons ────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      font-family: var(--font-body); font-size: 14.5px; font-weight: 600; color: var(--dim);
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm);
      padding: 8px 12px; cursor: pointer; transition: all .14s ease; white-space: nowrap;
    }
    .btn:hover { color: var(--white); background: var(--surface-2); border-color: rgba(255,255,255,0.22); }
    .btn:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
    .btn svg { width: 15px; height: 15px; flex: none; }
    .btn.icon-only { padding: 8px; }
    .btn[aria-busy="true"] svg { animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .menu-wrap { position: relative; }
    .menu {
      position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 226px;
      background: #101010; border: 1px solid var(--line); border-radius: var(--r-md);
      box-shadow: var(--shadow-2xl); padding: 6px; display: none;
    }
    .menu[data-open="true"] { display: block; }
    .menu button {
      display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
      font-family: var(--font-body); font-size: 14.5px; font-weight: 500; color: var(--dim);
      background: transparent; border: 0; border-radius: var(--r-xs); padding: 9px 10px; cursor: pointer;
    }
    .menu button:hover { background: var(--surface-2); color: var(--white); }
    .menu button svg { width: 14px; height: 14px; flex: none; opacity: .8; }
    .menu .menu-label {
      font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
      color: var(--dim-2); padding: 9px 10px 6px;
    }

    /* ── Title row + pill selectors ─────────────────────────────── */
    .title-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
    .report-title { font-family: var(--font-display); font-size: clamp(30px, 5vw, 44px); font-weight: 600; letter-spacing: -0.01em; line-height: 1.05; }
    .report-range { font-size: 15px; color: var(--dim); margin-top: 7px; }

    .pills { display: inline-flex; gap: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-full); padding: 4px; }
    .pills.scroll { display: flex; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
    .pills.scroll::-webkit-scrollbar { display: none; }
    .pill {
      font-family: var(--font-body); font-size: 15.5px; font-weight: 600; color: var(--dim);
      background: transparent; border: 0; cursor: pointer; padding: 9px 18px; border-radius: var(--r-full);
      transition: all .14s ease; white-space: nowrap;
    }
    .pill:hover { color: var(--white); }
    .pill[aria-pressed="true"], .pill[aria-selected="true"] { background: var(--mint); color: var(--n-black); }
    .pill .flag-dot {
      display: inline-block; width: 5px; height: 5px; border-radius: 50%;
      background: var(--warn); margin-left: 6px; vertical-align: middle;
    }

    /* ── Intro ──────────────────────────────────────────────────────
       Two columns rather than one: prose held to a comfortable measure by the
       column itself, so it no longer wraps short in the middle of a full-width
       page, and the definition cards stack alongside instead of below. */
    .intro {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.85fr);
      gap: 20px 44px; align-items: start; margin: 30px 0 46px;
    }
    .intro-copy p {
      font-size: 17px; line-height: 1.65; color: var(--dim);
      text-wrap: pretty; margin: 0 0 14px;
    }
    .intro-copy p:last-child { margin-bottom: 0; }
    .intro-copy b { color: var(--ink-strong); font-weight: 600; }
    @media (max-width: 860px) {
      .intro { grid-template-columns: 1fr; gap: 26px; }
      .intro-copy p { max-width: 62ch; }
    }

    .defs { display: grid; grid-template-columns: 1fr; gap: 12px; }
    /* Category identity comes from a soft wash off the top-left corner plus the
       swatch, rather than a hard accent rule down the edge. */
    .def {
      background: linear-gradient(155deg, var(--def-tint, transparent), transparent 62%), var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-md); padding: 16px 18px;
    }
    .def .def-name {
      display: flex; align-items: center; gap: 10px;
      font-size: 16px; font-weight: 700; margin-bottom: 8px;
    }
    .def .def-body { font-size: 15px; line-height: 1.65; color: var(--dim); }
    .def .def-body b { color: var(--ink-strong); font-weight: 600; }

    /* ── Section scaffolding ────────────────────────────────────── */
    .sec { margin-bottom: 52px; }
    .sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .sec-title { font-family: var(--font-display); font-size: 25px; font-weight: 600; margin: 0; }
    .sec-note { font-size: 14px; color: var(--dim-2); }
    .eyebrow {
      font-size: 12px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase;
      color: var(--dim-2);
    }

    /* ── Year-to-date hero panel ────────────────────────────────── */
    .hero {
      background: linear-gradient(158deg, rgba(255,255,255,0.062), rgba(255,255,255,0.022));
      border: 1px solid var(--line); border-radius: var(--r-xl);
      padding: 26px 28px 24px; box-shadow: var(--shadow-xl);
    }
    .hero-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; flex-wrap: wrap; margin-bottom: 24px; }
    .hero-total .eyebrow { margin-bottom: 9px; }
    .hero-total .v {
      font-family: var(--font-display); font-size: clamp(44px, 7.5vw, 66px); font-weight: 600;
      line-height: 1; letter-spacing: -0.015em;
      background: linear-gradient(100deg, #FFFFFF 0%, var(--mint) 26%, var(--holo-cyan) 45%,
                                  var(--holo-lavender) 64%, #FFFFFF 88%, var(--mint) 100%);
      background-size: 260% 100%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: sheen 14s linear infinite;
    }
    @keyframes sheen { to { background-position: -260% 0; } }

    /* Rotating comparison line. One idea at a time, cross-faded. */
    .funfact {
      margin-top: 14px; min-height: 1.5em;
      font-size: 15px; line-height: 1.5; color: var(--dim-2);
      display: flex; align-items: center; gap: 9px;
    }
    .funfact .ff-icon { color: var(--mint); opacity: .8; flex: none; display: block; }
    .funfact .ff-icon svg { width: 15px; height: 15px; display: block; }
    .funfact .ff-text {
      opacity: 1; transform: translateY(0);
      transition: opacity .6s ease, transform .6s ease;
      text-wrap: pretty;
    }
    .funfact .ff-text[data-out="true"] { opacity: 0; transform: translateY(-5px); }
    .funfact b { color: var(--ink-strong); font-weight: 600; }

    @media (prefers-reduced-motion: reduce) {
      .hero-total .v { animation: none; }
      .funfact .ff-text { transition: none; }
      .live-dot { animation: none !important; }
    }
    .hero-ctx { font-size: 15px; color: var(--dim); text-align: right; line-height: 1.7; }
    .hero-ctx strong { color: var(--ink-strong); font-weight: 600; }

    .split { border-top: 1px solid var(--line); }
    .srow { display: grid; grid-template-columns: minmax(150px, 1.1fr) minmax(180px, 1.5fr) auto; gap: 18px; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--line-soft); }
    .srow:last-child { border-bottom: 0; padding-bottom: 4px; }
    .srow-label { display: flex; align-items: center; gap: 10px; font-size: 16.5px; font-weight: 700; }
    .srow-label .sub { display: block; font-size: 14px; font-weight: 500; color: var(--dim-2); margin-top: 3px; letter-spacing: 0; }
    .swatch { width: 11px; height: 11px; border-radius: 3px; display: inline-block; flex: none; }

    /* The stat block that replaced "6h 44m used · 13% of 50h · 43h 16m remaining":
       value / allowance / percentage each get their own size, weight and color. */
    .stat { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .stat .used { font-family: var(--font-display); font-size: 27px; font-weight: 600; line-height: 1; letter-spacing: -0.01em; }
    .stat .of { font-size: 16px; font-weight: 500; color: var(--dim-2); }
    .pct-chip.ok { color: var(--ok); background: rgba(126, 248, 147, 0.10); }
    .pct-chip.over { color: var(--over); background: var(--over-surface); }
    .pct-chip.neutral { color: var(--dim); background: var(--surface); border-color: var(--line); }

    .meter { position: relative; height: 8px; background: rgba(255, 255, 255, 0.16); border-radius: var(--r-full); overflow: hidden; min-width: 120px; }
    .meter .fill { height: 100%; border-radius: var(--r-full); transition: width .5s cubic-bezier(.22,.9,.3,1); }
    .meter.thin { height: 6px; }

    /* Segmented meter: one tick per month of retainer, so the bar reads as
       "N months at 50h" rather than an abstract percentage. The ticks are cut
       in the page colour, giving the 2px gap between adjacent fills. */
    .meter.ticked { height: 11px; border-radius: 3px; }
    .meter.ticked .fill { border-radius: 2px 0 0 2px; }
    .meter.ticked .ticks { position: absolute; inset: 0; display: flex; pointer-events: none; }
    .meter.ticked .ticks span { flex: 1 1 0; border-right: 2px solid var(--tick-cut); }
    .meter.ticked .ticks span:last-child { border-right: 0; }

    .meter-scale {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 10px; margin-top: 8px; font-size: 13px; color: var(--dim-2);
    }
    .meter-scale .pace { color: var(--dim); }
    .meter-scale .pace strong { color: var(--ink-strong); font-weight: 700; }

    /* ── Data-integrity callout (annotation component) ──────────── */
    .callout {
      display: flex; gap: 11px; align-items: flex-start;
      background: rgba(245, 194, 107, 0.075);
      border: 1px solid rgba(245, 194, 107, 0.3);
      border-radius: var(--r-md); padding: 12px 14px;
      font-size: 15px; line-height: 1.65; color: var(--ink-strong);
    }
    .callout svg { width: 16px; height: 16px; flex: none; margin-top: 2px; color: var(--warn); }
    .callout strong { color: var(--warn); font-weight: 700; }
    .callout.inline { margin-top: 14px; }

    /* Compact inline flag: pill in tables, superscript beside a figure. */
    .flag-tag { color: var(--warn); background: var(--warn-surface); border-color: var(--warn-line); cursor: help; }

    .flag-note {
      display: flex; gap: 9px; align-items: flex-start;
      font-size: 13.5px; line-height: 1.6; color: var(--dim-2); margin: 14px 0 0;
    }
    .flag-note svg { width: 13px; height: 13px; flex: none; margin-top: 2px; color: var(--warn); }
    .flag-note strong { color: var(--warn); font-weight: 700; }

    /* ── Chart + interactive legend ─────────────────────────────── */
    .chart-wrap { position: relative; width: 100%; height: 260px; margin-bottom: 16px; }
    .legend { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-end; }
    /* The legend doubles as the headline totals for each series, so the figure
       is the dominant element and the label sits above it. */
    .legend-item {
      display: inline-flex; flex-direction: column; align-items: flex-start; gap: 4px;
      font-family: var(--font-body); text-align: left;
      background: transparent; border: 1px solid transparent; border-radius: var(--r-md);
      padding: 9px 14px; cursor: pointer; transition: all .14s ease;
    }
    .legend-item:hover, .legend-item:focus-visible { background: var(--surface); border-color: var(--line); outline: none; }
    .legend-item .lg-name {
      display: flex; align-items: center; gap: 8px;
      font-size: 14px; font-weight: 600; color: var(--dim); transition: color .14s ease;
    }
    .legend-item:hover .lg-name, .legend-item:focus-visible .lg-name { color: var(--white); }
    .legend-item .val {
      font-family: var(--font-display); font-size: 25px; font-weight: 600; line-height: 1.05;
      letter-spacing: -0.01em; color: var(--white); font-variant-numeric: tabular-nums;
      padding-left: 19px;
    }
    .legend-item[data-off="true"] { opacity: .38; }
    .legend-item[data-off="true"] .swatch { background: var(--dim-2) !important; }
    @media (max-width: 560px) { .legend-item .val { font-size: 21px; } }
    .legend-hint { font-size: 13.5px; color: var(--dim-2); margin: 0 0 12px 10px; }

    /* Key for the hatch fill, aligned under the Creative entry it describes. */
    .legend-key {
      display: flex; align-items: center; gap: 9px;
      margin: 10px 0 0 14px; font-size: 13.5px; color: var(--dim-2);
    }
    .legend-key b { color: var(--warn); font-weight: 700; }
    .hatch-swatch {
      width: 22px; height: 12px; border-radius: 3px; flex: none;
      border: 1px solid var(--creative-ink);
      background-color: var(--creative-fill);
      background-image: repeating-linear-gradient(45deg,
        rgba(255,255,255,0.42) 0 2px, transparent 2px 5px);
    }
    @media (max-width: 560px) { .legend-hint { margin: 4px 0 0; flex-basis: 100%; } }

    /* Flag button: opens the shared modal. Bare icon by default so a table cell
       is not squeezed by a box; the labelled variant takes the badge geometry. */
    .flag-btn {
      display: inline-flex; align-items: center; justify-content: center;
      font-family: var(--font-body); color: var(--warn);
      background: none; border: 0; padding: 0; cursor: pointer;
      transition: color .14s ease, transform .14s ease; vertical-align: middle;
    }
    .flag-btn svg { width: 16px; height: 16px; display: block; }
    .flag-btn:hover { color: var(--warn-strong); transform: scale(1.12); }
    .flag-btn:focus-visible { outline: 2px solid var(--warn); outline-offset: 3px; border-radius: 3px; }
    .flag-btn.labelled {
      gap: 6px; font-size: var(--badge-size); font-weight: var(--badge-weight);
      padding: var(--badge-pad); border: 1px solid var(--warn-line);
      background: var(--warn-surface); border-radius: var(--r-full);
    }
    .flag-btn.labelled:hover { transform: none; background: var(--warn-surface-2); border-color: var(--warn); }
    .flag-btn.labelled svg { width: 13px; height: 13px; }

    /* ── Modal ──────────────────────────────────────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 60; display: flex;
      align-items: center; justify-content: center; padding: 24px;
      background: rgba(0, 0, 0, 0.66); backdrop-filter: blur(3px);
    }
    .modal-backdrop[hidden] { display: none; }
    .modal {
      width: min(540px, 100%);
      background: linear-gradient(165deg, var(--warn-surface-2), var(--warn-surface)), #0E0C08;
      border: 1px solid var(--warn-line); border-radius: var(--r-lg);
      box-shadow: var(--shadow-2xl); padding: 22px 24px 24px;
    }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
    .modal-title {
      font-family: var(--font-display); font-size: 20px; font-weight: 600; margin: 0;
      display: flex; align-items: center; gap: 10px;
    }
    .modal-title svg { width: 18px; height: 18px; flex: none; color: var(--warn); }
    .modal-body { font-size: 15.5px; line-height: 1.7; color: var(--warn-body); }
    .modal-body p { margin: 0 0 12px; }
    .modal-body p:last-child { margin-bottom: 0; }
    .modal-body b { color: var(--warn-strong); font-weight: 700; }
    .modal .btn { color: var(--warn-body); border-color: var(--warn-line); background: var(--warn-surface); }
    .modal .btn:hover { color: var(--warn-strong); background: var(--warn-surface-2); border-color: var(--warn); }

    /* ── Monthly summary table ──────────────────────────────────── */
    .table { width: 100%; border-collapse: collapse; font-size: 15.5px; }
    .table th, .table td { padding: 12px 12px; border-bottom: 1px solid var(--line-soft); text-align: left; }
    .table th {
      font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      color: var(--dim-2); border-bottom: 1px solid var(--line); white-space: nowrap;
    }
    .table td.r, .table th.r { text-align: right; }
    .table tbody tr { cursor: pointer; transition: background .12s ease, box-shadow .12s ease; }
    .table tbody tr:hover { background: rgba(255,255,255,0.085); }
    .table tbody tr:hover td:first-child { box-shadow: inset 3px 0 0 var(--dim-2); }
    .table tbody tr[aria-current="true"] { background: rgba(126, 248, 147, 0.11); }
    .table tbody tr[aria-current="true"] td { color: var(--white); }
    .table tbody tr[aria-current="true"] td:first-child { box-shadow: inset 3px 0 0 var(--mint); }
    .table tbody tr[aria-current="true"] .mo { font-weight: 700; }
    .table .mo { font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .table .primary { font-weight: 600; color: var(--white); }
    .table .of { color: var(--dim-2); font-weight: 500; }
    .table .meter { width: 82px; margin-left: auto; }
    .table td.r, .table th.r { white-space: nowrap; }
    .table tfoot td {
      border-bottom: 0; border-top: 1px solid var(--line);
      font-weight: 700; padding-top: 14px; color: var(--white);
    }
    .table-scroll { overflow-x: auto; }
    @media (max-width: 680px) {
      .hide-sm { display: none; }
      .table th, .table td { padding: 12px 9px; }
    }

    /* Below this width the three-column stat rows can't hold their minimums,
       so the figure + meter drop to their own full-width line. */
    @media (max-width: 640px) {
      .srow { grid-template-columns: 1fr auto; gap: 12px 14px; }
      .srow > div:nth-child(2) { grid-column: 1 / -1; }
      .cat-head { grid-template-columns: 1fr; }
      .cat-head .stat { justify-content: flex-start; }
    }

    /* ── Month detail panel ─────────────────────────────────────── */
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 18px 26px 22px; box-shadow: var(--shadow-xl); }
    .panel .month-tabs { margin: 0 -8px 20px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
    .panel .month-tabs .pills { border: 0; background: transparent; padding: 0; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
    .panel-head .mname { font-family: var(--font-display); font-size: 24px; font-weight: 600; display: inline-flex; align-items: center; gap: 10px; }
    .panel-head .mtotal { font-size: 15px; color: var(--dim); }
    .panel-head .mtotal strong { color: var(--white); font-weight: 700; font-size: 16.5px; }

    .cat { margin-top: 26px; }
    .cat-head { display: grid; grid-template-columns: minmax(140px, 1fr) auto; gap: 14px 18px; align-items: center; margin-bottom: 6px; }
    .cat-head .meter { grid-column: 1 / -1; }
    .row { display: flex; align-items: center; gap: 13px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
    .row:last-child { border-bottom: 0; }
    .row .name { flex: 1 1 0; min-width: 0; font-size: 15.5px; font-weight: 500; color: var(--ink-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .track { flex: 0 0 130px; height: 6px; background: rgba(255, 255, 255, 0.14); border-radius: var(--r-full); overflow: hidden; }
    .row .track .fill { display: block; height: 100%; border-radius: var(--r-full); }
    .row .hrs { flex: 0 0 72px; font-size: 15.5px; font-weight: 600; color: var(--white); text-align: right; font-variant-numeric: tabular-nums; }
    .row .link {
      flex: none; display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 6px; color: var(--dim-2);
      border: 1px solid transparent; transition: all .14s ease;
    }
    .row .link:hover { color: var(--mint); background: var(--surface-2); border-color: var(--line); }
    .row .link svg { width: 14px; height: 14px; }
    .row .link.placeholder { opacity: .22; pointer-events: none; }
    .empty-note { font-size: 15px; color: var(--dim-2); font-style: italic; margin: 6px 0 0; }
    @media (max-width: 560px) { .row .track { display: none; } }

    /* ── States + footer ────────────────────────────────────────── */
    .state { text-align: center; padding: 80px 20px; color: var(--dim); font-size: 17px; }
    .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--mint); animation: spin 1s linear infinite; margin: 0 auto 18px; }
    .err { color: var(--over); }
    .err code { display: block; margin-top: 12px; color: var(--dim); font-size: 14.5px; word-break: break-word; }

    .foot {
      margin-top: 64px; padding-top: 8px;
      display: flex; justify-content: space-between; align-items: center; gap: 18px; flex-wrap: wrap;
      font-size: 14px; color: var(--dim-2); line-height: 1.7;
    }
    .foot-brand { display: flex; flex-direction: column; gap: 9px; max-width: 62ch; }
    .foot-fine { font-size: 14px; line-height: 1.7; color: var(--dim-2); margin: 0; max-width: 46ch; text-wrap: pretty; }
    .foot-link {
      color: var(--mint); text-decoration: underline; text-underline-offset: 3px;
      text-decoration-thickness: 1px; text-decoration-color: rgba(126, 248, 147, 0.45);
      transition: text-decoration-color .14s ease, color .14s ease;
    }
    .foot-link:hover { text-decoration-color: var(--mint); }
    .foot-link.primary {
      display: inline-flex; align-items: center; gap: 9px; width: fit-content;
      font-size: 15px; font-weight: 600; color: var(--white);
      text-decoration-color: rgba(255, 255, 255, 0.3);
    }
    .foot-link.primary:hover { color: var(--mint); text-decoration-color: var(--mint); }
    .foot-link.primary svg { width: 13px; height: 13px; opacity: .7; }
    .foot img { height: 17px; width: auto; display: block; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* ── Print / Save-as-PDF ─────────────────────────────────────
       Re-point the tokens rather than patching selector by selector, so
       every colour that inherits from them flips with one change. The
       brand hues are re-stepped for contrast against white paper, which
       also carries the derived --creative-ink / --noncreative-ink / --ok. */
    @media print {
      :root {
        --mint: #147A38;
        --holo-lavender: #5E3B96;
        --creative-fill: #2E9950;
        --noncreative-fill: #8461BE;
        --warn: #9A6512;
        --over: #B3261E;
        --white: #111111;
        --text: #111111;
        --ink-strong: rgba(0, 0, 0, 0.92);
        --tick-cut: #FFFFFF;
        --dim: rgba(0, 0, 0, 0.70);
        --dim-2: rgba(0, 0, 0, 0.55);
        --line: rgba(0, 0, 0, 0.18);
        --line-soft: rgba(0, 0, 0, 0.10);
        --surface: transparent;
        --surface-2: rgba(0, 0, 0, 0.10);
        --warn-strong: #6E4406;
        --warn-body: #3B2E15;
        --warn-surface: #FCF6EA;
        --warn-surface-2: #F7EBD5;
        --warn-line: #D9B676;
      }
      /* Gradient text does not print; fall back to solid ink. */
      .hero-total .v {
        background: none; -webkit-text-fill-color: #111; color: #111; animation: none;
      }
      .meter { background: rgba(0, 0, 0, 0.12); }
      body { background: #fff !important; color: #111; font-size: 10.5pt; }
      .page { max-width: none; padding: 0; }
      .masthead { position: static; background: none; backdrop-filter: none; padding-top: 0; }
      .lockup img { filter: invert(1); }
      .status, .pills, .sec-note, .row .link, .menu-wrap, .flag-btn { display: none !important; }
      .hero, .panel { background: none !important; box-shadow: none; }
      .sec { break-inside: avoid; margin-bottom: 26px; }
      .table tbody tr[aria-current="true"] { background: none; }
      .callout { background: var(--warn-surface); border-color: var(--warn-line); color: var(--warn-body); }
      .callout strong, .flag-note strong, .flag-note svg, .callout svg { color: #8A5A0F; }
      a { color: #111 !important; }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="lockup">
        <img class="fc" src="assets/fc-wordmark-white.svg" alt="Founding Creative" />
        <span class="x" aria-hidden="true"></span>
        <img class="moss" src="assets/moss-wordmark-white.svg" alt="Moss" />
      </div>

      <div class="status">
        <div class="clock">
          <span class="now"><span class="live-dot" aria-hidden="true"></span><span id="clockNow">…</span></span>
          <span class="fetched" id="clockFetched">Loading data…</span>
        </div>
        <button class="btn icon-only" id="refreshBtn" title="Refresh data from ClickUp" aria-label="Refresh data from ClickUp"></button>
        <div class="menu-wrap">
          <button class="btn" id="exportBtn" aria-haspopup="true" aria-expanded="false">Export</button>
          <div class="menu" id="exportMenu" role="menu"></div>
        </div>
      </div>
    </header>

    <div class="title-row">
      <div>
        <h1 class="report-title">Hours Report</h1>
        <div class="report-range" id="range"></div>
      </div>
      <div class="pills" id="years" role="group" aria-label="Select year"></div>
    </div>

    <div id="content"></div>

    <footer class="foot">
      <div class="foot-brand">
        <a class="foot-link primary" href="https://foundingcreative.com" target="_blank" rel="noopener">
          <img src="assets/fc-icon-white.svg" alt="" />
          <span>foundingcreative.com</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
        </a>
        <p class="foot-fine">
          Happy to walk through any line item with you.
          <a class="foot-link" href="https://calendar.google.com/calendar/u/0/appointments/schedules/AcZssZ05BDuPiNgyfpK6HRFzchDUrBoX2SjOj_dGFp47_xWtYoovrxOv1kLTSdDIoXCudPLii9WVIFpX" target="_blank" rel="noopener">Book a meeting</a>
          or <a class="foot-link" href="https://foundingcreative.com/contact-us/" target="_blank" rel="noopener">send us a message</a>.
        </p>
      </div>
      <span id="footStamp"></span>
    </footer>

    <!-- Reusable detail modal: used by the data-integrity flags, and available
         to any future note that would otherwise clutter the layout. -->
    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-head">
          <h2 class="modal-title" id="modalTitle"></h2>
          <button class="btn icon-only" id="modalClose" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>
  </div>

  <script>
    /* ═══════════════════════════════════════════════════════════════
       Config
       ═══════════════════════════════════════════════════════════════ */
    var API_BASE = new URLSearchParams(location.search).get('api') || '/api/time';
    var CURRENT_YEAR = new Date().getFullYear();
    var YEAR = parseInt(new URLSearchParams(location.search).get('year')) || CURRENT_YEAR;
    var YEAR_OPTIONS = [CURRENT_YEAR, CURRENT_YEAR - 1];
    var BUDGET = 50;

    var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    var MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    // Two categorical series. `fill` is the mark color (brand hue, stepped into
    // the dark-mode lightness band); `ink` is the full-brand value used for
    // strokes, swatches and figures.
    var CATS = [
      { key: 'creative',    label: 'Creative',     budgeted: true,
        fill: '#27AC4B', ink: '#7EF893',                                 // literals: Chart.js canvas
        fillVar: 'var(--creative-fill)', inkVar: 'var(--creative-ink)',  // DOM: re-pointable per media
        tint: 'rgba(126, 248, 147, 0.10)',
        items: 'creativeItems', hours: 'creative' },
      { key: 'nonCreative', label: 'Other', budgeted: false,
        fill: '#9B77D0', ink: '#C6A2FF',
        fillVar: 'var(--noncreative-fill)', inkVar: 'var(--noncreative-ink)',
        tint: 'rgba(198, 162, 255, 0.10)',
        items: 'nonCreativeItems', hours: 'nonCreative' }
    ];

    /* Data-integrity annotations. Each entry flags a (year, months, series)
       slice as not fully trustworthy, and surfaces as: a hatched bar + marker
       on the chart, a tag in the summary table and month tabs, and a callout
       in the month detail panel. Remove an entry once its data is repaired. */
    var DATA_FLAGS = [
      {
        id: 'moss-2026-creative-jan-may',
        year: 2026,
        months: [0, 1, 2, 3, 4],           // Jan–May
        series: 'creative',
        label: 'Under-reported',
        detail: 'Creative hours for January–May 2026 come from a partially corrupt ' +
                'time-tracking export. Actual usage was higher than shown; we are ' +
                'reconstructing the missing entries and will restate these months.'
      }
    ];

    function flagFor(year, monthIdx, seriesKey) {
      for (var i = 0; i < DATA_FLAGS.length; i++) {
        var f = DATA_FLAGS[i];
        if (f.year === year && f.series === seriesKey && f.months.indexOf(monthIdx) !== -1) return f;
      }
      return null;
    }
    function flagsInRange(year, range, seriesKey) {
      var out = [];
      range.forEach(function (m) {
        var f = flagFor(year, m.month, seriesKey);
        if (f && out.indexOf(f) === -1) out.push(f);
      });
      return out;
    }

    var chart = null;
    var state = { months: [], range: [], selected: null, hidden: {}, generatedAt: null };

    /* ═══════════════════════════════════════════════════════════════
       Formatting helpers
       ═══════════════════════════════════════════════════════════════ */
    function fmtH(h) {
      if (h === null || h === undefined) return '0h';
      var hrs = Math.floor(h), mins = Math.round((h - hrs) * 60);
      if (mins === 60) { hrs += 1; mins = 0; }
      if (hrs === 0 && mins === 0) return '0h';
      if (hrs === 0) return mins + 'm';
      if (mins === 0) return hrs + 'h';
      return hrs + 'h ' + mins + 'm';
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }
    function pctOf(used, budget) { return budget > 0 ? Math.round((used / budget) * 100) : 0; }

    /* Using the retainer is the point, so 90% is not a warning state. Green
       holds to the cap and only going over turns red. Fullness is carried by
       opacity instead, so a nearly-spent month still reads as more emphatic
       than a quiet one. Yellow stays reserved for data integrity. */
    function usageFill(pct) {
      if (pct > 100) return 'var(--over)';
      var a = 0.55 + 0.45 * Math.min(1, Math.max(0, pct / 100));
      return 'rgba(39, 172, 75, ' + a.toFixed(2) + ')';
    }
    function repeat(s, n) { return new Array(Math.max(0, n) + 1).join(s); }
    function fmtMonths(n) { return (Math.round(n * 10) / 10).toFixed(1); }
    function pctTone(pct) { return pct > 100 ? 'over' : 'ok'; }
    function pctColor(pct) { return pct > 100 ? 'var(--over)' : 'var(--ok)'; }

    var ICONS = {
      refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>',
      download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
      printer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>',
      external: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>',
      alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
      info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
      spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3"/></svg>',
      close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
    };

    /* ═══════════════════════════════════════════════════════════════
       Live clock + freshness
       ═══════════════════════════════════════════════════════════════ */
    function fmtDateTime(d) {
      return d.toLocaleString(undefined, {
        weekday: 'short', month: 'short', day: 'numeric',
        hour: 'numeric', minute: '2-digit', second: '2-digit', timeZoneName: 'short'
      });
    }
    function relTime(d) {
      var s = Math.max(0, Math.round((Date.now() - d.getTime()) / 1000));
      if (s < 10) return 'just now';
      if (s < 60) return s + 's ago';
      if (s < 3600) return Math.round(s / 60) + 'm ago';
      return Math.round(s / 3600) + 'h ago';
    }
    function tickClock() {
      document.getElementById('clockNow').textContent = fmtDateTime(new Date());
      var el = document.getElementById('clockFetched');
      if (state.generatedAt) {
        el.textContent = 'Data updated ' + relTime(state.generatedAt) +
          ' · ' + state.generatedAt.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
      }
      var stamp = document.getElementById('footStamp');
      if (stamp && state.generatedAt) {
        stamp.textContent = 'Live from ClickUp · generated ' + fmtDateTime(state.generatedAt);
      }
    }

    /* ═══════════════════════════════════════════════════════════════
       Data shaping
       ═══════════════════════════════════════════════════════════════ */
    function normalize(data) {
      return (data.months || []).map(function (m) {
        return {
          month: m.month,
          creative: m.retainerHours || 0,
          nonCreative: m.sowHours || 0,
          total: (m.retainerHours || 0) + (m.sowHours || 0),
          creativeItems: m.retainerItems || [],
          nonCreativeItems: m.sowItems || []
        };
      });
    }
    function sortItems(items) {
      return items.slice().sort(function (a, b) { return b.hours - a.hours; });
    }
    function totals() {
      var t = { creative: 0, nonCreative: 0, total: 0 };
      state.range.forEach(function (m) {
        t.creative += m.creative; t.nonCreative += m.nonCreative; t.total += m.total;
      });
      return t;
    }
    /* Months of retainer the client has actually paid for, which is not the same
       as the months that happen to carry tracked time: the retainer accrues on
       the 1st whether or not anyone logs hours. For the current year that runs
       from the first tracked month through the month we are in now; for a past
       year it runs through the last month with time on it. */
    function allowanceMonths() {
      var first = state.range[0].month;
      var last = state.range[state.range.length - 1].month;
      if (YEAR === CURRENT_YEAR) last = Math.max(last, new Date().getMonth());
      return last - first + 1;
    }
    function allowance() { return BUDGET * allowanceMonths(); }

    /* ═══════════════════════════════════════════════════════════════
       Load
       ═══════════════════════════════════════════════════════════════ */
    function renderYears() {
      var el = document.getElementById('years');
      el.innerHTML = YEAR_OPTIONS.map(function (y) {
        return '<button class="pill" data-y="' + y + '" aria-pressed="' + (y === YEAR) + '">' + y + '</button>';
      }).join('');
      el.querySelectorAll('button').forEach(function (b) {
        b.addEventListener('click', function () {
          if (YEAR === parseInt(b.dataset.y)) return;
          YEAR = parseInt(b.dataset.y);
          renderYears();
          load();
        });
      });
    }

    function load(manual) {
      var content = document.getElementById('content');
      var btn = document.getElementById('refreshBtn');
      btn.setAttribute('aria-busy', 'true');
      if (!manual) content.innerHTML = '<div class="state"><div class="spinner"></div>Loading ' + YEAR + ' hours…</div>';
      document.getElementById('range').textContent = '';
      if (chart) { chart.destroy(); chart = null; }

      // Cache-bust so the refresh button is a genuine round trip to ClickUp.
      var url = API_BASE + '?year=' + YEAR + '&_=' + Date.now();
      fetch(url, { cache: 'no-store' })
        .then(function (r) {
          return r.text().then(function (t) {
            if (!r.ok) throw new Error('API ' + r.status + ': ' + t.slice(0, 200));
            return JSON.parse(t);
          });
        })
        .then(render)
        .catch(function (e) {
          content.innerHTML = '<div class="state err">Couldn’t load data.<code>' + esc(e.message) + '</code>' +
            '<div style="margin-top:12px;color:var(--dim);">Confirm <b>CLICKUP_TOKEN</b> is set in Vercel and the API is reachable at <code>' + esc(API_BASE) + '</code>.</div></div>';
        })
        .then(function () { btn.removeAttribute('aria-busy'); });
    }

    /* ═══════════════════════════════════════════════════════════════
       Render
       ═══════════════════════════════════════════════════════════════ */
    function render(data) {
      BUDGET = data.retainerBudget || 50;
      state.generatedAt = data.generatedAt ? new Date(data.generatedAt) : new Date();
      state.months = normalize(data);

      var active = [];
      state.months.forEach(function (m) { if (m.total > 0) active.push(m.month); });

      var content = document.getElementById('content');
      if (!active.length) {
        document.getElementById('range').textContent = YEAR;
        content.innerHTML = '<div class="state">No tracked hours for ' + YEAR + ' yet.</div>';
        tickClock();
        return;
      }

      var first = active[0], last = active[active.length - 1];
      state.range = state.months.slice(first, last + 1);
      if (state.selected === null || state.selected < first || state.selected > last) state.selected = last;

      document.getElementById('range').textContent =
        MONTH_NAMES[first] + ' – ' + MONTH_NAMES[last] + ' ' + YEAR + ' · ' + state.range.length +
        (state.range.length === 1 ? ' month' : ' months') + ' of tracked time';

      content.innerHTML =
        ledeHtml() +
        heroHtml() +
        overviewHtml() +
        summaryHtml() +
        detailHtml();

      wireLegend();
      wireSummaryTable();
      renderMonthTabs();
      renderMonthPanel();
      drawChart();
      startFunFacts(totals().total);
      tickClock();
    }

    /* ── Intro ──────────────────────────────────────────────────── */
    function ledeHtml() {
      var h = '<section class="intro"><div class="intro-copy">';
      h += '<p>This is a live view of the hours we have delivered for Moss. Every figure is pulled ' +
           'straight from our ClickUp time tracking when the page loads, with no manual entry and no ' +
           'rounding in our favour. We publish it because you should be able to see exactly what you ' +
           'are paying for, month by month and task by task.</p>';
      h += '<p>Where a task was tracked in ClickUp, its line item links straight to it, so you can ' +
           'open the work itself. Some time is logged against work that never got a ClickUp task, in ' +
           'which case no link appears. Closing those gaps is what the data note is about.</p>';
      h += '</div>';

      h += '<div class="defs">';
      h += '<div class="def" style="--def-tint:' + CATS[0].tint + '">' +
           '<div class="def-name"><span class="swatch" style="background:' + CATS[0].inkVar + '"></span>Creative</div>' +
           '<div class="def-body">Your monthly retainer. <b>' + BUDGET + ' hours every month</b>, covering ongoing ' +
           'design and brand work. This is the budget the meters below measure against.</div></div>';
      h += '<div class="def" style="--def-tint:' + CATS[1].tint + '">' +
           '<div class="def-name"><span class="swatch" style="background:' + CATS[1].inkVar + '"></span>Other</div>' +
           '<div class="def-body">Project work scoped and approved separately, under its own ' +
           '<b>statement of work (SOW)</b>. It sits outside the retainer and does not draw against those hours.</div></div>';
      h += '</div>';
      h += '</section>';
      return h;
    }

    /* ── Year-to-date hero ──────────────────────────────────────── */
    function heroHtml() {
      var t = totals(), allow = allowance(), pct = pctOf(t.creative, allow);
      var span = MONTH_ABBR[state.range[0].month] + '–' + MONTH_ABBR[state.range[state.range.length - 1].month];

      var h = '<section class="sec"><div class="hero">';
      h += '<div class="hero-top">';
      h += '<div class="hero-total"><div class="eyebrow">Total hours delivered · ' + YEAR + '</div>' +
           '<div class="v num">' + fmtH(t.total) + '</div>' +
           '<div class="funfact"><span class="ff-icon">' + ICONS.spark + '</span>' +
           '<span class="ff-text" id="funfact"></span></div></div>';
      h += '<div class="hero-ctx"><strong>' + span + ' ' + YEAR + '</strong><br>' +
           allowanceMonths() + ' ' + (allowanceMonths() === 1 ? 'month' : 'months') + ' of retainer · ' +
           BUDGET + 'h per month</div>';
      h += '</div>';

      h += '<div class="split">';

      // Creative is budgeted, so it gets the segmented meter and a % used.
      var months = allowanceMonths();
      var monthsWorth = t.creative / BUDGET;   // retainer-months actually consumed
      h += '<div class="srow">';
      h += '<div class="srow-label"><span class="swatch" style="background:' + CATS[0].inkVar + '"></span>' +
           '<span>Creative<span class="sub">' + allow + ' hours available so far this year</span></span></div>';
      h += '<div><div class="stat"><span class="used num" style="color:' + CATS[0].inkVar + '">' + fmtH(t.creative) + '</span>' +
           '<span class="of num">/ ' + allow + 'h</span></div>' +
           '<div class="meter ticked" style="margin-top:10px" role="img" aria-label="' + pct +
             ' percent of available retainer hours used, across ' + months + ' months">' +
           '<div class="fill" style="width:' + Math.min(100, pct) + '%;background:' + usageFill(pct) + '"></div>' +
           '<div class="ticks" aria-hidden="true">' + repeat('<span></span>', months) + '</div></div>' +
           '<div class="meter-scale"><span>Each segment is one month of retainer</span>' +
           '<span class="pace"><strong>' + fmtMonths(monthsWorth) + '</strong> of ' + months + ' months used</span></div></div>';
      h += '<div class="r"><span class="pct-chip ' + pctTone(pct) + '">' + pct + '% used</span></div>';
      h += '</div>';

      /* Other has no cap of its own, so instead of inventing one its bar is
         drawn at the same hours-per-pixel as the retainer meter above. Equal
         width means equal hours, which is what makes the two comparable. */
      var shareOfTotal = t.total > 0 ? Math.round((t.nonCreative / t.total) * 100) : 0;
      var otherPct = allow > 0 ? (t.nonCreative / allow) * 100 : 0;
      var otherOver = otherPct > 100;
      h += '<div class="srow">';
      h += '<div class="srow-label"><span class="swatch" style="background:' + CATS[1].inkVar + '"></span>' +
           '<span>' + CATS[1].label + '<span class="sub">Project work, billed outside the retainer</span></span></div>';
      h += '<div><div class="stat"><span class="used num" style="color:' + CATS[1].inkVar + '">' + fmtH(t.nonCreative) + '</span>' +
           '<span class="of">delivered</span></div>' +
           '<div class="meter" style="margin-top:10px" role="img" aria-label="' + fmtH(t.nonCreative) +
             ' of other work, drawn to the same scale as the retainer bar above">' +
           '<div class="fill" style="width:' + Math.min(100, otherPct) + '%;background:' + CATS[1].fillVar + '"></div></div>' +
           '<div class="meter-scale"><span>Same scale as the bar above</span>' +
           '<span class="pace">' + (otherOver
             ? '<strong>more</strong> than the whole retainer to date'
             : '<strong>' + Math.round(otherPct) + '%</strong> of a retainer-sized bar') + '</span></div></div>';
      h += '<div class="r"><span class="pct-chip neutral">' + shareOfTotal + '% of total</span></div>';
      h += '</div>';

      h += '</div>'; // .split
      h += '</div></section>';
      return h;
    }

    function calloutHtml(flag, inline) {
      return '<div class="callout' + (inline ? ' inline' : '') + '">' + ICONS.alert +
        '<span><strong>' + esc(flag.label) + ' · ' + monthSpanLabel(flag) + '.</strong> ' + esc(flag.detail) + '</span></div>';
    }
    // Compact one-liner used where the full callout would be a third repeat.
    function flagNoteHtml(flag, text) {
      return '<p class="flag-note">' + ICONS.alert + '<span><strong>' + esc(monthSpanLabel(flag)) +
        '</strong> ' + esc(text) + '</span></p>';
    }
    function monthSpanLabel(flag) {
      var ms = flag.months.slice().sort(function (a, b) { return a - b; });
      var label = ms.length > 1 ? MONTH_ABBR[ms[0]] + '–' + MONTH_ABBR[ms[ms.length - 1]] : MONTH_ABBR[ms[0]];
      return label + ' ' + flag.year + ' Creative';
    }
    /* A compact affordance that opens the shared modal. Same behaviour on
       desktop and touch, so there is no hover-only information. */
    function flagBtnHtml(flag, labelled) {
      return '<button type="button" class="flag-btn' + (labelled ? ' labelled' : '') +
        '" data-flag="' + esc(flag.id) + '" aria-label="' + esc(flag.label) + ', read the data note">' +
        ICONS.alert + (labelled ? esc(flag.label) : '') + '</button>';
    }

    /* ── Monthly overview ───────────────────────────────────────── */
    function overviewHtml() {
      var t = totals();
      var h = '<section class="sec"><div class="sec-head">' +
        '<h2 class="sec-title">Monthly overview</h2></div>';
      h += '<div class="chart-wrap"><canvas id="overviewChart" role="img" ' +
        'aria-label="Grouped bar chart of Creative and Other hours by month"></canvas></div>';
      h += '<div class="legend" id="legend">';
      CATS.forEach(function (c, i) {
        h += '<button class="legend-item" data-i="' + i + '" data-off="false" aria-pressed="true">' +
          '<span class="lg-name"><span class="swatch" style="background:' + c.inkVar + '"></span>' + c.label + '</span>' +
          '<span class="val">' + fmtH(t[c.hours]) + '</span></button>';
      });
      h += '<span class="legend-hint">Hover to isolate a series, click to hide it</span>';
      h += '</div>';

      // The hatch key belongs with the legend, not in a separate warning box.
      var flags = flagsInRange(YEAR, state.range, 'creative');
      if (flags.length) {
        h += '<div class="legend-key"><span class="hatch-swatch" aria-hidden="true"></span>' +
             '<span>Hatched bars are <b>' + esc(flags[0].label.toLowerCase()) + '</b>. ' +
             'Select one for detail.</span></div>';
      }
      h += '</section>';
      return h;
    }

    /* ── Monthly summary table (high level, moved above detail) ─── */
    function summaryHtml() {
      var t = totals(), allow = allowance(), ytdPct = pctOf(t.creative, allow);

      var h = '<section class="sec"><div class="sec-head">' +
        '<h2 class="sec-title">Summary by month</h2>' +
        '<span class="sec-note">Select a row to jump to its detail</span></div>';
      h += '<div class="table-scroll"><table class="table"><thead><tr>' +
        '<th>Month</th>' +
        '<th class="r">Creative</th>' +
        '<th class="r hide-sm">Used</th>' +
        '<th class="r hide-sm"><span class="sr-only">Creative usage meter</span></th>' +
        '<th class="r">' + CATS[1].label + '</th>' +
        '<th class="r">Total</th>' +
        '</tr></thead><tbody>';

      state.range.forEach(function (m) {
        var pct = pctOf(m.creative, BUDGET);
        var flag = flagFor(YEAR, m.month, 'creative');
        h += '<tr data-m="' + m.month + '" aria-current="' + (m.month === state.selected) + '">';
        h += '<td><span class="mo">' + MONTH_NAMES[m.month] + (flag ? flagBtnHtml(flag) : '') + '</span></td>';
        h += '<td class="r num"><span class="primary">' + fmtH(m.creative) + '</span> <span class="of">/ ' + BUDGET + 'h</span></td>';
        h += '<td class="r num hide-sm" style="color:' + pctColor(pct) + ';font-weight:700">' + pct + '%</td>';
        h += '<td class="hide-sm"><div class="meter thin"><div class="fill" style="width:' + Math.min(100, pct) +
             '%;background:' + usageFill(pct) + '"></div></div></td>';
        h += '<td class="r num">' + fmtH(m.nonCreative) + '</td>';
        h += '<td class="r num primary">' + fmtH(m.total) + '</td>';
        h += '</tr>';
      });

      h += '</tbody><tfoot><tr>';
      h += '<td>Year to date</td>';
      h += '<td class="r num" style="color:' + CATS[0].inkVar + '">' + fmtH(t.creative) + ' <span class="of">/ ' + allow + 'h</span></td>';
      h += '<td class="r num hide-sm" style="color:' + pctColor(ytdPct) + '">' + ytdPct + '%</td>';
      h += '<td class="hide-sm"></td>';
      h += '<td class="r num" style="color:' + CATS[1].inkVar + '">' + fmtH(t.nonCreative) + '</td>';
      h += '<td class="r num">' + fmtH(t.total) + '</td>';
      h += '</tr></tfoot></table></div>';

      var flags = flagsInRange(YEAR, state.range, 'creative');
      if (flags.length) h += flagNoteHtml(flags[0], 'is flagged ⚠. Those months are under-reported and will be restated.');

      h += '</section>';
      return h;
    }

    /* ── Month detail (lowest level) ────────────────────────────── */
    function detailHtml() {
      return '<section class="sec"><div class="sec-head">' +
        '<h2 class="sec-title">Task detail by month</h2>' +
        '<span class="sec-note">Sorted by most hours. Links open the ClickUp task where one exists.</span></div>' +
        '<div class="panel">' +
          '<div class="month-tabs"><div class="pills scroll" id="monthTabs" role="tablist" aria-label="Select month"></div></div>' +
          '<div id="monthPanel" role="tabpanel"></div>' +
        '</div></section>';
    }

    function renderMonthTabs() {
      var el = document.getElementById('monthTabs');
      el.innerHTML = state.range.map(function (m) {
        var flagged = !!flagFor(YEAR, m.month, 'creative');
        return '<button class="pill" role="tab" data-m="' + m.month + '" aria-selected="' + (m.month === state.selected) + '">' +
          MONTH_ABBR[m.month] + (flagged ? '<span class="flag-dot" title="Known data issue"></span>' : '') + '</button>';
      }).join('');
      el.querySelectorAll('button').forEach(function (b) {
        b.addEventListener('click', function () { selectMonth(parseInt(b.dataset.m)); });
      });
    }

    function selectMonth(monthIdx) {
      state.selected = monthIdx;
      document.querySelectorAll('#monthTabs button').forEach(function (x) {
        x.setAttribute('aria-selected', parseInt(x.dataset.m) === monthIdx);
      });
      document.querySelectorAll('.table tbody tr').forEach(function (r) {
        r.setAttribute('aria-current', parseInt(r.dataset.m) === monthIdx);
      });
      renderMonthPanel();
    }

    function wireSummaryTable() {
      document.querySelectorAll('.table tbody tr').forEach(function (r) {
        r.addEventListener('click', function () {
          selectMonth(parseInt(r.dataset.m));
          document.getElementById('monthTabs').scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
      });
    }

    function renderMonthPanel() {
      var m = state.months[state.selected];
      var panel = document.getElementById('monthPanel');

      var monthFlag = flagFor(YEAR, m.month, 'creative') || flagFor(YEAR, m.month, 'nonCreative');
      var h = '<div class="panel-head">';
      h += '<span class="mname">' + MONTH_NAMES[m.month] + ' ' + YEAR +
           (monthFlag ? flagBtnHtml(monthFlag, true) : '') + '</span>';
      h += '<span class="mtotal">Total <strong class="num">' + fmtH(m.total) + '</strong></span>';
      h += '</div>';

      CATS.forEach(function (c) {
        var hours = m[c.hours], items = m[c.items] || [];

        h += '<div class="cat">';
        h += '<div class="cat-head">';
        h += '<span class="srow-label"><span class="swatch" style="background:' + c.inkVar + '"></span>' + c.label + '</span>';

        if (c.budgeted) {
          var pct = pctOf(hours, BUDGET);
          h += '<span class="stat" style="justify-content:flex-end">' +
               '<span class="used num" style="font-size:20px;color:' + c.inkVar + '">' + fmtH(hours) + '</span>' +
               '<span class="of num">/ ' + BUDGET + 'h</span>' +
               '<span class="pct-chip ' + pctTone(pct) + '">' + pct + '% used</span></span>';
          h += '<div class="meter thin"><div class="fill" style="width:' + Math.min(100, pct) +
               '%;background:' + usageFill(pct) + '"></div></div>';
        } else {
          h += '<span class="stat" style="justify-content:flex-end">' +
               '<span class="used num" style="font-size:20px;color:' + c.inkVar + '">' + fmtH(hours) + '</span>' +
               '<span class="of">delivered</span></span>';
        }
        h += '</div>';

        h += taskRows(items, c) || '<p class="empty-note">No ' + c.label.toLowerCase() + ' time tracked this month.</p>';
        h += '</div>';
      });

      panel.innerHTML = h;
    }

    function taskRows(items, cat) {
      if (!items || !items.length) return '';
      var max = items.reduce(function (a, t) { return Math.max(a, t.hours); }, 0);
      return '<div style="margin-top:6px">' + sortItems(items).map(function (t) {
        var w = max > 0 ? Math.round((t.hours / max) * 100) : 0;
        // Short tasks arrive rolled up into one row so the lines still sum to
        // the header; show how many were folded in.
        var name = t.aggregated
          ? t.name + ' (' + t.count + (t.count === 1 ? ' task' : ' tasks') + ')'
          : t.name;
        var link = t.url
          ? '<a class="link" href="' + esc(t.url) + '" target="_blank" rel="noopener" title="Open “' + esc(t.name) + '” in ClickUp" aria-label="Open ' + esc(t.name) + ' in ClickUp">' + ICONS.external + '</a>'
          : '<span class="link placeholder" title="No ClickUp link available" aria-hidden="true">' + ICONS.external + '</span>';
        return '<div class="row">' +
          '<span class="name" title="' + esc(name) + '">' + esc(name) + '</span>' +
          '<span class="track"><span class="fill" style="width:' + w + '%;background:' + cat.fillVar + '"></span></span>' +
          '<span class="hrs">' + fmtH(t.hours) + '</span>' +
          link +
        '</div>';
      }).join('') + '</div>';
    }

    /* ═══════════════════════════════════════════════════════════════
       Chart: grouped bars, hatched where data is flagged
       ═══════════════════════════════════════════════════════════════ */
    var patternCache = {};
    function hatch(color) {
      if (patternCache[color]) return patternCache[color];
      var c = document.createElement('canvas');
      c.width = c.height = 8;
      var g = c.getContext('2d');
      g.fillStyle = color; g.fillRect(0, 0, 8, 8);
      g.strokeStyle = 'rgba(255,255,255,0.42)'; g.lineWidth = 2;
      g.beginPath();
      g.moveTo(-2, 10); g.lineTo(10, -2);
      g.moveTo(2, 14); g.lineTo(14, 2);
      g.moveTo(-6, 6); g.lineTo(6, -6);
      g.stroke();
      patternCache[color] = g.createPattern(c, 'repeat');
      return patternCache[color];
    }

    // emphasis: index of the isolated series, or null for "show everything".
    var emphasis = null;
    var GHOST = 'rgba(255,255,255,0.06)';
    var GHOST_LINE = 'rgba(255,255,255,0.14)';

    function barColors(catIdx, which) {
      var c = CATS[catIdx];
      var ghosted = emphasis !== null && emphasis !== catIdx;
      return state.range.map(function (m) {
        if (ghosted) return which === 'fill' ? GHOST : GHOST_LINE;
        var flagged = !!flagFor(YEAR, m.month, c.key);
        if (which === 'fill') return flagged ? hatch(c.fill) : c.fill;
        return c.ink;
      });
    }

    function applyEmphasis(next) {
      emphasis = next;
      if (!chart) return;
      chart.data.datasets.forEach(function (ds, i) {
        ds.backgroundColor = barColors(i, 'fill');
        ds.borderColor = barColors(i, 'line');
      });
      chart.update('none');
    }

    function wireLegend() {
      document.querySelectorAll('#legend .legend-item').forEach(function (b) {
        var i = parseInt(b.dataset.i);
        b.addEventListener('mouseenter', function () { if (!state.hidden[i]) applyEmphasis(i); });
        b.addEventListener('focus', function () { if (!state.hidden[i]) applyEmphasis(i); });
        b.addEventListener('mouseleave', function () { applyEmphasis(null); });
        b.addEventListener('blur', function () { applyEmphasis(null); });
        b.addEventListener('click', function () {
          state.hidden[i] = !state.hidden[i];
          b.dataset.off = state.hidden[i] ? 'true' : 'false';
          b.setAttribute('aria-pressed', String(!state.hidden[i]));
          if (chart) { chart.setDatasetVisibility(i, !state.hidden[i]); chart.update(); }
          applyEmphasis(null);
        });
      });
    }

    /* The chart is drawn to a canvas, so the print stylesheet can't reach its
       axis text, gridlines or markers, so re-theme it around the print events. */
    var printing = false;
    function chartTheme(isPrint) {
      printing = isPrint;
      if (!chart) return;
      var s = chart.options.scales;
      s.x.ticks.color = isPrint ? 'rgba(0,0,0,0.62)' : 'rgba(255,255,255,0.62)';
      s.y.ticks.color = isPrint ? 'rgba(0,0,0,0.55)' : 'rgba(255,255,255,0.55)';
      s.y.grid.color = isPrint ? 'rgba(0,0,0,0.13)' : 'rgba(255,255,255,0.07)';
      chart.update('none');
    }
    window.addEventListener('beforeprint', function () { chartTheme(true); });
    window.addEventListener('afterprint', function () { chartTheme(false); });

    /* The same warning triangle as ICONS.alert, drawn onto the canvas so the
       chart marker matches the flag buttons and callouts elsewhere. Path2D
       takes the icon's own path data; a plain triangle stands in if the browser
       cannot parse it. */
    var ALERT_PATH = 'M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z';
    var alertPath2D = null;
    try { alertPath2D = new Path2D(ALERT_PATH); } catch (e) { alertPath2D = null; }

    function drawWarnIcon(g, cx, cy, size, color) {
      g.save();
      g.translate(cx - size / 2, cy - size / 2);
      g.scale(size / 24, size / 24);
      g.strokeStyle = color;
      g.lineWidth = 2.2;
      g.lineJoin = 'round';
      g.lineCap = 'round';
      if (alertPath2D) {
        g.stroke(alertPath2D);
      } else {
        g.beginPath();
        g.moveTo(12, 3); g.lineTo(22.5, 21); g.lineTo(1.5, 21); g.closePath();
        g.stroke();
      }
      g.beginPath(); g.moveTo(12, 9); g.lineTo(12, 13.5); g.stroke();
      g.beginPath(); g.moveTo(12, 17); g.lineTo(12.01, 17); g.stroke();
      g.restore();
    }

    // Marks flagged bars with the warning icon above the column.
    var flagMarkers = {
      id: 'flagMarkers',
      afterDatasetsDraw: function (c) {
        var g = c.ctx;
        c.data.datasets.forEach(function (ds, di) {
          if (!c.isDatasetVisible(di)) return;
          if (emphasis !== null && emphasis !== di) return;
          var meta = c.getDatasetMeta(di);
          meta.data.forEach(function (bar, bi) {
            var m = state.range[bi];
            if (!m || !flagFor(YEAR, m.month, CATS[di].key)) return;
            drawWarnIcon(g, bar.x, bar.y - 11, 15, printing ? '#9A6512' : '#F5C26B');
          });
        });
      }
    };

    function drawChart() {
      var el = document.getElementById('overviewChart');
      if (!el || typeof Chart === 'undefined') return;
      emphasis = null;

      chart = new Chart(el, {
        type: 'bar',
        plugins: [flagMarkers],
        data: {
          labels: state.range.map(function (m) { return MONTH_ABBR[m.month]; }),
          datasets: CATS.map(function (c, i) {
            return {
              label: c.label,
              data: state.range.map(function (m) { return m[c.hours]; }),
              backgroundColor: barColors(i, 'fill'),
              borderColor: barColors(i, 'line'),
              borderWidth: 1.5,
              borderRadius: 4,
              borderSkipped: 'bottom',
              hidden: !!state.hidden[i],
              categoryPercentage: 0.66,
              barPercentage: 0.86
            };
          })
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: { top: 22 } },
          /* Desktop gets the note on hover via the tooltip, but a tap on a touch
             device raises no tooltip at all, so a flagged bar is also clickable
             and opens the same modal the flag buttons use. */
          onClick: function (evt, elements) {
            if (!elements.length) return;
            var el = elements[0];
            var m = state.range[el.index];
            if (!m) return;
            var f = flagFor(YEAR, m.month, CATS[el.datasetIndex].key);
            if (f) openFlagModal(f.id);
          },
          onHover: function (evt, elements) {
            var over = elements.length && (function () {
              var m = state.range[elements[0].index];
              return m && flagFor(YEAR, m.month, CATS[elements[0].datasetIndex].key);
            })();
            evt.native.target.style.cursor = over ? 'pointer' : 'default';
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: 'rgba(12,12,12,0.96)',
              borderColor: 'rgba(255,255,255,0.14)',
              borderWidth: 1,
              padding: 12,
              titleFont: { size: 13, weight: '700' },
              bodyFont: { size: 13 },
              footerFont: { size: 12, weight: '500' },
              footerColor: '#F5C26B',
              displayColors: true,
              boxWidth: 9, boxHeight: 9, boxPadding: 5, usePointStyle: false,
              callbacks: {
                title: function (items) {
                  var m = state.range[items[0].dataIndex];
                  return MONTH_NAMES[m.month] + ' ' + YEAR;
                },
                label: function (c) {
                  var cat = CATS[c.datasetIndex];
                  var txt = ' ' + cat.label + ': ' + fmtH(c.parsed.y);
                  if (cat.budgeted) txt += '  ·  ' + pctOf(c.parsed.y, BUDGET) + '% of ' + BUDGET + 'h';
                  return txt;
                },
                footer: function (items) {
                  var notes = [];
                  items.forEach(function (it) {
                    var m = state.range[it.dataIndex];
                    var f = flagFor(YEAR, m.month, CATS[it.datasetIndex].key);
                    if (f && notes.indexOf(f.label) === -1) notes.push(f.label);
                  });
                  return notes.length ? '⚠ ' + notes.join(', ') + '. Select for detail.' : '';
                }
              }
            }
          },
          scales: {
            x: {
              ticks: { autoSkip: false, maxRotation: 0, font: { size: 13 }, color: 'rgba(255,255,255,0.62)' },
              grid: { display: false }, border: { display: false }
            },
            y: {
              ticks: { font: { size: 12.5 }, color: 'rgba(255,255,255,0.55)', callback: function (v) { return v + 'h'; }, padding: 6 },
              grid: { color: 'rgba(255,255,255,0.07)' },
              border: { display: false },
              beginAtZero: true, grace: '10%'
            }
          }
        }
      });
    }

    /* ═══════════════════════════════════════════════════════════════
       Comparison line

       A dense page of hour totals is hard to feel. Each of these turns the
       headline number into something with a shape, and they rotate slowly so
       the page has one small moving part. Every figure is computed from the
       real total, so they stay true as the number grows.
       ═══════════════════════════════════════════════════════════════ */
    var FUN_FACTS = [
      function (h) {
        return 'That is <b>' + fmt1(h / 24) + ' full days</b> of round-the-clock work, without stopping to sleep.';
      },
      function (h) {
        return 'Long enough to watch the extended Lord of the Rings trilogy <b>' + fmt1(h / 11.4) + ' times</b> back to back.';
      },
      function (h) {
        return 'The International Space Station would circle the Earth <b>' + Math.round(h / 1.533) + ' times</b> in that span.';
      },
      function (h) {
        return 'Enough time to fly <b>' + fmt1(h / 7.5) + ' round trips</b> between New York and London.';
      },
      function (h) {
        return 'A three-toed sloth, moving flat out, would cover <b>' + fmt1(h * 0.15) + ' miles</b>.';
      },
      function (h) {
        return 'That is <b>' + Math.round(h / 1.5) + ' sleep cycles</b>, if anyone were getting any.';
      },
      function (h) {
        return 'Sunlight takes 8 minutes 20 seconds to reach us. This is <b>' + Math.round(h * 60 / 8.33) + ' of those journeys</b>.';
      },
      function (h) {
        return 'Roughly <b>' + Math.round(h / 2.01) + ' marathons</b> at world-record pace.';
      },
      function (h) {
        return 'You could listen to every Beatles studio album <b>' + fmt1(h / 10.2) + ' times</b> through.';
      },
      function (h) {
        return 'About <b>' + fmt1(h / 8) + ' standard working days</b>, or ' + fmt1(h / 40) + ' working weeks.';
      },
      function (h) {
        return 'A hummingbird would beat its wings about <b>' + Math.round(h * 3600 * 53 / 1e6) + ' million times</b>.';
      },
      function (h) {
        return 'Long enough to boil <b>' + Math.round(h * 60 / 4) + ' kettles</b>, one after another.';
      }
    ];
    function fmt1(n) {
      return (Math.round(n * 10) / 10).toLocaleString(undefined, { maximumFractionDigits: 1 });
    }

    var factTimer = null, factIdx = 0, factOrder = [];
    function startFunFacts(totalHours) {
      var el = document.getElementById('funfact');
      if (!el || !(totalHours > 0)) return;
      if (factTimer) clearInterval(factTimer);

      // Shuffled once per render so a reload does not always open the same way.
      factOrder = FUN_FACTS.map(function (_, i) { return i; });
      for (var i = factOrder.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = factOrder[i]; factOrder[i] = factOrder[j]; factOrder[j] = tmp;
      }
      factIdx = 0;
      el.innerHTML = FUN_FACTS[factOrder[0]](totalHours);

      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      factTimer = setInterval(function () {
        factIdx = (factIdx + 1) % factOrder.length;
        var next = FUN_FACTS[factOrder[factIdx]](totalHours);
        if (reduce) { el.innerHTML = next; return; }
        el.dataset.out = 'true';
        setTimeout(function () {
          el.innerHTML = next;
          el.dataset.out = 'false';
        }, 600);
      }, 9000);
    }

    /* ═══════════════════════════════════════════════════════════════
       Modal
       ═══════════════════════════════════════════════════════════════ */
    var lastFocus = null;
    function openModal(titleHtml, bodyHtml) {
      lastFocus = document.activeElement;
      document.getElementById('modalTitle').innerHTML = titleHtml;
      document.getElementById('modalBody').innerHTML = bodyHtml;
      document.getElementById('modalBackdrop').hidden = false;
      document.getElementById('modalClose').focus();
    }
    function closeModal() {
      if (document.getElementById('modalBackdrop').hidden) return;
      document.getElementById('modalBackdrop').hidden = true;
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }
    function openFlagModal(flagId) {
      var flag = null;
      DATA_FLAGS.forEach(function (f) { if (f.id === flagId) flag = f; });
      if (!flag) return;
      openModal(ICONS.alert + esc(flag.label),
        '<p><b>' + esc(monthSpanLabel(flag)) + '</b></p><p>' + esc(flag.detail) + '</p>' +
        '<p>Line items for these months link to ClickUp where a task exists. Some of the ' +
        'missing time was never logged against a task at all, which is part of what we are ' +
        'reconstructing.</p>');
    }

    function wireModal() {
      document.getElementById('modalClose').innerHTML = ICONS.close;
      document.getElementById('modalClose').addEventListener('click', closeModal);
      document.getElementById('modalBackdrop').addEventListener('click', function (e) {
        if (e.target === this) closeModal();
      });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
      // Delegated so it covers flag buttons in any re-rendered section. Bound in
      // the capture phase: a flag button inside a summary-table row would
      // otherwise hit the row's own bubble listener first, selecting the month
      // before this handler could stop it.
      document.addEventListener('click', function (e) {
        var btn = e.target.closest ? e.target.closest('.flag-btn') : null;
        if (!btn) return;
        e.preventDefault();
        e.stopPropagation();
        openFlagModal(btn.dataset.flag);
      }, true);
    }

    /* ═══════════════════════════════════════════════════════════════
       Export
       ═══════════════════════════════════════════════════════════════ */
    function csvCell(v) {
      var s = String(v == null ? '' : v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }
    function download(filename, rows) {
      var csv = rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
      var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }
    function stampSuffix() {
      var d = state.generatedAt || new Date();
      return d.toISOString().slice(0, 10);
    }

    function exportSummary() {
      var t = totals(), allow = allowance();
      var rows = [['Month', 'Creative hours', 'Retainer budget (h)', 'Creative % used', 'Other hours (SOW)', 'Total hours', 'Data note']];
      state.range.forEach(function (m) {
        var f = flagFor(YEAR, m.month, 'creative');
        rows.push([MONTH_NAMES[m.month] + ' ' + YEAR, m.creative.toFixed(2), BUDGET,
                   pctOf(m.creative, BUDGET) + '%', m.nonCreative.toFixed(2), m.total.toFixed(2),
                   f ? f.label + ': ' + f.detail : '']);
      });
      rows.push([]);
      rows.push(['Year to date', t.creative.toFixed(2), allow, pctOf(t.creative, allow) + '%',
                 t.nonCreative.toFixed(2), t.total.toFixed(2), '']);
      rows.push([]);
      rows.push(['Generated', (state.generatedAt || new Date()).toISOString(), 'Source', 'ClickUp time tracking']);
      download('moss-hours-' + YEAR + '-summary-' + stampSuffix() + '.csv', rows);
    }

    function exportYear() {
      var t = totals(), allow = allowance(), months = allowanceMonths();
