<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moss · Hours Report</title>
  <link rel="icon" href="https://brand.foundingcreative.com/favicon.svg" />

  <!-- Founding Creative design-system tokens (fonts, colors, radius, shadows, spacing) -->
  <link rel="stylesheet" href="https://brand.foundingcreative.com/css/tokens.css" />

  <style>
    /* ─────────────────────────────────────────────────────────────
       Report-specific styling, layered on the DS dark scheme.

       Series colors: FC's brand mint / lavender hues, stepped into the
       dark-mode lightness band for the chart + meter fills, with the full
       brand values kept for strokes, swatches and text accents.
       ───────────────────────────────────────────────────────────── */
    :root {
      /* Series fills sit at matched lightness gaps below their brand ink, so the
         outline reads against the fill with the same weight in both colours:
         mint 0.884 over 0.654, lavender 0.779 over 0.549. */
      --creative-fill: #27AC4B;
      --creative-ink: var(--mint);                  /* #7EF893 */
      --noncreative-fill: #7F5CB2;
      --noncreative-ink: var(--holo-lavender);      /* #C6A2FF */

      /* Semantic status. Green means the retainer is being used, which is good
         all the way to 100%; only going over is a warning. Yellow is reserved
         for data integrity, never for utilisation. */
      --ok: var(--mint);
      --over: #FF8A80;

      --warn: #F5C26B;              /* base: icons, rules */
      --warn-strong: #FFD68F;       /* titles on a warn surface */
      --warn-body: #EBD3AE;         /* body copy on a warn surface */
      --warn-surface: rgba(245, 194, 107, 0.09);
      --warn-surface-2: rgba(245, 194, 107, 0.16);
      --warn-line: rgba(245, 194, 107, 0.38);

      /* Action colour. Deliberately neither series: mint is Creative and
         lavender is Other, so an affordance wearing either reads as data. */
      --action: var(--holo-cyan);
      --action-soft: rgba(105, 238, 255, 0.16);

      /* Cool grey ramp for selected surfaces. Neutral enough to sit under any
         series colour, with just enough blue in it to feel of a piece with the
         action colour rather than muddy. */
      --sel-row: rgba(214, 228, 242, 0.085);
      --sel-body: rgba(214, 228, 242, 0.05);

      --surface: rgba(255, 255, 255, 0.05);
      --surface-2: rgba(255, 255, 255, 0.10);
      --line: rgba(255, 255, 255, 0.14);
      --line-soft: rgba(255, 255, 255, 0.08);

      /* Text ramp. --dim-2 was 0.45, which measured 4.6:1 and was doing real
         work at 11 to 13px; the whole ramp is lifted for legibility. */
      --ink-strong: rgba(255, 255, 255, 0.92);
      --dim: rgba(255, 255, 255, 0.78);
      --dim-2: rgba(255, 255, 255, 0.62);
      --tick-cut: var(--n-black);   /* meter segment gaps: always the page surface */

      /* One badge geometry for every chip, tag and pill in the report. */
      --badge-size: 12.5px;
      --badge-pad: 4px 10px;
      --badge-weight: 700;

      /* A section heading and the series figures that float beside it are the
         two biggest things in any section, and picking their sizes separately
         is how they ended up matching. They are tied to the DS heading ramp
         instead, one rung apart, so the heading outranks the figures by
         construction and stays that way if the ramp ever moves.

         Each carries a fallback because the ramp is served from
         brand.foundingcreative.com: a colour or a radius failing to arrive is a
         blemish, a font size failing to arrive collapses a heading to body
         copy. */
      --t-section: var(--h5, 32px);
      --t-figure: var(--h6, 26px);
    }

    /* The DS ramp is a desktop ramp with no step of its own, so both rungs
       drop together here rather than each being nudged where it is used. */
    @media (max-width: 640px) {
      :root {
        --t-section: var(--h6, 26px);
        --t-figure: var(--text-lg, 20px);
      }
    }

    /* One badge geometry, shared by every chip and tag in the report. */
    .badge, .flag-tag, .flag-btn.labelled {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--font-body); font-size: var(--badge-size);
      font-weight: var(--badge-weight); letter-spacing: .01em; line-height: 1.35;
      padding: var(--badge-pad); border-radius: var(--r-full);
      border: 1px solid currentColor; white-space: nowrap;
    }
    .badge svg, .flag-tag svg { width: 13px; height: 13px; flex: none; }

    body {
      background:
        radial-gradient(1100px 560px at 82% -8%, rgba(126, 248, 147, 0.10), transparent 60%),
        radial-gradient(820px 460px at -10% 6%, rgba(198, 162, 255, 0.08), transparent 55%),
        var(--n-black);
      background-attachment: fixed;
      font-size: 17px;
    }
    .page { max-width: 1060px; margin: 0 auto; padding: 0 28px 90px; }
    .num { font-variant-numeric: tabular-nums; }

    /* Anything we scroll the reader to has to clear the sticky masthead.
       --mh is measured from the live element, because its height changes with
       the breakpoint and with how the clock string happens to wrap. */
    .sec, .table tbody tr {
      scroll-margin-top: calc(var(--mh, 96px) + 16px);
    }

    @media (max-width: 560px) { .page { padding: 0 18px 64px; } }

    /* ── Masthead ────────────────────────────────────────────────── */
    /* Just the agency mark now. The live clock and the refresh control moved to
       the footer: they are a note on how fresh the data is, which is a closing
       remark, not the first thing on the page. */
    .masthead {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center;
      padding: 18px 0 20px; margin-bottom: 30px;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    /* Only the agency mark sits up here now. The client's mark leads the report
       title instead, where it reads as the subject of the page rather than as
       half of a co-branded lockup, which also makes this template reusable for
       any retainer client without re-balancing two wordmarks. */
    .lockup { --fc-h: 30px; display: flex; align-items: center; height: var(--fc-h); }
    .lockup img { display: block; width: auto; height: var(--fc-h); }

    /* Locked square: the icon is centred rather than the box sized by padding. */
    #refreshBtn { width: 42px; height: 42px; padding: 0; border-radius: var(--r-md); }
    #refreshBtn svg { width: 18px; height: 18px; }
    /* A ticking seconds field in Manrope twitched the whole masthead once a
       second: measured, its digits run 7.47px to 8.00px wide, and it ships no
       tnum feature to even them out. So the readout is set in the platform's
       monospace face, where every digit is one advance by definition. It also
       suits what this is: a live instrument reading, not report copy. */
    .clock {
      display: flex; flex-direction: column; align-items: flex-end; gap: 3px;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 12px; line-height: 1.4; text-align: right; letter-spacing: -0.01em;
    }
    .clock .now { color: var(--white); font-weight: 600; }
    .clock .now .live-dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: var(--mint); margin-right: 6px; vertical-align: middle;
      box-shadow: 0 0 0 0 rgba(126, 248, 147, 0.6); animation: pulse 2.4s ease-out infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(126, 248, 147, 0.5); }
      70% { box-shadow: 0 0 0 7px rgba(126, 248, 147, 0); }
      100% { box-shadow: 0 0 0 0 rgba(126, 248, 147, 0); }
    }
    .clock .fetched { color: var(--dim-2); }

    @media (max-width: 700px) {
      .masthead { padding: 12px 0 14px; margin-bottom: 24px; }
      .lockup { --fc-h: 24px; }
      .btn { font-size: 14px; padding: 8px 11px; }
    }

    /* ── Buttons ────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      font-family: var(--font-body); font-size: 14.5px; font-weight: 600; color: var(--dim);
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm);
      padding: 8px 12px; cursor: pointer; transition: all .14s ease; white-space: nowrap;
    }
    .btn:hover { color: var(--white); background: var(--surface-2); border-color: rgba(255,255,255,0.22); }
    .btn:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
    .btn svg { width: 15px; height: 15px; flex: none; }
    .btn.icon-only { padding: 8px; }
    .btn[aria-busy="true"] svg { animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .menu-wrap { position: relative; }
    .menu {
      position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 226px;
      background: #101010; border: 1px solid var(--line); border-radius: var(--r-md);
      box-shadow: var(--shadow-2xl); padding: 6px; display: none;
    }
    .menu[data-open="true"] { display: block; }
    .menu button {
      display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
      font-family: var(--font-body); font-size: 14.5px; font-weight: 500; color: var(--dim);
      background: transparent; border: 0; border-radius: var(--r-xs); padding: 9px 10px; cursor: pointer;
    }
    .menu button:hover { background: var(--surface-2); color: var(--white); }
    .menu button svg { width: 14px; height: 14px; flex: none; opacity: .8; }
    .menu .menu-label {
      font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
      color: var(--dim-2); padding: 9px 10px 6px;
    }

    /* ── Title row + pill selectors ─────────────────────────────── */
    .title-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 30px; }
    /* Baseline-matching a wordmark to a text baseline only ever half-works:
       every client's artwork sits differently inside its own artboard, so the
       fix does not survive swapping the logo. Instead the mark gets a container
       of its own, centred inside a box that is the full height of the title
       stack beside it. The box does the alignment, not the artwork. */
    .title-id { display: flex; align-items: stretch; gap: 22px; min-width: 0; }
    .client-slot {
      display: flex; align-items: center; justify-content: center; flex: none;
      padding-right: 22px; border-right: 1px solid var(--line);
    }
    /* Measured from the artwork: the caps run 1.15 to 138.2 inside a 245.976
       artboard and the spear descends to 160.45, leaving 35% of the box empty
       below the mark. Centring the box therefore floats the visible letters
       high. The shift is the gap between the artboard's centre (123.0) and the
       cap band's centre (69.7), which is 21.7% of the rendered height, so the
       caps sit on the container's centre line instead of the box. */
    .client-slot .client-mark {
      display: block; width: auto; height: 38px; max-width: 190px;
      transform: translateY(21.7%);
    }
    .report-title {
      font-family: var(--font-display); font-size: clamp(30px, 5vw, 44px); font-weight: 600;
      letter-spacing: -0.01em; line-height: 1.05;
    }
    .report-range { font-size: 15px; color: var(--dim); margin-top: 7px; }


    @media (max-width: 560px) {
      .title-id { gap: 16px; }
      .client-slot { padding-right: 16px; }
      .client-slot .client-mark { height: 30px; max-width: 130px; }
    }

    /* Export sits in the heading of the section it exports, not in the masthead:
       from there it reads as "export this report", which is what it does,
       rather than as a global action that would follow you around the app. */
    .title-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 13px; }
    .sec-head .menu-wrap { margin-left: auto; }
    .export-link {
      display: inline-flex; align-items: center; gap: 7px;
      font-family: var(--font-body); font-size: 14.5px; font-weight: 600; color: var(--dim);
      background: transparent; border: 0; padding: 0; cursor: pointer;
      text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px;
      text-decoration-color: rgba(255, 255, 255, 0.3); white-space: nowrap;
      transition: color .14s ease, text-decoration-color .14s ease;
    }
    .export-link:hover { color: var(--white); text-decoration-color: var(--white); }
    .export-link:focus-visible { outline: 2px solid var(--action); outline-offset: 3px; border-radius: 2px; }
    .export-link svg { width: 14px; height: 14px; flex: none; }
    @media (max-width: 560px) {
      .title-row { margin-bottom: 24px; }
      .title-actions { flex-direction: row; align-items: center; gap: 16px; }
    }
    @media (max-width: 430px) { .export-link .x-long { display: none; } }

    .pills { display: inline-flex; gap: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-full); padding: 4px; }
    .pill {
      font-family: var(--font-body); font-size: 15.5px; font-weight: 600; color: var(--dim);
      background: transparent; border: 0; cursor: pointer; padding: 9px 18px; border-radius: var(--r-full);
      transition: all .14s ease; white-space: nowrap;
    }
    .pill:hover { color: var(--white); }
    .pill[aria-pressed="true"], .pill[aria-selected="true"] { background: var(--action); color: var(--n-black); }

    /* ── Section scaffolding ────────────────────────────────────────
       Each section is a dense visual in its own right, so the gap between them
       has to be wide enough to read as a break rather than as spacing inside
       one long block. */
    .sec { margin-bottom: 92px; }
    .sec:last-child { margin-bottom: 0; }
    .sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
    .sec-title {
      font-family: var(--font-display); font-size: var(--t-section); font-weight: 600;
      line-height: 1.2; letter-spacing: var(--tracking-display); margin: 0;
    }
    .sec-note { font-size: 14px; color: var(--dim-2); }
    .eyebrow {
      font-size: 12px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase;
      color: var(--dim-2);
    }

    /* ── Year-to-date hero panel ────────────────────────────────── */
    .hero {
      background: linear-gradient(158deg, rgba(255,255,255,0.062), rgba(255,255,255,0.022));
      border: 1px solid var(--line); border-radius: var(--r-xl);
      padding: 26px 28px 24px; box-shadow: var(--shadow-xl);
    }
    /* Two columns that share a top rail, so the eyebrows line up and the
       comparison reads as a second panel rather than text parked in the gap.
       The headline column is sized to its own content, which keeps the hairline
       beside it instead of stranded out in the middle of the card. */
    .hero-top {
      display: grid; grid-template-columns: auto minmax(0, 1fr);
      gap: 24px 38px; margin-bottom: 26px;
    }
    .hero-total { min-width: 0; }
    .hero-total .eyebrow, .funfact .eyebrow { margin-bottom: 9px; }
    /* The report's one piece of ornament, shared by the headline total and by
       the figure inside each comparison, so the two read as the same kind of
       number rather than as two unrelated highlights. */
    .grad {
      background: linear-gradient(100deg, #FFFFFF 0%, var(--mint) 26%, var(--holo-cyan) 45%,
                                  var(--holo-lavender) 64%, #FFFFFF 88%, var(--mint) 100%);
      background-size: 260% 100%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: sheen 14s linear infinite;
    }
    .hero-total .v {
      font-family: var(--font-display); font-size: clamp(44px, 7.5vw, 66px); font-weight: 600;
      line-height: 1; letter-spacing: -0.015em;
    }
    @keyframes sheen { to { background-position: -260% 0; } }

    /* Rotating comparison line, separated by the same hairline the card uses
       under this row.

       Every fact is in the DOM at once, stacked in one grid cell with only one
       shown, so the block is always as tall as the longest fact it could show
       and rotating cannot move anything under it. That replaced a reserved
       height that had to be re-measured per breakpoint whenever the copy or the
       type size changed. */
    .funfact {
      border-left: 1px solid var(--line); padding-left: 38px;
      line-height: 1.45; color: var(--dim);
    }
    .funfact { position: relative; }
    .funfact .ff-body { display: flex; align-items: flex-start; }
    /* Bottom right of the panel, quiet until wanted. */
    .ff-nav {
      display: flex; justify-content: flex-end; gap: 6px; margin-top: 14px;
      opacity: .5; transition: opacity .16s ease;
    }
    .funfact:hover .ff-nav, .ff-nav:focus-within { opacity: 1; }
    .ff-stack { display: grid; min-width: 0; }
    .ff-line {
      grid-area: 1 / 1; text-wrap: pretty;
      opacity: 0; visibility: hidden; transform: translateY(4px);
      transition: opacity .55s ease, transform .55s ease;
    }
    .ff-line[data-on="true"] { opacity: 1; visibility: visible; transform: none; }
    /* The figure and the subject: the only two things emphasised, and they are
       emphasised differently on purpose. The figure runs the same gradient as
       the headline total but cycles it faster, because at a fifth of the size
       the sheen has a fifth of the distance to travel and at the headline's
       pace it reads as a static wash. */
    .ff-n { font-weight: 700; animation-duration: 5.5s; }
    .ff-s { color: var(--white); font-weight: 700; }

    /* No icon: the eyebrow already says what this column is, and at this size
       the line is the loudest thing in the card on its own. */
    .funfact { font-size: 27px; }


    @media (prefers-reduced-motion: reduce) {
      .grad { animation: none; }
      .ff-line { transition: none; }
      .live-dot { animation: none !important; }
    }
    .hero-ctx { font-size: 15.5px; color: var(--dim); line-height: 1.6; margin-top: 12px; }
    .hero-ctx strong { color: var(--ink-strong); font-weight: 600; }

    /* Below this the two columns would fight over the same 400px, so they stack
       and the divider turns with them. */
    @media (max-width: 900px) {
      .hero-top { grid-template-columns: minmax(0, 1fr); gap: 20px; }
      .funfact { border-left: 0; border-top: 1px solid var(--line); padding-left: 0; padding-top: 20px; }
      .funfact .ff-body { max-width: 46ch; }
    }

    .split { border-top: 1px solid var(--line); padding-top: 22px; }
    /* Top-aligned, not centre-aligned: the label often runs to a second line on
       a narrow screen, and a swatch floating between the two lines reads as
       belonging to neither. */
    .srow-label { display: flex; align-items: flex-start; gap: 10px; font-size: 16.5px; font-weight: 700; }
    .srow-label > .swatch { margin-top: 6px; }
    .swatch { width: 11px; height: 11px; border-radius: 3px; display: inline-block; flex: none; }


    /* ── Category definitions, inside the hero card ──────────────────
       Answers "why is there a green series and a purple one?" and states the
       retainer terms once, in the place the reader meets the two colours. Kept
       deliberately light: the figures themselves are charted below, and a full
       roster of tiles here never filled its row on a small team. */
    /* Each definition is sized to its own text rather than to the taller of the
       two, so its colour bar measures that definition and not the row. */
    .defs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 36px; align-items: start; }
    .def { display: flex; gap: 14px; align-items: stretch; }
    /* The swatch runs the full height of the text beside it: at this size the
       colour is the label, so it is given enough of itself to read as one. */
    .def > .swatch { align-self: stretch; height: auto; border-radius: var(--r-full); }
    .def-body { min-width: 0; }
    .def-name {
      display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
      font-size: 16.5px; font-weight: 700; color: var(--white);
    }
    .def-terms {
      font-size: 12.5px; font-weight: 700; color: var(--dim);
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--r-full); padding: 3px 9px; white-space: nowrap;
    }
    .def-text { font-size: 14.5px; line-height: 1.55; color: var(--dim-2); margin: 5px 0 0; text-wrap: pretty; }
    @media (max-width: 700px) { .defs { grid-template-columns: minmax(0, 1fr); gap: 18px; } }

    /* The regression this exists to catch: one account reporting while many
       were queried. It has to look broken on sight, not read as a footnote. */
    .data-alarm {
      display: flex; align-items: center; gap: 8px; margin: 0 0 18px;
      font-size: 14px; font-weight: 700; color: var(--warn);
      background: var(--warn-surface); border: 1px solid var(--warn-line);
      border-radius: var(--r-md); padding: 10px 13px;
    }
    .data-alarm svg { width: 16px; height: 16px; flex: none; }

    /* ── Monthly contributor stack ──────────────────────────────── */
    .stack { display: flex; align-items: center; }
    /* The cut-out between overlapping avatars is the only edge they need. It
       used to carry a hairline ring outside it as well, because the studio mark
       is mostly black and read as a hole in the row; that mark no longer
       appears here, and the second edge read as a stray white stroke. */
    .stack { overflow: visible; }
    .stack .av, .stack .av-more {
      width: 60px; height: 60px; border-radius: var(--r-md);
      border: 2px solid var(--n-black); background: var(--surface-2);
      display: block; position: relative;
    }
    .stack .av img { width: 100%; height: 100%; display: block; object-fit: cover; border-radius: inherit; }
    .stack > * + * { margin-left: -16px; }
    .stack .av { transition: transform .14s ease; }
    .stack .av:hover, .stack .av:focus-visible { transform: translateY(-4px); z-index: 3; outline: none; }
    .stack .av:focus-visible { box-shadow: 0 0 0 2px var(--action); }

    /* Name and title, rendered rather than left to the browser's tooltip. */
    /* Below the face, not above it: the avatars sit at the top of the drawer, so
       a tooltip above would cover the month row the drawer belongs to. */
    .stack .av::after {
      content: attr(data-tip);
      position: absolute; top: calc(100% + 9px); left: 50%; transform: translateX(-50%) translateY(-3px);
      z-index: 4; pointer-events: none; white-space: nowrap;
      font-size: 13px; font-weight: 600; line-height: 1.3; color: var(--white);
      background: #0E0E0E; border: 1px solid var(--line); border-radius: var(--r-sm);
      padding: 7px 10px; box-shadow: var(--shadow-xl);
      opacity: 0; transition: opacity .13s ease, transform .13s ease;
    }
    .stack .av:hover::after, .stack .av:focus-visible::after { opacity: 1; transform: translateX(-50%) translateY(0); }
    /* The first avatar's tooltip would otherwise start off the left edge of a
       narrow drawer. */
    .stack .av:first-child::after { left: 0; transform: translateX(0) translateY(-3px); }
    .stack .av:first-child:hover::after,
    .stack .av:first-child:focus-visible::after { transform: translateX(0) translateY(0); }
    .av-more {
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700; color: var(--dim);
      background: var(--surface-2);
    }
    .stack-wrap { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .stack-label { font-size: 14px; color: var(--dim-2); }

    /* ── Data-integrity flag ────────────────────────────────────────
       The chart hatches a flagged bar. The same diagonal, at a fraction of the
       contrast, marks the cell that opens onto it and lines the modal that
       explains it, so one language says "something is different here" from the
       chart through to the note. It replaced a warning icon floating over every
       flagged bar, which shouted the same thing five times before anyone had
       asked. */
    /* Same slope as the canvas hatch, which runs bottom-left to top-right.
       CSS 45deg lays its bands the other way, so this is -45deg. */
    .hazard {
      background-image: repeating-linear-gradient(-45deg,
        transparent 0 7px, var(--hazard-ink, rgba(245, 194, 107, 0.14)) 7px 9px);
    }
    /* Compact inline flag: pill in tables, superscript beside a figure. */
    .flag-tag { color: var(--warn); background: var(--warn-surface); border-color: var(--warn-line); cursor: help; }


    /* ── Chart + interactive legend ─────────────────────────────────
       Height is set inline by drawChart: fixed for the vertical layout, and
       proportional to the month count for the horizontal one, so bar thickness
       stays constant as the year fills up. */
    .chart-block { position: relative; }
    .chart-wrap { position: relative; width: 100%; height: 330px; }
    /* The legend floats in the plot's top-right corner instead of sitting under
       it, so the series totals read as part of the chart. drawChart reserves
       matching padding at the top of the canvas so no bar can run behind it. */
    .legend {
      position: absolute; top: 0; right: 0; z-index: 2;
      /* Reserved for by drawChart, which pads the plot to match. */
      display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: flex-start;
      max-width: 100%; pointer-events: auto;
    }
    /* The legend doubles as the headline totals for each series, so the figure
       is the dominant element and the label sits above it. */
    /* A rail down the left, the same device the category definitions use in the
       hero card, so a series is identified the same way wherever it appears. */
    .legend-item {
      display: inline-flex; align-items: stretch; gap: 11px;
      font-family: var(--font-body); text-align: left;
      background: transparent; border: 1px solid transparent; border-radius: var(--r-md);
      padding: 9px 14px; cursor: pointer; transition: all .14s ease;
    }
    .legend-item > .swatch { align-self: stretch; height: auto; width: 9px; border-radius: var(--r-full); }
    .lg-stack { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
    .legend-item:hover, .legend-item:focus-visible { background: var(--surface); border-color: var(--line); outline: none; }
    /* The total can be pointed at like the other two, and isolates the total
       line the same way, but it cannot be switched off: it is drawn from the
       other two, so there is nothing to hide it from. Hence the hover
       treatment of a series with the cursor of a label. */
    .legend-item.is-key { cursor: default; }
    /* The total is a dashed line, so its rail is dashed down its length.

       Dashed from both ends rather than from the top down. The rail stretches
       to whatever the label and figure beside it come to, so a single gradient
       running top to bottom lands its last gap wherever the height happens to
       fall, and a gap over a rounded end erases the cap: the rail reads as cut
       off square. Each half repeats away from its own edge instead, which pins
       a dash to the top and the bottom and leaves the two curves drawn. The
       halves meet in the middle, where a dash landing slightly long is the one
       place on a dashed rail nobody reads as a mistake. */
    .legend-item > .swatch.dash {
      background-image:
        repeating-linear-gradient(to bottom, var(--dim) 0 6px, transparent 6px 11px),
        repeating-linear-gradient(to top, var(--dim) 0 6px, transparent 6px 11px);
      background-size: 100% 50%;
      background-position: left top, left bottom;
      background-repeat: no-repeat;
    }
    .legend-item .lg-name {
      font-size: 14px; font-weight: 600; color: var(--dim); transition: color .14s ease;
    }
    .legend-item:hover .lg-name, .legend-item:focus-visible .lg-name { color: var(--white); }
    /* Flush left with the label above it: the figure was indented past the
       eyebrow, which read as two loose elements rather than one stacked pair. */
    .legend-item .val {
      font-family: var(--font-display); font-size: var(--t-figure); font-weight: 600;
      line-height: 1.05; letter-spacing: var(--tracking-display); color: var(--white);
      font-variant-numeric: tabular-nums;
    }
    .legend-item[data-off="true"] { opacity: .38; }
    .legend-item[data-off="true"] .swatch { background: var(--dim-2) !important; }

    /* Flag button: opens the shared modal. Bare icon by default so a table cell
       is not squeezed by a box; the labelled variant takes the badge geometry. */
    .flag-btn {
      display: inline-flex; align-items: center; justify-content: center;
      font-family: var(--font-body); color: var(--warn);
      background: none; border: 0; padding: 0; cursor: pointer;
      transition: color .14s ease, transform .14s ease; vertical-align: middle;
    }
    .flag-btn svg { width: 16px; height: 16px; display: block; }
    .flag-btn:hover { color: var(--warn-strong); transform: scale(1.12); }
    .flag-btn:focus-visible { outline: 2px solid var(--warn); outline-offset: 3px; border-radius: 3px; }
    .flag-btn.labelled {
      gap: 6px; font-size: var(--badge-size); font-weight: var(--badge-weight);
      padding: var(--badge-pad); border: 1px solid var(--warn-line);
      background: var(--warn-surface); border-radius: var(--r-full);
    }
    .flag-btn.labelled:hover { transform: none; background: var(--warn-surface-2); border-color: var(--warn); }
    .flag-btn.labelled svg { width: 13px; height: 13px; }

    /* View control, opposite the legend in the band reserved above the plot. */
    .chart-controls {
      position: absolute; top: 0; left: 0; z-index: 2;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .pills.seg { padding: 3px; }
    .pills.seg .pill { font-size: 14px; padding: 7px 14px; }
    
    .month-step { display: flex; align-items: center; gap: 4px; }
    .month-step[hidden] { display: none; }
    .step-label {
      font-size: 15px; font-weight: 700; color: var(--white);
      min-width: 10.5ch; text-align: center;
    }
    .step-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; padding: 0; cursor: pointer;
      color: var(--dim); background: var(--surface);
      border: 1px solid var(--line); border-radius: var(--r-sm);
      transition: all .14s ease;
    }
    .step-btn:hover:not(:disabled) { color: var(--white); background: var(--surface-2); }
    .step-btn:disabled { opacity: .32; cursor: default; }
    .step-btn svg { width: 15px; height: 15px; }
    .step-btn[data-step="-1"] svg, .step-btn[data-fact="-1"] svg { transform: rotate(180deg); }
    /* Key to the textured half of the plot, set as a legend entry rather than a
       footnote so it reads as part of the chart. */
    .chart-key { display: flex; align-items: flex-start; gap: 12px; margin: 16px 0 0; max-width: 86ch; }
    .chart-key[hidden] { display: none; }
    /* The same rail the series use, filled with the same texture the chart lays
       over its projected months, on the same slope. */
    .chart-key { align-items: stretch; }
    /* The hairline is what makes this read as a swatch rather than as a stray
       piece of texture: it draws the edge of the sample, the same way the plot
       draws an edge where tracked time stops. Sized so the field inside the
       border is the 9px the series rails are. */
    .key-swatch {
      flex: none; width: 11px; border-radius: var(--r-full);
      border: 1px solid var(--line);
      background-color: rgba(255, 255, 255, 0.05);
      background-image: repeating-linear-gradient(-45deg,
        transparent 0 4px, rgba(255, 255, 255, 0.30) 4px 6px);
    }
    .key-text { font-size: 13.5px; line-height: 1.6; color: var(--dim-2); margin: 0; }
    .key-text b { color: var(--dim); font-weight: 700; }

    /* Below this the plot is rotated and every month owns a full row, so there
       is no corner left to float the legend into. It goes back into the flow
       above the chart, and drawChart stops reserving space for it. */
    @media (max-width: 700px) {
      .legend { position: static; justify-content: flex-start; margin-bottom: 12px; }
      .legend-item { padding: 7px 10px 7px 0; }
    }

    /* ── Modal ──────────────────────────────────────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 60; display: flex;
      align-items: center; justify-content: center; padding: 24px;
      background: rgba(0, 0, 0, 0.66); backdrop-filter: blur(3px);
    }
    .modal-backdrop[hidden] { display: none; }
    .modal {
      width: min(540px, 100%);
      background: linear-gradient(165deg, var(--warn-surface-2), var(--warn-surface)), #0E0C08;
      border: 1px solid var(--warn-line); border-radius: var(--r-lg);
      box-shadow: var(--shadow-2xl); padding: 22px 24px 24px;
    }
    /* Set after .modal so the stripes layer over its gradient rather than being
       replaced by it: the shorthand there writes background-image too. */
    .modal.hazard {
      --hazard-ink: rgba(245, 194, 107, 0.06);
      background-image:
        repeating-linear-gradient(-45deg, transparent 0 8px, var(--hazard-ink) 8px 10px),
        linear-gradient(165deg, var(--warn-surface-2), var(--warn-surface));
    }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
    .modal-title {
      font-family: var(--font-display); font-size: 20px; font-weight: 600; margin: 0;
      display: flex; align-items: center; gap: 10px;
    }
    .modal-title svg { width: 18px; height: 18px; flex: none; color: var(--warn); }
    .modal-body { font-size: 15.5px; line-height: 1.7; color: var(--warn-body); }
    .modal-body p { margin: 0 0 12px; }
    .modal-body p:last-child { margin-bottom: 0; }
    .modal-body b { color: var(--warn-strong); font-weight: 700; }
    .modal .btn { color: var(--warn-body); border-color: var(--warn-line); background: var(--warn-surface); }
    .modal .btn:hover { color: var(--warn-strong); background: var(--warn-surface-2); border-color: var(--warn); }

    /* ── Monthly summary table ────────────────────────────────────────
       Closed, this is a plain list of figures: no rules between rows, no tinted
       columns, no selected surface. Every one of those was scaffolding for a
       denser page, and with the density gone they were the only noise left.
       Hierarchy is carried by weight, colour and one rule above the totals. */
    .table { --sel: var(--action); width: 100%; border-collapse: collapse; font-size: 15.5px; }
    .table th, .table td { padding: 13px 12px; text-align: left; }
    .table th {
      font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      color: var(--dim-2); white-space: nowrap; padding-bottom: 9px;
    }
    .table td.r, .table th.r { text-align: right; }
    .table tbody tr.mrow { cursor: pointer; transition: opacity .14s ease; }
    .table tbody tr.mrow:hover .mo { color: var(--white); }
    .table tbody tr.mrow:hover .caret { color: var(--action); }
    .table tbody tr.mrow:focus-visible { outline: 2px solid var(--sel); outline-offset: -2px; }
    /* Pointing at a month in the chart above dims every other month here, and
       the year-to-date row with them: it is not the month being asked about. */
    .table tbody tr.mrow.is-dim td, .table tfoot.is-dim td { opacity: .26; }
    .table tfoot { transition: opacity .14s ease; }
    .table tbody tr.mrow[aria-expanded="true"] .mo { font-weight: 700; color: var(--white); }
    .table .mo { font-weight: 600; display: flex; align-items: center; gap: 8px; transition: color .12s ease; }
    /* The caret is the only thing saying the row opens, so it turns rather than
       appears: the closed and open states read as the same control. */
    .table .caret { display: inline-flex; width: 15px; height: 15px; flex: none; color: var(--dim-2); transition: transform .16s ease, color .16s ease; }
    .table .caret svg { width: 100%; height: 100%; }
    .table tbody tr.mrow[aria-expanded="true"] .caret { transform: rotate(90deg); color: var(--sel); }

    /* The open month's detail. No surface of its own and no left rail: it is set
       apart by the space around it, and the padding under it is what makes the
       next month's row obviously the next thing. */
    .table tbody tr.acc > td { padding: 0; }
    .acc-inner { padding: 6px 2px 52px; }
    .acc-note { font-size: 13px; color: var(--dim-2); margin: 26px 0 0; }
    @media (max-width: 680px) { .acc-inner { padding: 4px 0 40px; } }

    /* Both categories side by side, so the two task lists that add up to the
       row's total are visible at once instead of one scrolling past the other.
       They stack below 860px, where two columns of task names would truncate to
       nothing useful. */
    .cat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 68px; align-items: start; }
    @media (max-width: 860px) { .cat-grid { grid-template-columns: minmax(0, 1fr); gap: 4px; } }

    .table .primary { font-weight: 600; color: var(--white); }
    .table .of { color: var(--dim-2); font-weight: 500; }
    /* The share of the retainer, reading as an annotation on the figure it
       follows rather than as a second number of equal standing. */
    .table .use {
      display: inline-block; min-width: 46px; margin-left: 10px;
      font-size: 13.5px; font-weight: 700; text-align: right;
    }
    .table td.r, .table th.r { white-space: nowrap; }
    .table .col-gap { padding-right: 24px; }
    /* Sums are set apart by a rule and by weight, not by a tinted panel. */
    .table tbody tr.mrow td.col-total { font-weight: 700; color: var(--white); }
    .table tfoot td {
      border-top: 1px solid var(--line);
      font-weight: 700; padding-top: 20px; padding-bottom: 4px;
      font-size: 17px; color: var(--white);
    }
    .table tfoot td.ytd-label {
      font-family: var(--font-display); font-size: 21px; font-weight: 600; letter-spacing: -0.005em;
    }
    .table tfoot td.col-total { font-size: 18px; }
    /* The chart and the table are one unit: the chart is the shape of the year,
       the table is the same year in figures with its detail folded inside. A
       section-sized gap here made them read as two separate exhibits. */
    .table-scroll { overflow-x: auto; margin-top: 26px; }
    /* Month names are carried twice so the column can shorten without a
       re-render when the viewport crosses the breakpoint. */
    .mo-abbr { display: none; }

    /* At 390px all four columns still fit once the month drops to three
       letters, the padding tightens and the usage figure moves under the
       Creative hours instead of beside them. */
    @media (max-width: 680px) {
      .table { font-size: 14px; }
      .table th, .table td { padding: 11px 6px; }
      .table .col-gap { padding-right: 12px; }
      .table th:first-child, .table td:first-child { padding-left: 0; }
      .table th { font-size: 10.5px; letter-spacing: .06em; }
      .table .mo { gap: 6px; }
      .table .use { display: block; min-width: 0; margin: 2px 0 0; font-size: 12.5px; }
      .table tfoot td { font-size: 15px; }
      .table tfoot td.col-total { font-size: 16px; }
      .mo-full { display: none; }
      .mo-abbr { display: inline; }
    }
    /* Small phones: the four columns plus the total column's inset were 9px
       over the viewport, which read as a broken table rather than a scrollable
       one. Tighten the type and the gutters rather than drop a column. */
    @media (max-width: 430px) {
      .table { font-size: 13px; }
      .table th, .table td { padding: 10px 4px; }
      .table .col-gap { padding-right: 9px; }
      .table .caret { width: 13px; height: 13px; }
      .table .use { font-size: 12px; }
    }

    @media (max-width: 640px) {
      .srow-label { font-size: 16px; }
      .hero { padding: 20px 18px 18px; }
      .hero-top { gap: 16px; margin-bottom: 20px; }
      .hero-ctx { font-size: 14.5px; }
      .funfact { font-size: 21px; padding-top: 16px; }

      .sec { margin-bottom: 62px; }
    }

    /* ── Month detail, inside the summary table's accordion ──────────
       The month, its total and its split are all in the row this hangs from,
       so none of them are repeated here. What is left is the thing the row
       cannot show: which tasks the hours went to, and who worked them. */
    .cat { margin-top: 18px; }
    .cat-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .acc-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 20px; flex-wrap: wrap; margin-bottom: 26px;
    }
    .dh-meta { font-size: 14px; color: var(--dim-2); }

    .row { display: flex; align-items: center; gap: 13px; padding: 9px 0; }
    .row .name { flex: 1 1 0; min-width: 0; font-size: 15.5px; font-weight: 500; color: var(--ink-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .track { flex: 0 0 130px; height: 6px; background: rgba(255, 255, 255, 0.14); border-radius: var(--r-full); overflow: hidden; }
    .row .track .fill { display: block; height: 100%; border-radius: var(--r-full); }
    .row .hrs { flex: none; min-width: 72px; white-space: nowrap; font-size: 15.5px; font-weight: 600; color: var(--white); text-align: right; font-variant-numeric: tabular-nums; }
    .row .link {
      flex: none; display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 6px; color: var(--dim-2);
      border: 1px solid transparent; transition: all .14s ease;
    }
    .row .link:hover { color: var(--action); background: var(--surface-2); border-color: var(--line); }
    .row .link svg { width: 14px; height: 14px; }
    .row .link.placeholder { opacity: .22; pointer-events: none; }
    .empty-note { font-size: 15px; color: var(--dim-2); font-style: italic; margin: 10px 0 0; }
    /* Half the width means half the room for a task name, which is the one
       thing here worth protecting. The mini-bar is the first thing to go. */
    @media (min-width: 861px) { .cat-grid .row .track { flex: 0 0 76px; } }
    @media (max-width: 560px) {
      .row .track { display: none; }
      /* A truncated task name is the one thing on this page a client cannot
         look up elsewhere, so it wraps instead of ending in an ellipsis. */
      .row { align-items: flex-start; gap: 10px; padding: 11px 0; }
      .row .name { white-space: normal; overflow: visible; line-height: 1.35; }
      .row .hrs { flex: 0 0 auto; min-width: 60px; }
      .cat { margin-top: 22px; }
    }
    /* Touch: a 16px control is a legitimate target only if its hit area is not.
       Text links keep their type size and grow their hit area around it. */
    @media (hover: none) {
      .flag-btn { position: relative; }
      .flag-btn:not(.labelled)::after { content: ""; position: absolute; inset: -11px; }
      .row .link { width: 34px; height: 34px; }
      .export-link, .foot-link { position: relative; }
      .export-link::after, .foot-link::after { content: ""; position: absolute; inset: -13px -6px; }
      .step-btn { width: 38px; height: 38px; }
    }

    /* ── States + footer ────────────────────────────────────────── */
    .state { text-align: center; padding: 80px 20px; color: var(--dim); font-size: 17px; }
    .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--mint); animation: spin 1s linear infinite; margin: 0 auto 18px; }
    .err { color: var(--over); }
    .err code { display: block; margin-top: 12px; color: var(--dim); font-size: 14.5px; word-break: break-word; }

    /* One type scale across the whole footer: 14px everywhere, one accent
       weight, one dim colour. The freshness readout is the page's last word
       rather than its first, which is what it actually is: a footnote on the
       data, not a headline. */
    .foot {
      margin-top: 72px; padding-top: 20px; border-top: 1px solid var(--line-soft);
      display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap;
      font-size: 14px; line-height: 1.65; color: var(--dim-2);
    }
    .foot-brand { display: flex; flex-direction: column; gap: 7px; }
    .foot-fine { font-size: 14px; line-height: 1.65; color: var(--dim-2); margin: 0; }
    .foot-link {
      color: var(--action); text-decoration: underline; text-underline-offset: 3px;
      text-decoration-thickness: 1px; text-decoration-color: rgba(105, 238, 255, 0.45);
      transition: text-decoration-color .14s ease, color .14s ease;
    }
    .foot-link:hover { text-decoration-color: var(--action); }
    .foot-link.primary {
      display: inline-flex; align-items: center; gap: 8px; width: fit-content;
      font-size: 14px; font-weight: 700; color: var(--white);
      text-decoration-color: rgba(255, 255, 255, 0.28);
    }
    .foot-link.primary:hover { color: var(--action); text-decoration-color: var(--action); }
    .foot img { height: 15px; width: auto; display: block; }

    .foot-data { display: flex; align-items: center; gap: 14px; }
    .foot-data .clock { align-items: flex-end; font-size: 12px; }
    .foot-data #refreshBtn { width: 34px; height: 34px; }
    .foot-data #refreshBtn svg { width: 15px; height: 15px; }
    @media (max-width: 560px) {
      .foot { gap: 22px; }
      .foot-data { width: 100%; justify-content: space-between; }
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* ── Print / Save-as-PDF ─────────────────────────────────────
       Re-point the tokens rather than patching selector by selector, so
       every colour that inherits from them flips with one change. The
       brand hues are re-stepped for contrast against white paper, which
       also carries the derived --creative-ink / --noncreative-ink / --ok. */
    @media print {
      :root {
        --mint: #147A38;
        --holo-lavender: #5E3B96;
        --creative-fill: #2E9950;
        --noncreative-fill: #8461BE;
        --warn: #9A6512;
        --over: #B3261E;
        --white: #111111;
        --text: #111111;
        --ink-strong: rgba(0, 0, 0, 0.92);
        --tick-cut: #FFFFFF;
        --dim: rgba(0, 0, 0, 0.70);
        --dim-2: rgba(0, 0, 0, 0.55);
        --line: rgba(0, 0, 0, 0.18);
        --line-soft: rgba(0, 0, 0, 0.10);
        --surface: transparent;
        --surface-2: rgba(0, 0, 0, 0.10);
        --warn-strong: #6E4406;
        --warn-body: #3B2E15;
        --warn-surface: #FCF6EA;
        --warn-surface-2: #F7EBD5;
        --warn-line: #D9B676;
      }
      /* Gradient text does not print; fall back to solid ink. */
      .grad {
        background: none; -webkit-text-fill-color: #111; color: #111; animation: none;
      }
      /* Hidden facts are laid on top of the shown one, and visibility is not
         enough on paper in every engine: collapse them out of flow instead. */
      .ff-line { display: none; }
      .ff-line[data-on="true"] { display: block; }
      .ff-stack { display: block; }
      body { background: #fff !important; color: #111; font-size: 10.5pt; }
      .page { max-width: none; padding: 0; }
      .masthead { position: static; background: none; backdrop-filter: none; padding-top: 0; }
      .lockup img, .report-title .client-mark { filter: invert(1); }
      .foot-data, .pills, .sec-note, .row .link, .menu-wrap,
      .flag-btn:not(.labelled) { display: none !important; }
      /* The labelled flag is a tag, not a control: on paper it is the only thing
         naming what the hatching means. */
      .flag-btn.labelled { color: #8A5A0F; border-color: var(--warn-line); background: var(--warn-surface-2); }
      .hero { background: none !important; box-shadow: none; }
      .sec { break-inside: avoid; margin-bottom: 26px; }
      /* Selection is a screen state: on paper the open month is simply the one
         with its detail printed under it. */
      .acc-inner { padding: 8px 0 24px; }
      .table .caret { display: none; }
      .table tfoot td { border-top-color: rgba(0, 0, 0, 0.35); }
      a { color: #111 !important; }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
</head>
<body>
  <div class="page">

    <!-- Reusable detail modal: used by the data-integrity flags, and available
         to any future note that would otherwise clutter the layout. -->

  <script>
    /* ═══════════════════════════════════════════════════════════════
       Config
       ═══════════════════════════════════════════════════════════════ */
    var API_BASE = new URLSearchParams(location.search).get('api') || '/api/time';
    var CURRENT_YEAR = new Date().getFullYear();
    var YEAR = parseInt(new URLSearchParams(location.search).get('year')) || CURRENT_YEAR;
    var YEAR_OPTIONS = [CURRENT_YEAR, CURRENT_YEAR - 1];
    var BUDGET = 50;

    var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    var MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    // Two categorical series. `fill` is the mark color (brand hue, stepped into
    // the dark-mode lightness band); `ink` is the full-brand value used for
    // strokes, swatches and figures.
    var CATS = [
      { key: 'creative',    label: 'Creative',     budgeted: true,
        fill: '#27AC4B', ink: '#7EF893',                                 // literals: Chart.js canvas
        fillVar: 'var(--creative-fill)', inkVar: 'var(--creative-ink)',  // DOM: re-pointable per media
        tint: 'rgba(126, 248, 147, 0.10)',
        items: 'creativeItems', hours: 'creative' },
      { key: 'nonCreative', label: 'Other', budgeted: false,
        fill: '#9B77D0', ink: '#C6A2FF',
        fillVar: 'var(--noncreative-fill)', inkVar: 'var(--noncreative-ink)',
        tint: 'rgba(198, 162, 255, 0.10)',
        items: 'nonCreativeItems', hours: 'nonCreative' }
    ];

    /* Data-integrity annotations. Each entry flags a (year, months, series)
       slice as not fully trustworthy, and surfaces as: a hatched bar + marker
       on the chart, a note in its tooltip, a labelled tag at the top of the
       month's expanded detail, and a Data note row in the CSV exports. Remove
       an entry once its data is repaired. */
    var DATA_FLAGS = [
      {
        id: 'moss-2026-creative-jan-may',
        year: 2026,
        months: [0, 1, 2, 3, 4],           // Jan–May
        series: 'creative',
        label: 'Under-reported',
        detail: 'Creative hours for January–May 2026 come from a partially corrupt ' +
                'time-tracking export. Actual usage was higher than shown; we are ' +
                'reconstructing the missing entries and will restate these months.'
      }
    ];

    function flagFor(year, monthIdx, seriesKey) {
      for (var i = 0; i < DATA_FLAGS.length; i++) {
        var f = DATA_FLAGS[i];
        if (f.year === year && f.series === seriesKey && f.months.indexOf(monthIdx) !== -1) return f;
      }
      return null;
    }
    function flagsInRange(year, range, seriesKey) {
      var out = [];
      range.forEach(function (m) {
        var f = flagFor(year, m.month, seriesKey);
        if (f && out.indexOf(f) === -1) out.push(f);
      });
      return out;
    }

    var chart = null;
    var state = { months: [], range: [], selected: null, hidden: {}, generatedAt: null,
                  team: [], teamById: {}, contributors: null };

    var view = { mode: 'year' };
    var priorYear = { year: null, months: null, state: 'idle' };  // 'idle' | 'loading' | 'done' | 'none'

    /* The last month that can carry a complete figure: for the current year the
       month we are in is still filling up, so it is never a basis for a mean. */
    function lastCompleteMonth() {
      if (YEAR !== CURRENT_YEAR) return 11;
      return new Date().getMonth() - 1;
    }
    function lastActualMonth() {
      var last = -1;
      state.months.forEach(function (m) { if (m.total > 0) last = m.month; });
      if (YEAR === CURRENT_YEAR) last = Math.max(last, new Date().getMonth());
      return last;
    }

    /* Projection for the months that have not happened yet.

       Basis: the mean of the completed months that carry time. If last year is
       available, each future month is then shaped by how that month compared
       with its own year's mean, which is what carries a seasonal pattern like a
       quiet August. The factor is clamped, so one freak month last year cannot
       throw a forecast twice as far as anything ever observed.

       Range: a single line of estimate reads as a promise. The spread of the
       months already tracked is the only honest measure of how far a future
       month might land from the average, so it becomes a high/low band around
       each projected total: the coefficient of variation of the completed
       months, floored so a short or unusually even history still admits some
       uncertainty, and capped so a single wild month does not open the band
       wider than it can mean anything. */
    var SPREAD_MIN = 0.12, SPREAD_MAX = 0.45;
    function projectRest() {
      var lastActual = lastActualMonth();
      var lastComplete = lastCompleteMonth();
      var out = { from: lastActual + 1, creative: [], nonCreative: [],
                  low: [], high: [], spread: 0, basis: 'none' };
      if (out.from > 11) return out;

      var done = state.months.filter(function (m) {
        return m.month <= lastComplete && m.total > 0;
      });
      if (!done.length) return out;

      var meanC = done.reduce(function (a, m) { return a + m.creative; }, 0) / done.length;
      var meanO = done.reduce(function (a, m) { return a + m.nonCreative; }, 0) / done.length;
      out.basis = 'average';

      var shape = null;
      if (priorYear.state === 'done' && priorYear.months) {
        var pr = priorYear.months.filter(function (m) { return m.total > 0; });
        if (pr.length >= 6) {
          var pMean = pr.reduce(function (a, m) { return a + m.total; }, 0) / pr.length;
          if (pMean > 0) {
            shape = priorYear.months.map(function (m) {
              if (!(m.total > 0)) return 1;
              return Math.min(1.8, Math.max(0.45, m.total / pMean));
            });
            out.basis = 'prior-year';
          }
        }
      }

      /* How far a tracked month has typically sat from the average, as a
         fraction of it. Population spread, not a sample estimate: these are all
         the months there are, not a draw from a larger set. */
      var meanT = meanC + meanO;
      var sd = Math.sqrt(done.reduce(function (a, m) {
        return a + (m.total - meanT) * (m.total - meanT);
      }, 0) / done.length);
      out.spread = meanT > 0
        ? Math.min(SPREAD_MAX, Math.max(SPREAD_MIN, sd / meanT))
        : SPREAD_MIN;

      for (var i = out.from; i <= 11; i++) {
        var f = shape ? shape[i] : 1;
        out.creative[i] = meanC * f;
        out.nonCreative[i] = meanO * f;
        var mid = out.creative[i] + out.nonCreative[i];
        out.low[i] = Math.max(0, mid * (1 - out.spread));
        out.high[i] = mid * (1 + out.spread);
      }
      return out;
    }

    /* Last year is only worth a round trip when the reader asks for the full
       year, so it is fetched on demand and the chart redrawn if it lands. */
    function ensurePriorYear(then) {
      if (priorYear.year === YEAR - 1 && priorYear.state !== 'idle') return then && then();
      priorYear = { year: YEAR - 1, months: null, state: 'loading' };
      fetch(API_BASE + '?year=' + (YEAR - 1))
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (!d || !d.months) { priorYear.state = 'none'; return; }
          priorYear.months = normalize(d);
          priorYear.state = priorYear.months.some(function (m) { return m.total > 0; }) ? 'done' : 'none';
        })
        .catch(function () { priorYear.state = 'none'; })
        .then(function () { if (then) then(); });
    }

    /* One breakpoint drives every layout decision the script makes: the chart
       orientation and the length of the clock string. It matches the CSS
       breakpoint used for the masthead. */
    var NARROW = window.matchMedia('(max-width: 700px)');
    function isNarrow() { return NARROW.matches; }

    /* ═══════════════════════════════════════════════════════════════
       Formatting helpers
       ═══════════════════════════════════════════════════════════════ */
    function fmtH(h) {
      if (h === null || h === undefined) return '0h';
      var hrs = Math.floor(h), mins = Math.round((h - hrs) * 60);
      if (mins === 60) { hrs += 1; mins = 0; }
      if (hrs === 0 && mins === 0) return '0h';
      if (hrs === 0) return mins + 'm';
      if (mins === 0) return hrs + 'h';
      return hrs + 'h ' + mins + 'm';
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }
    function pctOf(used, budget) { return budget > 0 ? Math.round((used / budget) * 100) : 0; }

    function fmtMonths(n) { return (Math.round(n * 10) / 10).toFixed(1); }
    /* Using the retainer is the point, so 90% is not a warning state. Green
       holds to the cap and only going over turns red. Yellow stays reserved for
       data integrity. */
    function pctColor(pct) { return pct > 100 ? 'var(--over)' : 'var(--ok)'; }

    var ICONS = {
      refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>',
      download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
      printer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>',
      external: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>',
      alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
      info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
      spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3"/></svg>',
      close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
      chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>',
    };


    /* ═══════════════════════════════════════════════════════════════
       Live clock + freshness
       ═══════════════════════════════════════════════════════════════ */
    /* The full stamp is "Thu, Jul 30 at 11:37:12 AM MDT", which on a phone
       wrapped the masthead onto a third row on its own. The compact form drops
       the weekday, seconds and zone: the reader is in that zone, and a ticking
       seconds field is noise at this size. */
    function fmtDateTime(d, compact) {
      return d.toLocaleString(undefined, compact
        ? { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }
        : { weekday: 'short', month: 'short', day: 'numeric',
            hour: 'numeric', minute: '2-digit', second: '2-digit', timeZoneName: 'short' });
    }
    function relTime(d) {
      var s = Math.max(0, Math.round((Date.now() - d.getTime()) / 1000));
      if (s < 10) return 'just now';
      if (s < 60) return s + 's ago';
      if (s < 3600) return Math.round(s / 60) + 'm ago';
      // A past year is cached for a day and served stale for up to a week, so
      // ages beyond 24h are reachable and should not read as "168h ago".
      if (s < 86400) return Math.round(s / 3600) + 'h ago';
      return Math.round(s / 86400) + 'd ago';
    }
    function tickClock() {
      var narrow = isNarrow();
      document.getElementById('clockNow').textContent = fmtDateTime(new Date(), narrow);
      var el = document.getElementById('clockFetched');
      if (state.generatedAt) {
        el.textContent = narrow
          ? 'Updated ' + relTime(state.generatedAt)
          : 'Data updated ' + relTime(state.generatedAt) + ' · ' +
            state.generatedAt.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
      }
      syncMastheadHeight();
    }

    /* Publishes the sticky masthead's real height so scroll-margin-top can keep
       jump targets clear of it. It changes with the breakpoint and with how the
       clock string wraps, so it is measured rather than assumed. */
    var lastMastheadH = -1;
    function syncMastheadHeight() {
      var el = document.querySelector('.masthead');
      if (!el) return;
      var h = Math.round(el.getBoundingClientRect().height);
      if (h === lastMastheadH) return;
      lastMastheadH = h;
      document.documentElement.style.setProperty('--mh', h + 'px');
    }

    /* ═══════════════════════════════════════════════════════════════
       Data shaping
       ═══════════════════════════════════════════════════════════════ */
    function normalize(data) {
      return (data.months || []).map(function (m) {
        return {
          month: m.month,
          creative: m.retainerHours || 0,
          nonCreative: m.sowHours || 0,
          total: (m.retainerHours || 0) + (m.sowHours || 0),
          creativeItems: m.retainerItems || [],
          nonCreativeItems: m.sowItems || [],
          contributorIds: m.contributorIds || [],
          // Per-day totals, present from the API's day buckets. Absent on an
          // older payload, in which case the day view says so rather than
          // drawing an empty month.
          creativeDaily: m.retainerDaily || null,
          nonCreativeDaily: m.sowDaily || null
        };
      });
    }
    function sortItems(items) {
      return items.slice().sort(function (a, b) { return b.hours - a.hours; });
    }
    function totals() {
      var t = { creative: 0, nonCreative: 0, total: 0 };
      state.range.forEach(function (m) {
        t.creative += m.creative; t.nonCreative += m.nonCreative; t.total += m.total;
      });
      return t;
    }
    /* Months of retainer the client has actually paid for, which is not the same
       as the months that happen to carry tracked time: the retainer accrues on
       the 1st whether or not anyone logs hours. For the current year that runs
       from the first tracked month through the month we are in now; for a past
       year it runs through the last month with time on it. */
    function allowanceMonths() {
      var first = state.range[0].month;
      var last = state.range[state.range.length - 1].month;
      if (YEAR === CURRENT_YEAR) last = Math.max(last, new Date().getMonth());
      return last - first + 1;
    }
    function allowance() { return BUDGET * allowanceMonths(); }

    /* ═══════════════════════════════════════════════════════════════
       Load
       ═══════════════════════════════════════════════════════════════ */
    // Rendered into every .years container, so the two title-row layouts can be
    // compared with a working selector in each.
    function renderYears() {
      document.querySelectorAll('.years').forEach(function (el) {
        el.innerHTML = YEAR_OPTIONS.map(function (y) {
          return '<button class="pill" data-y="' + y + '" aria-pressed="' + (y === YEAR) + '">' + y + '</button>';
        }).join('');
        el.querySelectorAll('button').forEach(function (b) {
          b.addEventListener('click', function () {
            if (YEAR === parseInt(b.dataset.y)) return;
            YEAR = parseInt(b.dataset.y);
            renderYears();
            load();
          });
        });
      });
    }
    function setRangeText(txt) {
      document.querySelectorAll('[data-range]').forEach(function (el) { el.textContent = txt; });
    }

    function load(manual) {
      var content = document.getElementById('content');
      var btn = document.getElementById('refreshBtn');
      btn.setAttribute('aria-busy', 'true');
      if (!manual) content.innerHTML = '<div class="state"><div class="spinner"></div>Loading ' + YEAR + ' hours…</div>';
      setRangeText('');
      if (chart) { chart.destroy(); chart = null; }

      // An ordinary load is served from the edge cache, so it costs nothing at
      // ClickUp. Only the refresh button asks for a genuine round trip. Nothing
      // cache-busts: a unique URL per load is a unique cache key, which is what
      // made every visit a fresh pull.
      var url = API_BASE + '?year=' + YEAR + (manual ? '&fresh=1' : '');
      fetch(url)
        .then(function (r) {
          return r.text().then(function (t) {
            if (!r.ok) throw new Error('API ' + r.status + ': ' + t.slice(0, 200));
            return JSON.parse(t);
          });
        })
        .then(render)
        .catch(function (e) {
          content.innerHTML = '<div class="state err">Couldn’t load data.<code>' + esc(e.message) + '</code>' +
            '<div style="margin-top:12px;color:var(--dim);">Confirm <b>MOSS_CLICKUP_TOKEN</b> is set in Vercel and the API is reachable at <code>' + esc(API_BASE) + '</code>.</div></div>';
        })
        .then(function () { btn.removeAttribute('aria-busy'); });
    }

    /* ═══════════════════════════════════════════════════════════════
       Render
       ═══════════════════════════════════════════════════════════════ */
    function render(data) {
      BUDGET = data.retainerBudget || 50;
      state.generatedAt = data.generatedAt ? new Date(data.generatedAt) : new Date();
      state.months = normalize(data);
      state.team = data.team || [];
      state.contributors = data.contributors || null;
      // The studio entry is skipped rather than stored: its mark is not shown.
      state.teamById = {};
      state.team.forEach(function (p) { if (!p.isStudio) state.teamById[p.id] = p; });

      var active = [];
      state.months.forEach(function (m) { if (m.total > 0) active.push(m.month); });

      var content = document.getElementById('content');
      if (!active.length) {
        setRangeText(String(YEAR));
        content.innerHTML = '<div class="state">No tracked hours for ' + YEAR + ' yet.</div>';
        tickClock();
        return;
      }

      var first = active[0], last = active[active.length - 1];
      state.range = state.months.slice(first, last + 1);
      // Closed on arrival. The table is a list of figures until the reader asks
      // one of them a question.
      if (state.selected !== null && (state.selected < first || state.selected > last)) state.selected = null;

      setRangeText(state.range.length + (state.range.length === 1 ? ' month' : ' months') +
        ' of tracked time · ' + MONTH_NAMES[first] + ' – ' + MONTH_NAMES[last] + ' ' + YEAR);

      // The table is part of the overview section now, not a section of its own.
      content.innerHTML = heroHtml() + overviewHtml();

      wireLegend();
      wireSummaryTable();
      wireAvatarFallbacks();
      wireExport();
      // Chart.js only reports hovers it receives, so leaving the plot has to
       // clear the link itself. Bound on the wrapper as well as the canvas,
       // since the legend and the view control sit over the top of it.
      ['#overviewChart', '.chart-wrap'].forEach(function (sel) {
        var el = document.querySelector(sel);
        if (el) el.addEventListener('mouseleave', function () { linkHover(null, 'chart-out'); });
      });
      drawChart();
      updateChartNote();
      startFunFacts(totals().total);
      tickClock();
    }

    /* ── Year-to-date hero ──────────────────────────────────────── */
    function heroHtml() {
      var t = totals();
      var months = allowanceMonths();

      var h = '<section class="sec"><div class="hero">';
      h += '<div class="hero-top">';
      h += '<div class="hero-total"><div class="eyebrow">Total hours delivered · ' + YEAR + '</div>' +
           '<div class="v grad num">' + fmtH(t.total) + '</div>' +
           '<div class="hero-ctx"><strong>Year to date</strong> · ' +
           months + ' ' + (months === 1 ? 'month' : 'months') + '</div></div>';
      h += '<div class="funfact"><div class="eyebrow">For scale</div>' +
           '<div class="ff-body">' + factStackHtml(t.total) + '</div>' +
           '<div class="ff-nav">' +
           '<button class="step-btn" data-fact="-1" aria-label="Previous comparison">' + ICONS.chevron + '</button>' +
           '<button class="step-btn" data-fact="1" aria-label="Next comparison">' + ICONS.chevron + '</button>' +
           '</div></div>';
      h += '</div>';

      /* This space has held the two summary meters and then the team roster.
         Both were repeats of what is charted below. The one thing the reader
         cannot get anywhere else is what the two colours mean and what the
         Creative series is measured against, so that is what sits here. */
      h += '<div class="split">' + defsHtml() + '</div>';

      h += '</div></section>';
      return h;
    }

    /* The two series, named and explained once, where the reader first meets
       them. Also the only place the retainer terms are stated. */
    function defsHtml() {
      var h = '';
      var c = state.contributors;
      if (c && c.contributing === 1 && c.queried > 1) {
        h += '<p class="data-alarm">' + ICONS.alert +
             'Only one account reporting: check data source</p>';
      }
      h += '<div class="defs">';
      h += '<div class="def"><span class="swatch" style="background:' + CATS[0].inkVar + '"></span>' +
           '<div class="def-body"><div class="def-name">' + CATS[0].label +
           '<span class="def-terms">' + BUDGET + 'h per month</span></div>' +
           '<p class="def-text">Retainer work, drawn against your monthly allowance. Every percentage ' +
           'in this report is the share of that allowance used.</p></div></div>';
      h += '<div class="def"><span class="swatch" style="background:' + CATS[1].inkVar + '"></span>' +
           '<div class="def-body"><div class="def-name">' + CATS[1].label + '</div>' +
           '<p class="def-text">Project work, scoped and billed separately. It sits outside the ' +
           'retainer and does not draw against it.</p></div></div>';
      h += '</div>';
      return h;
    }

    function monthSpanLabel(flag) {
      var ms = flag.months.slice().sort(function (a, b) { return a - b; });
      var label = ms.length > 1 ? MONTH_ABBR[ms[0]] + '–' + MONTH_ABBR[ms[ms.length - 1]] : MONTH_ABBR[ms[0]];
      return label + ' ' + flag.year + ' Creative';
    }
    /* A compact affordance that opens the shared modal. Same behaviour on
       desktop and touch, so there is no hover-only information. */
    function flagBtnHtml(flag, labelled) {
      return '<button type="button" class="flag-btn' + (labelled ? ' labelled' : '') +
        '" data-flag="' + esc(flag.id) + '" aria-label="' + esc(flag.label) + ', read the data note">' +
        ICONS.alert + (labelled ? esc(flag.label) : '') + '</button>';
    }

    /* ── Monthly contributors ───────────────────────────────────────
       Built from the team the API resolved through roster.js, so it shows who
       actually worked a month rather than a static brochure list. Names, titles
       and images never come from ClickUp.

       The studio mark is deliberately not rendered: as an avatar among faces it
       read as a person nobody could name. Unrostered ids are simply not shown,
       which is also why nothing here claims to be a count of the team. */
    function stackFor(ids) {
      var out = [];
      (ids || []).forEach(function (id) {
        var p = state.teamById[id];
        if (p) out.push({ img: p.stack, name: p.name, title: p.title });
      });
      return out;
    }

    function stackHtml(ids) {
      var people = stackFor(ids);
      if (!people.length) return '';
      var shown = people.slice(0, 6), extra = people.length - shown.length;
      var h = '<div class="stack-wrap"><div class="stack">';
      shown.forEach(function (p) {
        /* The roster's job titles left the page with the roster; they come back
           here, where the face is the thing that raises the question. Rendered
           rather than left to the browser's title attribute, which waits a
           second, styles itself and never appears on touch. */
        var label = p.name + (p.title ? ' · ' + p.title : '');
        h += '<span class="av" tabindex="0" data-tip="' + esc(label) + '" aria-label="' + esc(label) + '">' +
             '<img src="' + esc(p.img) + '" alt="" width="60" height="60" loading="lazy" data-fallback="1">' +
             '</span>';
      });
      if (extra > 0) h += '<span class="av-more" title="' + extra + ' more">+' + extra + '</span>';
      h += '</div><span class="stack-label">Your team this month</span></div>';
      return h;
    }

    /* A missing file used to fall back to the studio mark, which is exactly the
       artwork we no longer show. An avatar that cannot load is dropped instead:
       the name is already on the tooltip of the ones that did. */
    function wireAvatarFallbacks() {
      document.querySelectorAll('img[data-fallback]').forEach(function (img) {
        img.addEventListener('error', function () { (img.closest('.av') || img).style.display = 'none'; });
      });
    }

    /* ── Monthly overview ────────────────────────────────────────────
       The chart and the table are one section under one heading: the same year
       drawn, then written out, with each month's task detail folded into its
       own row. Two headings made them read as two separate exhibits. */
    function overviewHtml() {
      var t = totals();
      var h = '<section class="sec"><div class="sec-head">' +
        '<h2 class="sec-title">Monthly overview</h2>' +
        '<div class="menu-wrap">' +
        '<button class="export-link" id="exportBtn" aria-haspopup="true" aria-expanded="false">Export</button>' +
        '<div class="menu" id="exportMenu" role="menu"></div></div>' +
        '</div>';
      h += '<div class="chart-block">';
      h += '<div class="legend" id="legend">';
      CATS.forEach(function (c, i) {
        h += '<button class="legend-item" data-i="' + i + '" data-off="false" aria-pressed="true">' +
          '<span class="swatch" style="background:' + c.inkVar + '"></span>' +
          '<span class="lg-stack"><span class="lg-name">' + c.label + '</span>' +
          '<span class="val">' + fmtH(t[c.hours]) + '</span></span></button>';
      });
      // A key rather than a control: the total is drawn from the other two, so
      // there is nothing to isolate it from.
      h += '<span class="legend-item is-key" data-i="total">' +
        '<span class="swatch dash" aria-hidden="true"></span>' +
        '<span class="lg-stack"><span class="lg-name">Total</span>' +
        '<span class="val">' + fmtH(t.total) + '</span></span></span>';
      h += '</div>';
      h += '<div class="chart-wrap"><canvas id="overviewChart" role="img" ' +
        'aria-label="Bar chart of Creative and Other hours, with a total hours line"></canvas></div>';
      h += '</div>';
      h += '<div class="chart-key" id="chartNote"></div>';
      h += summaryHtml();
      h += '</section>';
      return h;
    }


    /* ── Monthly summary table, with the task detail as a per-month
       accordion so a month's figures and its tasks read as one thing ── */
    function summaryHtml() {
      var t = totals(), ytdPct = pctOf(t.creative, allowance());

      var h = '<div class="table-scroll"><table class="table"><thead><tr>' +
        '<th>Month</th>' +
        '<th class="r">Creative</th>' +
        '<th class="r col-gap">' + CATS[1].label + '</th>' +
        '<th class="r col-total">Total</th>' +
        '</tr></thead><tbody>';

      state.range.forEach(function (m) {
        var pct = pctOf(m.creative, BUDGET);
        var open = m.month === state.selected;
        h += '<tr class="mrow" data-m="' + m.month + '" tabindex="0" aria-expanded="' + open +
             '" aria-controls="acc-' + m.month + '">';
        // The data flag used to sit beside the month name here as well. It is
        // stated in full when the row opens, which is both stronger and only
        // one place.
        h += '<td><span class="mo"><span class="caret" aria-hidden="true">' + ICONS.chevron + '</span>' +
             '<span class="mo-full">' + MONTH_NAMES[m.month] + '</span>' +
             '<span class="mo-abbr">' + MONTH_ABBR[m.month] + '</span></span></td>';
        // Each figure carries its series colour, so a row's numbers and the
        // colour-coded task lists it opens onto are read as the same thing.
        h += '<td class="r num">' +
             '<span style="color:' + CATS[0].inkVar + '">' + fmtH(m.creative) + '</span>' +
             '<span class="use" style="color:' + pctColor(pct) + '">' + pct + '%</span></td>';
        h += '<td class="r num col-gap" style="color:' + CATS[1].inkVar + '">' + fmtH(m.nonCreative) + '</td>';
        h += '<td class="r num primary col-total">' + fmtH(m.total) + '</td>';
        h += '</tr>';
        h += '<tr class="acc" id="acc-' + m.month + '" data-m="' + m.month + '"' + (open ? '' : ' hidden') +
             '><td colspan="4"><div class="acc-inner">' + monthDetailHtml(m) + '</div></td></tr>';
      });

      h += '</tbody><tfoot><tr>';
