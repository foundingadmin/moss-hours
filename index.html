<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moss · Hours Report</title>
  <link rel="icon" href="https://brand.foundingcreative.com/favicon.svg" />

  <!-- Founding Creative design-system tokens (fonts, colors, radius, shadows, spacing) -->
  <link rel="stylesheet" href="https://brand.foundingcreative.com/css/tokens.css" />

  <style>
    /* ─────────────────────────────────────────────────────────────
       Report-specific styling, layered on the DS dark scheme.

       Series colors: FC's brand mint / lavender hues, stepped into the
       dark-mode lightness band for the chart + meter fills, with the full
       brand values kept for strokes, swatches and text accents.
       ───────────────────────────────────────────────────────────── */
    :root {
      /* Series fills sit at matched lightness gaps below their brand ink, so the
         outline reads against the fill with the same weight in both colours:
         mint 0.884 over 0.654, lavender 0.779 over 0.549. */
      --creative-fill: #27AC4B;
      --creative-ink: var(--mint);                  /* #7EF893 */
      --noncreative-fill: #7F5CB2;
      --noncreative-ink: var(--holo-lavender);      /* #C6A2FF */

      /* Semantic status. Green means the retainer is being used, which is good
         all the way to 100%; only going over is a warning. Yellow is reserved
         for data integrity, never for utilisation. */
      --ok: var(--mint);
      --over: #FF8A80;

      --warn: #F5C26B;              /* base: icons, rules */
      --warn-strong: #FFD68F;       /* titles on a warn surface */
      --warn-body: #EBD3AE;         /* body copy on a warn surface */
      --warn-surface: rgba(245, 194, 107, 0.09);
      --warn-surface-2: rgba(245, 194, 107, 0.16);
      --warn-line: rgba(245, 194, 107, 0.38);

      --surface: rgba(255, 255, 255, 0.05);
      --surface-2: rgba(255, 255, 255, 0.10);
      --line: rgba(255, 255, 255, 0.14);
      --line-soft: rgba(255, 255, 255, 0.08);

      /* Text ramp. --dim-2 was 0.45, which measured 4.6:1 and was doing real
         work at 11 to 13px; the whole ramp is lifted for legibility. */
      --ink-strong: rgba(255, 255, 255, 0.92);
      --dim: rgba(255, 255, 255, 0.78);
      --dim-2: rgba(255, 255, 255, 0.62);
      --tick-cut: var(--n-black);   /* meter segment gaps: always the page surface */

      /* One badge geometry for every chip, tag and pill in the report. */
      --badge-size: 12.5px;
      --badge-pad: 4px 10px;
      --badge-weight: 700;
    }

    /* One badge geometry, shared by every chip and tag in the report. */
    .badge, .flag-tag, .flag-btn.labelled {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--font-body); font-size: var(--badge-size);
      font-weight: var(--badge-weight); letter-spacing: .01em; line-height: 1.35;
      padding: var(--badge-pad); border-radius: var(--r-full);
      border: 1px solid currentColor; white-space: nowrap;
    }
    .badge svg, .flag-tag svg { width: 13px; height: 13px; flex: none; }

    body {
      background:
        radial-gradient(1100px 560px at 82% -8%, rgba(126, 248, 147, 0.10), transparent 60%),
        radial-gradient(820px 460px at -10% 6%, rgba(198, 162, 255, 0.08), transparent 55%),
        var(--n-black);
      background-attachment: fixed;
      font-size: 17px;
    }
    .page { max-width: 1060px; margin: 0 auto; padding: 0 28px 90px; }
    .num { font-variant-numeric: tabular-nums; }

    /* Anything we scroll the reader to has to clear the sticky masthead.
       --mh is measured from the live element, because its height changes with
       the breakpoint and with how the clock string happens to wrap. */
    .sec, .table tbody tr {
      scroll-margin-top: calc(var(--mh, 96px) + 16px);
    }

    @media (max-width: 560px) { .page { padding: 0 18px 64px; } }

    /* ── Masthead: agency × client lockup + live status bar ─────── */
    .masthead {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
      gap: 20px; flex-wrap: wrap;
      padding: 16px 0 24px; margin-bottom: 34px;
      border-bottom: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    /* Only the agency mark sits up here now. The client's mark leads the report
       title instead, where it reads as the subject of the page rather than as
       half of a co-branded lockup, which also makes this template reusable for
       any retainer client without re-balancing two wordmarks. */
    .lockup { --fc-h: 22px; display: flex; align-items: center; height: var(--fc-h); }
    .lockup img { display: block; width: auto; height: var(--fc-h); }

    .status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    /* A ticking seconds field in Manrope twitched the whole masthead once a
       second: measured, its digits run 7.47px to 8.00px wide, and it ships no
       tnum feature to even them out. So the readout is set in the platform's
       monospace face, where every digit is one advance by definition. It also
       suits what this is: a live instrument reading, not report copy. */
    .clock {
      display: flex; flex-direction: column; align-items: flex-end; gap: 3px;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 12px; line-height: 1.35; text-align: right; letter-spacing: -0.01em;
    }
    .clock .now { color: var(--white); font-weight: 600; }
    .clock .now .live-dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: var(--mint); margin-right: 6px; vertical-align: middle;
      box-shadow: 0 0 0 0 rgba(126, 248, 147, 0.6); animation: pulse 2.4s ease-out infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(126, 248, 147, 0.5); }
      70% { box-shadow: 0 0 0 7px rgba(126, 248, 147, 0); }
      100% { box-shadow: 0 0 0 0 rgba(126, 248, 147, 0); }
    }
    .clock .fetched { color: var(--dim-2); }

    /* On a phone the masthead is the single most expensive element on the page:
       it is sticky, and at three wrapped rows it was covering the top of
       whatever the reader had just scrolled to. Below 700px it becomes an
       explicit two-row grid, the clock collapses to one compact line (the
       string itself is shortened in tickClock), and the lockup steps down. */
    @media (max-width: 700px) {
      .masthead {
        display: grid; grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas: "lockup refresh" "clock clock";
        align-items: center; gap: 7px 10px;
        padding: 11px 0 12px; margin-bottom: 26px;
      }
      .masthead > .lockup { grid-area: lockup; }
      .masthead > .status { display: contents; }
      .status > .clock { grid-area: clock; }
      .status > #refreshBtn { grid-area: refresh; }
      .lockup { --fc-h: 19px; }
      .clock {
        flex-direction: row; align-items: baseline; flex-wrap: wrap;
        gap: 0 7px; font-size: 11.5px; text-align: left;
      }
      .clock .fetched::before { content: "·"; margin-right: 7px; }
      .btn { font-size: 14px; padding: 8px 11px; }
    }

    /* ── Buttons ────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      font-family: var(--font-body); font-size: 14.5px; font-weight: 600; color: var(--dim);
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm);
      padding: 8px 12px; cursor: pointer; transition: all .14s ease; white-space: nowrap;
    }
    .btn:hover { color: var(--white); background: var(--surface-2); border-color: rgba(255,255,255,0.22); }
    .btn:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
    .btn svg { width: 15px; height: 15px; flex: none; }
    .btn.icon-only { padding: 8px; }
    .btn[aria-busy="true"] svg { animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .menu-wrap { position: relative; }
    .menu {
      position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 226px;
      background: #101010; border: 1px solid var(--line); border-radius: var(--r-md);
      box-shadow: var(--shadow-2xl); padding: 6px; display: none;
    }
    .menu[data-open="true"] { display: block; }
    .menu button {
      display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
      font-family: var(--font-body); font-size: 14.5px; font-weight: 500; color: var(--dim);
      background: transparent; border: 0; border-radius: var(--r-xs); padding: 9px 10px; cursor: pointer;
    }
    .menu button:hover { background: var(--surface-2); color: var(--white); }
    .menu button svg { width: 14px; height: 14px; flex: none; opacity: .8; }
    .menu .menu-label {
      font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
      color: var(--dim-2); padding: 9px 10px 6px;
    }

    /* ── Title row + pill selectors ─────────────────────────────── */
    .title-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 30px; }
    /* The client mark reads as the first word of the title, so it is set on the
       title's own baseline. Moss's spear descends well below its artboard's
       cap line, so the mark is dropped by the measured share of its height to
       put the two baselines on one line. */
    .report-title {
      display: flex; align-items: baseline; gap: 15px;
      font-family: var(--font-display); font-size: clamp(30px, 5vw, 44px); font-weight: 600;
      letter-spacing: -0.01em; line-height: 1.05;
    }
    .report-title .client-mark { height: 0.78em; width: auto; margin-bottom: -0.222em; flex: none; }
    .report-range { font-size: 15px; color: var(--dim); margin-top: 7px; }

    /* Export lives beside the title, not in the masthead: from here it reads as
       "export this report", which is what it does, rather than as a global
       action that would follow you around the app. */
    .title-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 13px; }
    .export-link {
      display: inline-flex; align-items: center; gap: 7px;
      font-family: var(--font-body); font-size: 14.5px; font-weight: 600; color: var(--dim);
      background: transparent; border: 0; padding: 0; cursor: pointer;
      text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px;
      text-decoration-color: rgba(255, 255, 255, 0.3); white-space: nowrap;
      transition: color .14s ease, text-decoration-color .14s ease;
    }
    .export-link:hover { color: var(--white); text-decoration-color: var(--white); }
    .export-link:focus-visible { outline: 2px solid var(--holo-cyan); outline-offset: 3px; border-radius: 2px; }
    .export-link svg { width: 14px; height: 14px; flex: none; }
    @media (max-width: 560px) {
      .title-row { margin-bottom: 24px; }
      .title-actions { flex-direction: row; align-items: center; gap: 16px; }
    }
    @media (max-width: 430px) { .export-link .x-long { display: none; } }

    .pills { display: inline-flex; gap: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-full); padding: 4px; }
    .pill {
      font-family: var(--font-body); font-size: 15.5px; font-weight: 600; color: var(--dim);
      background: transparent; border: 0; cursor: pointer; padding: 9px 18px; border-radius: var(--r-full);
      transition: all .14s ease; white-space: nowrap;
    }
    .pill:hover { color: var(--white); }
    .pill[aria-pressed="true"], .pill[aria-selected="true"] { background: var(--mint); color: var(--n-black); }

    /* ── Section scaffolding ────────────────────────────────────────
       Each section is a dense visual in its own right, so the gap between them
       has to be wide enough to read as a break rather than as spacing inside
       one long block. */
    .sec { margin-bottom: 92px; }
    .sec:last-child { margin-bottom: 0; }
    .sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
    .sec-title { font-family: var(--font-display); font-size: 25px; font-weight: 600; margin: 0; }
    .sec-note { font-size: 14px; color: var(--dim-2); }
    .eyebrow {
      font-size: 12px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase;
      color: var(--dim-2);
    }

    /* ── Year-to-date hero panel ────────────────────────────────── */
    .hero {
      background: linear-gradient(158deg, rgba(255,255,255,0.062), rgba(255,255,255,0.022));
      border: 1px solid var(--line); border-radius: var(--r-xl);
      padding: 26px 28px 24px; box-shadow: var(--shadow-xl);
    }
    /* Two columns that share a top rail, so the eyebrows line up and the
       comparison reads as a second panel rather than text parked in the gap.
       The headline column is sized to its own content, which keeps the hairline
       beside it instead of stranded out in the middle of the card. */
    .hero-top {
      display: grid; grid-template-columns: auto minmax(0, 1fr);
      gap: 24px 38px; margin-bottom: 26px;
    }
    .hero-total { min-width: 0; }
    .hero-total .eyebrow, .funfact .eyebrow { margin-bottom: 9px; }
    .hero-total .v {
      font-family: var(--font-display); font-size: clamp(44px, 7.5vw, 66px); font-weight: 600;
      line-height: 1; letter-spacing: -0.015em;
      background: linear-gradient(100deg, #FFFFFF 0%, var(--mint) 26%, var(--holo-cyan) 45%,
                                  var(--holo-lavender) 64%, #FFFFFF 88%, var(--mint) 100%);
      background-size: 260% 100%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: sheen 14s linear infinite;
    }
    @keyframes sheen { to { background-position: -260% 0; } }

    /* Rotating comparison line. One idea at a time, cross-faded, set large
       enough to be read on the way past, which is the only way it ever gets
       read. Separated by the same hairline the card uses under this row. The
       block is anchored at its top: it rewrites itself every few seconds, and
       anchoring the bottom would shuffle the column on every change. */
    .funfact {
      border-left: 1px solid var(--line); padding-left: 38px;
      font-size: 19px; line-height: 1.5; color: var(--dim);
    }
    .funfact .ff-body {
      display: flex; align-items: flex-start; gap: 11px;
      min-height: 3em; max-width: 46ch;
    }
    .funfact .ff-icon { color: var(--mint); opacity: .8; flex: none; display: block; margin-top: 5px; }
    .funfact .ff-icon svg { width: 19px; height: 19px; display: block; }
    .funfact .ff-text {
      opacity: 1; transform: translateY(0);
      transition: opacity .6s ease, transform .6s ease;
      text-wrap: pretty;
    }
    .funfact .ff-text[data-out="true"] { opacity: 0; transform: translateY(-5px); }
    .funfact b { color: var(--ink-strong); font-weight: 600; }

    @media (prefers-reduced-motion: reduce) {
      .hero-total .v { animation: none; }
      .funfact .ff-text { transition: none; }
      .live-dot { animation: none !important; }
    }
    .hero-ctx { font-size: 15.5px; color: var(--dim); line-height: 1.6; margin-top: 12px; }
    .hero-ctx strong { color: var(--ink-strong); font-weight: 600; }

    /* Below this the two columns would fight over the same 400px, so they stack
       and the divider turns with them. */
    @media (max-width: 900px) {
      .hero-top { grid-template-columns: minmax(0, 1fr); gap: 20px; }
      .funfact { border-left: 0; border-top: 1px solid var(--line); padding-left: 0; padding-top: 20px; }
      .funfact .ff-body { max-width: none; }
    }
    /* The reserved height only carries weight once the columns stack: there the
       fact sits directly above the team divider, so a shorter one would pull the
       whole block up every few seconds. Beside the headline figure the row is
       taller than the fact either way. Each step is the measured worst case for
       its band, so re-check these if the fact list grows. */
    @media (max-width: 640px) { .funfact .ff-body { min-height: 3.1em; } }
    @media (max-width: 464px) { .funfact .ff-body { min-height: 4.5em; } }
    @media (max-width: 375px) { .funfact .ff-body { min-height: 6em; } }

    .split { border-top: 1px solid var(--line); padding-top: 22px; }
    /* Top-aligned, not centre-aligned: the label often runs to a second line on
       a narrow screen, and a swatch floating between the two lines reads as
       belonging to neither. */
    .srow-label { display: flex; align-items: flex-start; gap: 10px; font-size: 16.5px; font-weight: 700; }
    .srow-label > .swatch { margin-top: 6px; }
    .swatch { width: 11px; height: 11px; border-radius: 3px; display: inline-block; flex: none; }


    /* ── Category definitions, inside the hero card ──────────────────
       Answers "why is there a green series and a purple one?" and states the
       retainer terms once, in the place the reader meets the two colours. Kept
       deliberately light: the figures themselves are charted below, and a full
       roster of tiles here never filled its row on a small team. */
    .defs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 36px; }
    .def { display: flex; gap: 12px; align-items: flex-start; }
    .def > .swatch { margin-top: 7px; }
    .def-body { min-width: 0; }
    .def-name {
      display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
      font-size: 16.5px; font-weight: 700; color: var(--white);
    }
    .def-terms {
      font-size: 12.5px; font-weight: 700; color: var(--dim);
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--r-full); padding: 3px 9px; white-space: nowrap;
    }
    .def-text { font-size: 14.5px; line-height: 1.55; color: var(--dim-2); margin: 5px 0 0; text-wrap: pretty; }
    @media (max-width: 700px) { .defs { grid-template-columns: minmax(0, 1fr); gap: 18px; } }

    /* The regression this exists to catch: one account reporting while many
       were queried. It has to look broken on sight, not read as a footnote. */
    .data-alarm {
      display: flex; align-items: center; gap: 8px; margin: 0 0 18px;
      font-size: 14px; font-weight: 700; color: var(--warn);
      background: var(--warn-surface); border: 1px solid var(--warn-line);
      border-radius: var(--r-md); padding: 10px 13px;
    }
    .data-alarm svg { width: 16px; height: 16px; flex: none; }

    /* ── Monthly contributor stack ──────────────────────────────── */
    .stack { display: flex; align-items: center; }
    /* The cut-out between overlapping avatars is the only edge they need. It
       used to carry a hairline ring outside it as well, because the studio mark
       is mostly black and read as a hole in the row; that mark no longer
       appears here, and the second edge read as a stray white stroke. */
    .stack img, .stack .av-more {
      width: 48px; height: 48px; border-radius: var(--r-md);
      border: 2px solid var(--n-black); background: var(--surface-2);
      display: block; object-fit: cover;
    }
    .stack > * + * { margin-left: -14px; }
    .stack img { transition: transform .14s ease; }
    .stack img:hover { transform: translateY(-3px); z-index: 2; position: relative; }
    .av-more {
      display: flex; align-items: center; justify-content: center;
      font-size: 13.5px; font-weight: 700; color: var(--dim);
      background: var(--surface-2);
    }
    .stack-wrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .stack-label { font-size: 13px; color: var(--dim-2); }

    /* ── Data-integrity flag ────────────────────────────────────────
       Compact inline flag: pill in tables, superscript beside a figure. */
    .flag-tag { color: var(--warn); background: var(--warn-surface); border-color: var(--warn-line); cursor: help; }


    /* ── Chart + interactive legend ─────────────────────────────────
       Height is set inline by drawChart: fixed for the vertical layout, and
       proportional to the month count for the horizontal one, so bar thickness
       stays constant as the year fills up. */
    .chart-wrap { position: relative; width: 100%; height: 330px; }
    /* The legend floats in the plot's top-right corner instead of sitting under
       it, so the series totals read as part of the chart. drawChart reserves
       matching padding at the top of the canvas so no bar can run behind it. */
    .legend {
      position: absolute; top: 0; right: 0; z-index: 2;
      display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: flex-start;
      max-width: 100%; pointer-events: auto;
    }
    /* The legend doubles as the headline totals for each series, so the figure
       is the dominant element and the label sits above it. */
    .legend-item {
      display: inline-flex; flex-direction: column; align-items: flex-start; gap: 4px;
      font-family: var(--font-body); text-align: left;
      background: transparent; border: 1px solid transparent; border-radius: var(--r-md);
      padding: 9px 14px; cursor: pointer; transition: all .14s ease;
    }
    .legend-item:hover, .legend-item:focus-visible { background: var(--surface); border-color: var(--line); outline: none; }
    .legend-item .lg-name {
      display: flex; align-items: center; gap: 8px;
      font-size: 14px; font-weight: 600; color: var(--dim); transition: color .14s ease;
    }
    .legend-item:hover .lg-name, .legend-item:focus-visible .lg-name { color: var(--white); }
    .legend-item .val {
      font-family: var(--font-display); font-size: 25px; font-weight: 600; line-height: 1.05;
      letter-spacing: -0.01em; color: var(--white); font-variant-numeric: tabular-nums;
      padding-left: 19px;
    }
    .legend-item[data-off="true"] { opacity: .38; }
    .legend-item[data-off="true"] .swatch { background: var(--dim-2) !important; }
    @media (max-width: 560px) { .legend-item .val { font-size: 21px; } }

    /* Flag button: opens the shared modal. Bare icon by default so a table cell
       is not squeezed by a box; the labelled variant takes the badge geometry. */
    .flag-btn {
      display: inline-flex; align-items: center; justify-content: center;
      font-family: var(--font-body); color: var(--warn);
      background: none; border: 0; padding: 0; cursor: pointer;
      transition: color .14s ease, transform .14s ease; vertical-align: middle;
    }
    .flag-btn svg { width: 16px; height: 16px; display: block; }
    .flag-btn:hover { color: var(--warn-strong); transform: scale(1.12); }
    .flag-btn:focus-visible { outline: 2px solid var(--warn); outline-offset: 3px; border-radius: 3px; }
    .flag-btn.labelled {
      gap: 6px; font-size: var(--badge-size); font-weight: var(--badge-weight);
      padding: var(--badge-pad); border: 1px solid var(--warn-line);
      background: var(--warn-surface); border-radius: var(--r-full);
    }
    .flag-btn.labelled:hover { transform: none; background: var(--warn-surface-2); border-color: var(--warn); }
    .flag-btn.labelled svg { width: 13px; height: 13px; }

    /* ── Modal ──────────────────────────────────────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 60; display: flex;
      align-items: center; justify-content: center; padding: 24px;
      background: rgba(0, 0, 0, 0.66); backdrop-filter: blur(3px);
    }
    .modal-backdrop[hidden] { display: none; }
    .modal {
      width: min(540px, 100%);
      background: linear-gradient(165deg, var(--warn-surface-2), var(--warn-surface)), #0E0C08;
      border: 1px solid var(--warn-line); border-radius: var(--r-lg);
      box-shadow: var(--shadow-2xl); padding: 22px 24px 24px;
    }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
    .modal-title {
      font-family: var(--font-display); font-size: 20px; font-weight: 600; margin: 0;
      display: flex; align-items: center; gap: 10px;
    }
    .modal-title svg { width: 18px; height: 18px; flex: none; color: var(--warn); }
    .modal-body { font-size: 15.5px; line-height: 1.7; color: var(--warn-body); }
    .modal-body p { margin: 0 0 12px; }
    .modal-body p:last-child { margin-bottom: 0; }
    .modal-body b { color: var(--warn-strong); font-weight: 700; }
    .modal .btn { color: var(--warn-body); border-color: var(--warn-line); background: var(--warn-surface); }
    .modal .btn:hover { color: var(--warn-strong); background: var(--warn-surface-2); border-color: var(--warn); }

    /* ── Monthly summary table ──────────────────────────────────── */
    .table { width: 100%; border-collapse: collapse; font-size: 15.5px; }
    .table th, .table td { padding: 12px 12px; border-bottom: 1px solid var(--line-soft); text-align: left; }
    .table th {
      font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      color: var(--dim-2); border-bottom: 1px solid var(--line); white-space: nowrap;
    }
    .table td.r, .table th.r { text-align: right; }
    /* Selection is cyan, not mint. Mint means Creative everywhere else in the
       report, so using it for "this row is open" made a UI state look like a
       data category. Cyan is the brand's neutral action colour and belongs to
       neither series. */
    .table { --sel: var(--holo-cyan); --sel-row: rgba(105, 238, 255, 0.10); --sel-body: rgba(105, 238, 255, 0.045); }
    .table tbody tr.mrow { cursor: pointer; transition: background .12s ease, box-shadow .12s ease; }
    .table tbody tr.mrow:hover { background: rgba(255,255,255,0.085); }
    .table tbody tr.mrow:hover td:first-child { box-shadow: inset 3px 0 0 var(--dim-2); }
    .table tbody tr.mrow:focus-visible { outline: 2px solid var(--sel); outline-offset: -2px; }
    .table tbody tr.mrow[aria-expanded="true"] { background: var(--sel-row); }
    .table tbody tr.mrow[aria-expanded="true"] td { border-bottom-color: transparent; }
    /* The total column paints its own tint over the row's, which cut the open
       row in two. Give it a stronger step of the same hue instead, so the band
       stays one band and the column is still lifted. */
    .table tbody tr.mrow[aria-expanded="true"] td.col-total { background: rgba(105, 238, 255, 0.13); }
    .table tbody tr.mrow[aria-expanded="true"] td:first-child { box-shadow: inset 3px 0 0 var(--sel); }
    .table tbody tr.mrow[aria-expanded="true"] .mo { font-weight: 700; color: var(--white); }
    .table .mo { font-weight: 600; display: flex; align-items: center; gap: 8px; }
    /* The caret is the only thing saying the row opens, so it turns rather than
       appears: the closed and open states read as the same control. */
    .table .caret { display: inline-flex; width: 15px; height: 15px; flex: none; color: var(--dim-2); transition: transform .16s ease, color .16s ease; }
    .table .caret svg { width: 100%; height: 100%; }
    .table tbody tr.mrow:hover .caret { color: var(--white); }
    .table tbody tr.mrow[aria-expanded="true"] .caret { transform: rotate(90deg); color: var(--sel); }

    /* The open month's detail. It is drawn as a panel hanging off the bottom of
       its own row, sharing the row's tint and continuing its left marker, so
       the block is unmistakably part of the row above it and the next month's
       row is the next thing with a full-width rule under it. */
    .table tbody tr.acc > td { padding: 0 0 26px; border-bottom: 1px solid var(--line); background: var(--sel-row); }
    .acc-inner {
      box-shadow: inset 3px 0 0 var(--sel);
      background: rgba(255, 255, 255, 0.028);
      border-bottom-left-radius: var(--r-lg); border-bottom-right-radius: var(--r-lg);
      padding: 20px 24px 22px;
    }
    .acc-note { font-size: 13.5px; color: var(--dim-2); margin: 20px 0 0; }
    /* The month's own flag, which no longer marks the closed row. */
    .acc-flag { margin-bottom: 16px; }
    @media (max-width: 680px) { .acc-inner { padding: 16px 14px 18px; } }

    /* Both categories side by side, so the two task lists that add up to the
       row's total are visible at once instead of one scrolling past the other.
       They stack below 860px, where two columns of task names would truncate to
       nothing useful. */
    .cat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 34px; align-items: start; }
    @media (max-width: 860px) { .cat-grid { grid-template-columns: minmax(0, 1fr); gap: 4px; } }
    .table .primary { font-weight: 600; color: var(--white); }
    .table .of { color: var(--dim-2); font-weight: 500; }
    /* The share of the retainer, reading as an annotation on the figure it
       follows rather than as a second number of equal standing. */
    .table .use {
      display: inline-block; min-width: 46px; margin-left: 10px;
      font-size: 13.5px; font-weight: 700; text-align: right;
    }
    .table td.r, .table th.r { white-space: nowrap; }

    /* The Total column and the year-to-date row are sums, not more of the same
       data, so both are lifted out of the grid of monthly figures. The column
       before it keeps a wider gutter, so its figures are not pressed up against
       the tinted edge. */
    .table .col-gap { padding-right: 24px; }
    .table .col-total { background: rgba(255,255,255,0.045); }
    .table th.col-total { color: var(--ink-strong); }
    .table tbody tr.mrow td.col-total { font-weight: 700; color: var(--white); }
    .table tfoot td {
      border-bottom: 0; border-top: 2px solid var(--line);
      font-weight: 700; padding-top: 18px; padding-bottom: 16px;
      font-size: 17px; color: var(--white);
      background: rgba(255,255,255,0.05);
    }
    .table tfoot td:first-child { letter-spacing: .01em; }
    .table tfoot td.col-total { background: rgba(255,255,255,0.10); font-size: 18px; }
    /* The chart and the table are one unit: the chart is the shape of the year,
       the table is the same year in figures with its detail folded inside. A
       section-sized gap here made them read as two separate exhibits. */
    .table-scroll { overflow-x: auto; margin-top: 20px; }
    /* Month names are carried twice so the column can shorten without a
       re-render when the viewport crosses the breakpoint. */
    .mo-abbr { display: none; }

    /* At 390px all four columns still fit once the month drops to three
       letters, the padding tightens and the usage figure moves under the
       Creative hours instead of beside them. */
    @media (max-width: 680px) {
      .table { font-size: 14px; }
      .table th, .table td { padding: 11px 6px; }
      .table .col-gap { padding-right: 12px; }
      .table th:first-child, .table td:first-child { padding-left: 0; }
      .table th { font-size: 10.5px; letter-spacing: .06em; }
      .table .mo { gap: 6px; }
      .table .use { display: block; min-width: 0; margin: 2px 0 0; font-size: 12.5px; }
      .table tfoot td { font-size: 15px; }
      .table tfoot td.col-total { font-size: 16px; }
      .mo-full { display: none; }
      .mo-abbr { display: inline; }
    }
    /* Small phones: the four columns plus the total column's inset were 9px
       over the viewport, which read as a broken table rather than a scrollable
       one. Tighten the type and the gutters rather than drop a column. */
    @media (max-width: 430px) {
      .table { font-size: 13px; }
      .table th, .table td { padding: 10px 4px; }
      .table .col-gap { padding-right: 9px; }
      .table .caret { width: 13px; height: 13px; }
      .table .use { font-size: 12px; }
    }

    @media (max-width: 640px) {
      .srow-label { font-size: 16px; }
      .hero { padding: 20px 18px 18px; }
      .hero-top { gap: 16px; margin-bottom: 20px; }
      .hero-ctx { font-size: 14.5px; }
      .funfact { font-size: 16.5px; padding-top: 16px; }

      .sec { margin-bottom: 62px; }
      .sec-title { font-size: 22px; }
    }

    /* ── Month detail, inside the summary table's accordion ──────────
       The month, its total and its split are all in the row this hangs from,
       so none of them are repeated here. What is left is the thing the row
       cannot show: which tasks the hours went to, and who worked them. */
    .cat { margin-top: 18px; }
    .cat-head { margin-bottom: 2px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
    .row { display: flex; align-items: center; gap: 13px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
    .row:last-child { border-bottom: 0; }
    .row .name { flex: 1 1 0; min-width: 0; font-size: 15.5px; font-weight: 500; color: var(--ink-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .track { flex: 0 0 130px; height: 6px; background: rgba(255, 255, 255, 0.14); border-radius: var(--r-full); overflow: hidden; }
    .row .track .fill { display: block; height: 100%; border-radius: var(--r-full); }
    .row .hrs { flex: none; min-width: 72px; white-space: nowrap; font-size: 15.5px; font-weight: 600; color: var(--white); text-align: right; font-variant-numeric: tabular-nums; }
    .row .link {
      flex: none; display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 6px; color: var(--dim-2);
      border: 1px solid transparent; transition: all .14s ease;
    }
    .row .link:hover { color: var(--mint); background: var(--surface-2); border-color: var(--line); }
    .row .link svg { width: 14px; height: 14px; }
    .row .link.placeholder { opacity: .22; pointer-events: none; }
    .empty-note { font-size: 15px; color: var(--dim-2); font-style: italic; margin: 10px 0 0; }
    /* Half the width means half the room for a task name, which is the one
       thing here worth protecting. The mini-bar is the first thing to go. */
    @media (min-width: 861px) { .cat-grid .row .track { flex: 0 0 76px; } }
    @media (max-width: 560px) {
      .row .track { display: none; }
      /* A truncated task name is the one thing on this page a client cannot
         look up elsewhere, so it wraps instead of ending in an ellipsis. */
      .row { align-items: flex-start; gap: 10px; padding: 11px 0; }
      .row .name { white-space: normal; overflow: visible; line-height: 1.35; }
      .row .hrs { flex: 0 0 auto; min-width: 60px; }
      .cat { margin-top: 22px; }
    }
    /* Touch: 16px icons are legitimate targets only if their hit area is not. */
    @media (hover: none) {
      .flag-btn { position: relative; }
      .flag-btn:not(.labelled)::after { content: ""; position: absolute; inset: -11px; }
      .row .link { width: 34px; height: 34px; }
    }

    /* ── States + footer ────────────────────────────────────────── */
    .state { text-align: center; padding: 80px 20px; color: var(--dim); font-size: 17px; }
    .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--mint); animation: spin 1s linear infinite; margin: 0 auto 18px; }
    .err { color: var(--over); }
    .err code { display: block; margin-top: 12px; color: var(--dim); font-size: 14.5px; word-break: break-word; }

    .foot {
      margin-top: 64px; padding-top: 8px;
      display: flex; justify-content: space-between; align-items: center; gap: 18px; flex-wrap: wrap;
      font-size: 14px; color: var(--dim-2); line-height: 1.7;
    }
    .foot-brand { display: flex; flex-direction: column; gap: 9px; max-width: 62ch; }
    .foot-fine { font-size: 14px; line-height: 1.7; color: var(--dim-2); margin: 0; max-width: 46ch; text-wrap: pretty; }
    .foot-link {
      color: var(--mint); text-decoration: underline; text-underline-offset: 3px;
      text-decoration-thickness: 1px; text-decoration-color: rgba(126, 248, 147, 0.45);
      transition: text-decoration-color .14s ease, color .14s ease;
    }
    .foot-link:hover { text-decoration-color: var(--mint); }
    .foot-link.primary {
      display: inline-flex; align-items: center; gap: 9px; width: fit-content;
      font-size: 15px; font-weight: 600; color: var(--white);
      text-decoration-color: rgba(255, 255, 255, 0.3);
    }
    .foot-link.primary:hover { color: var(--mint); text-decoration-color: var(--mint); }
    .foot-link.primary svg { width: 13px; height: 13px; opacity: .7; }
    .foot img { height: 17px; width: auto; display: block; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* ── Print / Save-as-PDF ─────────────────────────────────────
       Re-point the tokens rather than patching selector by selector, so
       every colour that inherits from them flips with one change. The
       brand hues are re-stepped for contrast against white paper, which
       also carries the derived --creative-ink / --noncreative-ink / --ok. */
    @media print {
      :root {
        --mint: #147A38;
        --holo-lavender: #5E3B96;
        --creative-fill: #2E9950;
        --noncreative-fill: #8461BE;
        --warn: #9A6512;
        --over: #B3261E;
        --white: #111111;
        --text: #111111;
        --ink-strong: rgba(0, 0, 0, 0.92);
        --tick-cut: #FFFFFF;
        --dim: rgba(0, 0, 0, 0.70);
        --dim-2: rgba(0, 0, 0, 0.55);
        --line: rgba(0, 0, 0, 0.18);
        --line-soft: rgba(0, 0, 0, 0.10);
        --surface: transparent;
        --surface-2: rgba(0, 0, 0, 0.10);
        --warn-strong: #6E4406;
        --warn-body: #3B2E15;
        --warn-surface: #FCF6EA;
        --warn-surface-2: #F7EBD5;
        --warn-line: #D9B676;
      }
      /* Gradient text does not print; fall back to solid ink. */
      .hero-total .v {
        background: none; -webkit-text-fill-color: #111; color: #111; animation: none;
      }
      body { background: #fff !important; color: #111; font-size: 10.5pt; }
      .page { max-width: none; padding: 0; }
      .masthead { position: static; background: none; backdrop-filter: none; padding-top: 0; }
      .lockup img, .report-title .client-mark { filter: invert(1); }
      .status, .pills, .sec-note, .row .link, .menu-wrap, .flag-btn { display: none !important; }
      .hero { background: none !important; box-shadow: none; }
      .sec { break-inside: avoid; margin-bottom: 26px; }
      /* Selection is a screen state. On paper the open month is simply the one
         with its detail printed under it, so the cyan goes and the nesting is
         carried by rules instead. */
      .table tbody tr.mrow[aria-expanded="true"] { background: none; }
      .table tbody tr.mrow[aria-expanded="true"] td:first-child { box-shadow: inset 3px 0 0 rgba(0, 0, 0, 0.45); }
      .table tbody tr.mrow[aria-expanded="true"] td.col-total { background: rgba(0, 0, 0, 0.045); }
      .table tbody tr.acc > td { background: none; }
      .acc-inner { box-shadow: none; background: none; border-left: 2px solid rgba(0, 0, 0, 0.3); padding: 12px 0 4px 16px; }
      .table .caret { display: none; }
      /* The tints that separate the sums on screen are invisible on paper. */
      .table .col-total { background: rgba(0, 0, 0, 0.045); }
      .table tfoot td { background: rgba(0, 0, 0, 0.06); border-top-color: rgba(0, 0, 0, 0.35); }
      .table tfoot td.col-total { background: rgba(0, 0, 0, 0.10); }
      a { color: #111 !important; }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
</head>
<body>
  <div class="page">

    <footer class="foot">

      </a>

    <!-- Reusable detail modal: used by the data-integrity flags, and available
         to any future note that would otherwise clutter the layout. -->
    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
