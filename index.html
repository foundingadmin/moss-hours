      h += '<td class="ytd-label"><span class="mo-full">Year to date</span><span class="mo-abbr">Total</span></td>';
      h += '<td class="r num" style="color:' + CATS[0].inkVar + '">' + fmtH(t.creative) +
           '<span class="use" style="color:' + pctColor(ytdPct) + '">' + ytdPct + '%</span></td>';
      h += '<td class="r num col-gap" style="color:' + CATS[1].inkVar + '">' + fmtH(t.nonCreative) + '</td>';
      h += '<td class="r num col-total"><span class="grad">' + fmtH(t.total) + '</span></td>';
      h += '</tr></tfoot></table></div>';
      return h;
    }

    /* One month at a time: opening a row closes whichever was open, and
       selecting the open month closes it again. */
    function toggleMonth(monthIdx) {
      openMonth(state.selected === monthIdx ? null : monthIdx);
    }

    // Unconditional, for the chart: clicking a bar opens that month whether or
    // not it was already the open one.
    function openMonth(monthIdx, scroll) {
      state.selected = monthIdx;
      document.querySelectorAll('.table tbody tr.mrow').forEach(function (r) {
        r.setAttribute('aria-expanded', parseInt(r.dataset.m) === state.selected);
      });
      document.querySelectorAll('.table tbody tr.acc').forEach(function (r) {
        r.hidden = parseInt(r.dataset.m) !== state.selected;
      });
      if (state.selected === null) return;
      var row = document.querySelector('.table tbody tr.mrow[data-m="' + state.selected + '"]');
      // 'nearest' so a row already on screen does not jump under the reader.
      if (row && scroll !== false) row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function wireSummaryTable() {
      document.querySelectorAll('.table tbody tr.mrow').forEach(function (r) {
        var month = parseInt(r.dataset.m);
        // A flag button inside the row is handled in the capture phase by
        // wireModal, which stops the event before it reaches this listener.
        r.addEventListener('click', function () { toggleMonth(month); });
        r.addEventListener('keydown', function (e) {
          // Only the row itself: Enter on the flag button it contains belongs
          // to the button.
          if (e.target !== r) return;
          if (e.key !== 'Enter' && e.key !== ' ') return;
          e.preventDefault();
          toggleMonth(month);
        });
        // Pointing at a month here dims every other month in the chart above.
        r.addEventListener('mouseenter', function () { linkHover(month); });
        r.addEventListener('focus', function () { linkHover(month); });
        r.addEventListener('mouseleave', function () { linkHover(null); });
        r.addEventListener('blur', function () { linkHover(null); });
      });
      // Leaving the table by any route clears it.
      var tbl = document.querySelector('.table');
      if (tbl) tbl.addEventListener('mouseleave', function () { linkHover(null); });

    }

    /* What the row itself cannot show: where the hours went, and who worked
       them. The month, its total and its Creative / Other split are all in the
       row this hangs from, so none of them are repeated here. */
    function taskCount(m) {
      return (m.creativeItems || []).length + (m.nonCreativeItems || []).length;
    }

    /* Top of the drawer: who worked the month on one side, how much there is to
       read on the other. Neither is in the row above, which already carries the
       month, its split and its total. */
    function drawerHeadHtml(m) {
      var n = taskCount(m);
      return '<div class="acc-top">' +
        (stackHtml(m.contributorIds) || '<span></span>') +
        '<span class="dh-meta">' + n + (n === 1 ? ' task' : ' tasks') + ' this month</span>' +
        '</div>';
    }

    function monthDetailHtml(m) {
      var h = drawerHeadHtml(m);
      h += '<div class="cat-grid">';
      CATS.forEach(function (c) {
        var items = m[c.items] || [];
        // The flag rides with the series it applies to, beside its name.
        var flag = flagFor(YEAR, m.month, c.key);
        h += '<div class="cat">';
        h += '<div class="cat-head"><span class="srow-label">' +
             '<span class="swatch" style="background:' + c.inkVar + '"></span>' + c.label + '</span>' +
             (flag ? flagBtnHtml(flag, true) : '') + '</div>';
        h += taskRows(items, c) || '<p class="empty-note">No ' + c.label.toLowerCase() + ' time tracked this month.</p>';
        h += '</div>';
      });
      h += '</div>';
      h += '<p class="acc-note">Sorted by most hours. Links open the ClickUp task where one exists.</p>';
      return h;
    }

    function taskRows(items, cat) {
      if (!items || !items.length) return '';
      var max = items.reduce(function (a, t) { return Math.max(a, t.hours); }, 0);
      return '<div style="margin-top:6px">' + sortItems(items).map(function (t) {
        var w = max > 0 ? Math.round((t.hours / max) * 100) : 0;
        // Short tasks arrive rolled up into one row so the lines still sum to
        // the header; show how many were folded in.
        var name = t.aggregated
          ? t.name + ' (' + t.count + (t.count === 1 ? ' task' : ' tasks') + ')'
          : t.name;
        var link = t.url
          ? '<a class="link" href="' + esc(t.url) + '" target="_blank" rel="noopener" title="Open “' + esc(t.name) + '” in ClickUp" aria-label="Open ' + esc(t.name) + ' in ClickUp">' + ICONS.external + '</a>'
          : '<span class="link placeholder" title="No ClickUp link available" aria-hidden="true">' + ICONS.external + '</span>';
        return '<div class="row">' +
          '<span class="name" title="' + esc(name) + '">' + esc(name) + '</span>' +
          '<span class="track"><span class="fill" style="width:' + w + '%;background:' + cat.fillVar + '"></span></span>' +
          '<span class="hrs">' + fmtH(t.hours) + '</span>' +
          link +
        '</div>';
      }).join('') + '</div>';
    }

    /* ═══════════════════════════════════════════════════════════════
       Chart: grouped bars, hatched where data is flagged
       ═══════════════════════════════════════════════════════════════ */
    var patternCache = {};
    function hatch(color) {
      if (patternCache[color]) return patternCache[color];
      var c = document.createElement('canvas');
      c.width = c.height = 8;
      var g = c.getContext('2d');
      g.fillStyle = color; g.fillRect(0, 0, 8, 8);
      g.strokeStyle = 'rgba(255,255,255,0.42)'; g.lineWidth = 2;
      g.beginPath();
      g.moveTo(-2, 10); g.lineTo(10, -2);
      g.moveTo(2, 14); g.lineTo(14, 2);
      g.moveTo(-6, 6); g.lineTo(6, -6);
      g.stroke();
      patternCache[color] = g.createPattern(c, 'repeat');
      return patternCache[color];
    }

    // emphasis: index of the isolated series, or null for "show everything".
    var emphasis = null;
    var GHOST = 'rgba(255,255,255,0.06)';
    var GHOST_LINE = 'rgba(255,255,255,0.14)';

    /* The total overlay is the one series that is not a category, so it is
       drawn in neutral ink rather than competing with Creative or Other. */
    function totalInk() { return printing ? '#444444' : 'rgba(255,255,255,0.78)'; }
    function isTotalSeries(i) { return !CATS[i]; }

    /* Projected bars must not be readable as delivered hours: they are drawn as
       outlines over a textured ground, and named in the key under the chart. */
    function projFill() { return 'transparent'; }
    function projLine(c) { return rgba(c.ink, 0.6); }
    function rgba(hex, a) {
      var n = parseInt(hex.slice(1), 16);
      return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    }

    function barColors(catIdx, which) {
      var c = CATS[catIdx];
      var ghosted = emphasis !== null && emphasis !== catIdx;
      return chartRows.map(function (r) {
        var dim = ghosted || (hoverMonth !== null && !(r.kind === 'month' && r.month === hoverMonth));
        if (dim) return which === 'fill' ? GHOST : GHOST_LINE;
        if (r.projected) return which === 'fill' ? projFill() : projLine(c);
        var flagged = r.kind === 'month' && !!flagFor(YEAR, r.month, c.key);
        if (which === 'fill') return flagged ? hatch(c.fill) : c.fill;
        return c.ink;
      });
    }

    function applyEmphasis(next) {
      emphasis = next;
      paintBars();
    }

    function wireLegend() {
      /* The total is the dataset after the categories, so pointing at its key
         isolates it exactly the way pointing at a series does: everything that
         is not it drops back. It has no click, so no focus handling either. */
      var key = document.querySelector('#legend .legend-item.is-key');
      if (key) {
        key.addEventListener('mouseenter', function () {
          if (chartHasTotal) applyEmphasis(CATS.length);
        });
        key.addEventListener('mouseleave', function () { applyEmphasis(null); });
      }
      document.querySelectorAll('#legend .legend-item:not(.is-key)').forEach(function (b) {
        var i = parseInt(b.dataset.i);
        if (isNaN(i)) return;
        b.addEventListener('mouseenter', function () { if (!state.hidden[i]) applyEmphasis(i); });
        b.addEventListener('focus', function () { if (!state.hidden[i]) applyEmphasis(i); });
        b.addEventListener('mouseleave', function () { applyEmphasis(null); });
        b.addEventListener('blur', function () { applyEmphasis(null); });
        b.addEventListener('click', function () {
          state.hidden[i] = !state.hidden[i];
          b.dataset.off = state.hidden[i] ? 'true' : 'false';
          b.setAttribute('aria-pressed', String(!state.hidden[i]));
          if (chart) { chart.setDatasetVisibility(i, !state.hidden[i]); chart.update(); }
          applyEmphasis(null);
        });
      });
    }

    /* The chart is drawn to a canvas, so the print stylesheet can't reach its
       axis text, gridlines or markers, so re-theme it around the print events. */
    var printing = false;
    function chartTheme(isPrint) {
      printing = isPrint;
      projGroundPattern = null;
      if (!chart) return;
      var s = chart.options.scales;
      // Which axis carries the months flips with the orientation.
      var horiz = chart.options.indexAxis === 'y';
      var cat = horiz ? s.y : s.x, val = horiz ? s.x : s.y;
      cat.ticks.color = isPrint ? 'rgba(0,0,0,0.62)' : 'rgba(255,255,255,0.62)';
      val.ticks.color = isPrint ? 'rgba(0,0,0,0.55)' : 'rgba(255,255,255,0.55)';
      val.grid.color = isPrint ? 'rgba(0,0,0,0.16)' : 'rgba(255,255,255,0.13)';
      // The floor the bars stand on, which is on the category axis.
      cat.border.color = isPrint ? 'rgba(0,0,0,0.42)' : 'rgba(255,255,255,0.34)';
      chart.data.datasets.forEach(function (ds, i) {
        if (!isTotalSeries(i)) return;
        ds.borderColor = ds.pointBackgroundColor = ds.pointBorderColor = totalInk();
      });
      chart.update('none');
    }
    window.addEventListener('beforeprint', function () { chartTheme(true); });
    window.addEventListener('afterprint', function () { chartTheme(false); });

    /* The same warning triangle as ICONS.alert, drawn onto the canvas so the
       chart marker matches the flag buttons elsewhere. Path2D
       takes the icon's own path data; a plain triangle stands in if the browser
       cannot parse it. */
    var ALERT_PATH = 'M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z';
    var alertPath2D = null;
    try { alertPath2D = new Path2D(ALERT_PATH); } catch (e) { alertPath2D = null; }

    function drawWarnIcon(g, cx, cy, size, color) {
      g.save();
      g.translate(cx - size / 2, cy - size / 2);
      g.scale(size / 24, size / 24);
      g.strokeStyle = color;
      g.lineWidth = 2.2;
      g.lineJoin = 'round';
      g.lineCap = 'round';
      if (alertPath2D) {
        g.stroke(alertPath2D);
      } else {
        g.beginPath();
        g.moveTo(12, 3); g.lineTo(22.5, 21); g.lineTo(1.5, 21); g.closePath();
        g.stroke();
      }
      g.beginPath(); g.moveTo(12, 9); g.lineTo(12, 13.5); g.stroke();
      g.beginPath(); g.moveTo(12, 17); g.lineTo(12.01, 17); g.stroke();
      g.restore();
    }

    /* Horizontal only. A phone has no room for a value axis worth reading, so
       the hours are written at the end of each bar instead, in the series
       colour, with the data flag (where there is one) leading them. That also
       gives a touch reader the figure a hover tooltip would have given. */
    var END_GAP = 9, FLAG_W = 20;
    var barEndLabels = {
      id: 'barEndLabels',
      afterDatasetsDraw: function (c) {
        if (c.options.indexAxis !== 'y') return;
        var g = c.ctx;
        var font = getComputedStyle(document.body).fontFamily;
        c.data.datasets.forEach(function (ds, di) {
          if (isTotalSeries(di) || !c.isDatasetVisible(di)) return;
          var ghosted = emphasis !== null && emphasis !== di;
          var meta = c.getDatasetMeta(di);
          meta.data.forEach(function (bar, bi) {
            var r = chartRows[bi];
            if (!r) return;
            var x = bar.x + END_GAP;
            if (r.kind === 'month' && flagFor(YEAR, r.month, CATS[di].key)) {
              drawWarnIcon(g, x + 7, bar.y, 14,
                ghosted ? GHOST_LINE : (printing ? '#9A6512' : '#F5C26B'));
              x += FLAG_W;
            }
            g.save();
            g.font = '600 12.5px ' + font;
            g.textAlign = 'left';
            g.textBaseline = 'middle';
            g.fillStyle = (ghosted || r.projected)
              ? GHOST_LINE : (printing ? '#333333' : CATS[di].ink);
            g.fillText(fmtH(ds.data[bi]), x, bar.y);
            g.restore();
          });
        });
      }
    };

    /* The estimated stretch of the year gets its own ground: a hairline where
       tracked time stops and a diagonal texture over everything after it. The
       texture is what the key under the chart names, which is why there is no
       longer a word floating in the plot. */
    var projGroundPattern = null;
    function projGround(g) {
      if (projGroundPattern) return projGroundPattern;
      var c = document.createElement('canvas');
      c.width = c.height = 9;
      var x = c.getContext('2d');
      x.strokeStyle = printing ? 'rgba(0,0,0,0.16)' : 'rgba(255,255,255,0.11)';
      x.lineWidth = 2;
      x.beginPath();
      x.moveTo(-2, 11); x.lineTo(11, -2);
      x.moveTo(-2, 20); x.lineTo(20, -2);
      x.moveTo(-11, 2); x.lineTo(2, -11);
      x.stroke();
      projGroundPattern = g.createPattern(c, 'repeat');
      return projGroundPattern;
    }

    var projBoundary = {
      id: 'projBoundary',
      beforeDatasetsDraw: function (c) {
        if (!chartProjection || chartProjection.from > 11) return;
        var i = chartProjection.from;
        if (i <= 0 || i >= chartRows.length) return;
        var meta = c.getDatasetMeta(0);
        var bar = meta.data[i], prev = meta.data[i - 1];
        if (!bar || !prev) return;
        var horiz = c.options.indexAxis === 'y';
        var a = c.chartArea;
        var g = c.ctx;
        g.save();
        g.fillStyle = projGround(g);
        g.strokeStyle = printing ? 'rgba(0,0,0,0.28)' : 'rgba(255,255,255,0.22)';
        g.setLineDash([4, 4]);
        g.lineWidth = 1;
        g.beginPath();
        if (horiz) {
          var y = (bar.y + prev.y) / 2;
          g.fillRect(a.left, y, a.right - a.left, a.bottom - y);
          g.moveTo(a.left, y); g.lineTo(a.right, y);
        } else {
          var x = (bar.x + prev.x) / 2;
          g.fillRect(x, a.top, a.right - x, a.bottom - a.top);
          g.moveTo(x, a.top); g.lineTo(x, a.bottom);
        }
        g.stroke();
        g.restore();
      }
    };

    /* Curvature for the total line and for everything drawn alongside it. Set
       high enough that the projected half reads as a soft sweep rather than as
       a set of ruled segments: an estimate should not look surveyed. */
    var LINE_TENSION = 0.42;

    /* Chart.js keeps its spline maths to itself, so the band drawn around the
       total line would be a polygon laid over a curve, disagreeing with it
       between every pair of months. This is the same calculation Chart.js runs
       on the line (helpers.splineCurve): each point's control points sit along
       the chord between its two neighbours, weighted by how far away each
       neighbour is. An endpoint stands in as its own missing neighbour, which
       is what leaves the first and last spans slack rather than straight. */
    function splineCtrl(a, b, c, t) {
      if (!a) a = b;
      if (!c) c = b;
      var d01 = Math.hypot(b.x - a.x, b.y - a.y);
      var d12 = Math.hypot(c.x - b.x, c.y - b.y);
      var sum = d01 + d12;
      if (!sum) return { prev: b, next: b };
      var fa = t * d01 / sum, fb = t * d12 / sum;
      return {
        prev: { x: b.x - fa * (c.x - a.x), y: b.y - fa * (c.y - a.y) },
        next: { x: b.x + fb * (c.x - a.x), y: b.y + fb * (c.y - a.y) }
      };
    }
    /* Appends a curve through `pts` to the open path. `join` continues from
       wherever the path already is, which is what the filled band needs when it
       turns the corner at the far end and comes back along its other edge.

       Control points are held inside the plot, as Chart.js holds the line's:
       a steep last month can throw one past the top of the frame, and the band
       would billow out over the axis rather than following the line. */
    function curveThrough(g, pts, t, area, join) {
      if (!pts.length) return;
      var clamp = function (v, lo, hi) { return Math.min(Math.max(v, lo), hi); };
      var hold = function (p) {
        return area
          ? { x: clamp(p.x, area.left, area.right), y: clamp(p.y, area.top, area.bottom) }
          : p;
      };
      if (join) g.lineTo(pts[0].x, pts[0].y);
      else g.moveTo(pts[0].x, pts[0].y);
      for (var i = 0; i < pts.length - 1; i++) {
        var out = hold(splineCtrl(pts[i - 1], pts[i], pts[i + 1], t).next);
        var into = hold(splineCtrl(pts[i], pts[i + 1], pts[i + 2], t).prev);
        g.bezierCurveTo(out.x, out.y, into.x, into.y, pts[i + 1].x, pts[i + 1].y);
      }
    }

    /* The high/low band, drawn as a cone opening out of the last tracked total.
       The texture says "this half of the chart is estimated"; the band says how
       loosely, which is the part a single projected line cannot express. It
       hangs off the total line, so it is drawn only in the layout that has one.

       Anchored at the last tracked month with zero width, so it grows out of a
       figure the reader can check rather than appearing from nowhere. */
    var projBand = {
      id: 'projBand',
      beforeDatasetsDraw: function (c) {
        if (c.options.indexAxis === 'y') return;
        var p = chartProjection;
        if (!p || p.from > 11 || !p.spread) return;
        var meta = c.getDatasetMeta(CATS.length);
        if (!meta || !meta.data || !meta.data.length) return;
        var val = c.scales.y;
        if (!val) return;

        var pts = [];
        for (var i = Math.max(0, p.from - 1); i < chartRows.length; i++) {
          var el = meta.data[i], r = chartRows[i];
          if (!el || !r) continue;
          var lo = r.projected ? p.low[r.month] : r.total;
          var hi = r.projected ? p.high[r.month] : r.total;
          if (lo == null || hi == null) continue;
          pts.push({ x: el.x, lo: val.getPixelForValue(lo), hi: val.getPixelForValue(hi) });
        }
        if (pts.length < 2) return;

        // Isolating a series pushes the band back with the total line it belongs
        // to, so the emphasis reads as one move rather than the band hanging on.
        var faded = hoverMonth !== null || (emphasis !== null && emphasis !== CATS.length);
        var g = c.ctx;
        var hiPts = pts.map(function (pt) { return { x: pt.x, y: pt.hi }; });
        var loPts = pts.map(function (pt) { return { x: pt.x, y: pt.lo }; });
        g.save();
        // Out along the top edge, back along the bottom, both on the same
        // curve the total line runs down the middle of.
        g.beginPath();
        curveThrough(g, hiPts, LINE_TENSION, c.chartArea, false);
        curveThrough(g, loPts.slice().reverse(), LINE_TENSION, c.chartArea, true);
        g.closePath();
        g.fillStyle = printing
          ? 'rgba(0,0,0,0.05)'
          : 'rgba(255,255,255,' + (faded ? 0.028 : 0.06) + ')';
        g.fill();

        // Edges, dashed like the total line they bracket.
        g.setLineDash([4, 4]);
        g.lineWidth = 1;
        g.strokeStyle = printing
          ? 'rgba(0,0,0,0.26)'
          : 'rgba(255,255,255,' + (faded ? 0.11 : 0.24) + ')';
        [hiPts, loPts].forEach(function (edge) {
          g.beginPath();
          curveThrough(g, edge, LINE_TENSION, c.chartArea, false);
          g.stroke();
        });
        g.restore();
      }
    };

    /* Total hours per month, drawn over the paired bars so the shape of the
       month-to-month workload reads without adding the two bars up by eye.
       Vertical layout only: the horizontal one pins its value axis to the
       largest single bar, and a line of totals would run off the end of it. */
    function totalLineDataset() {
      var ink = totalInk();
      return {
        type: 'line',
        label: 'Total',
        data: chartRows.map(function (r) { return r.total; }),
        borderColor: ink,
        backgroundColor: 'transparent',
        borderWidth: 2,
        borderDash: [5, 4],
        /* Ghosted from the boundary onward: past it the line is an estimate too,
           and should carry no more weight than the hollow bars under it. */
        segment: {
          borderColor: function (ctx) {
            var i = ctx.p1DataIndex;
            var r = chartRows[i];
            return (r && r.projected) ? GHOST_LINE : undefined;
          }
        },
        tension: LINE_TENSION,
        pointRadius: 3.5,
        pointHoverRadius: 6,
        pointBackgroundColor: pointColors(),
        pointBorderColor: pointColors(),
        fill: false,
        // Lower order draws on top of the bars.
        order: 0
      };
    }

    /* The legend's figures are the totals for whatever the chart is showing, so
       dropping into a single month re-totals them to that month. Projected
       months are never counted: they are not delivered hours. */
    /* A projection in a client-facing report has to say what it is and where it
       came from, in the same breath as the bars. Written as a key to the
       textured ground rather than as a footnote.

       It no longer names the months it covers: the chart already shows which
       ones are textured, and repeating them spent the opening sentence on the
       one thing the reader can see. What they cannot see is the arithmetic, so
       the key states that instead: the basis, the seasonal adjustment, and how
       wide the band is. */
    function updateChartNote() {
      var el = document.getElementById('chartNote');
      var p = chartProjection;
      if (!el) return;
      if (!p || p.from > 11 || p.basis === 'none') {
        el.hidden = true;
        el.innerHTML = '';
        return;
      }
      var h = '<b>The rest of the year is an estimate, not tracked time.</b> ' +
        'Each remaining month is set to the average of the months tracked so far';
      h += p.basis === 'prior-year'
        ? ', then adjusted for how that month ran in ' + (YEAR - 1) + '. '
        : '. ';
      if (chartHasTotal && p.spread) {
        h += 'The band around the total line is that estimate give or take ' +
             Math.round(p.spread * 100) + '%, which is how far a tracked month has ' +
             'typically sat from the average. ';
      }
      h += 'The month in progress is still filling up, so it is left out of that ' +
           'average. Estimated months are drawn as outlines, and are never counted ' +
           'in the totals above.';
      el.innerHTML =
        '<span class="key-swatch" aria-hidden="true"></span>' +
        '<p class="key-text">' + h + '</p>';
      el.hidden = false;
    }

    /* The legend's figures are tracked hours only: the projected months are an
       estimate and are never summed into them. */
    function updateLegendTotals() {
      var t = totals();
      document.querySelectorAll('#legend .legend-item').forEach(function (b) {
        var c = CATS[parseInt(b.dataset.i)];
        var v = b.querySelector('.val');
        if (!v) return;
        v.textContent = fmtH(c ? t[c.hours] : t.total);
      });
    }

    /* The chart and the table are two views of one set of months, so pointing at
       a month in either dims every other month in both. The chart side is
       redrawn through the existing ghost colours; the table side is a class,
       so it costs nothing while nothing is hovered. */
    var hoverMonth = null;
    function linkHover(month, source) {
      if (hoverMonth === month) return;
      hoverMonth = month;
      document.querySelectorAll('.table tbody tr.mrow').forEach(function (r) {
        r.classList.toggle('is-dim', month !== null && parseInt(r.dataset.m) !== month);
      });
      var foot = document.querySelector('.table tfoot');
      if (foot) foot.classList.toggle('is-dim', month !== null);
      // A hover that started on the chart has already moved the bars.
      if (source !== 'chart') paintBars();
    }

    /* Re-colours the bars in place. Cheaper than a redraw and keeps the tooltip
       and any running animation intact. */
    function paintBars() {
      if (!chart) return;
      chart.data.datasets.forEach(function (ds, i) {
        if (isTotalSeries(i)) {
          var ghost = hoverMonth !== null || (emphasis !== null && emphasis !== i);
          ds.borderColor = ghost ? GHOST_LINE : totalInk();
          ds.pointBackgroundColor = pointColors();
          ds.pointBorderColor = pointColors();
          return;
        }
        ds.backgroundColor = barColors(i, 'fill');
        ds.borderColor = barColors(i, 'line');
      });
      chart.update('none');
    }
    function pointColors() {
      var ink = totalInk();
      // Isolating the total itself is the one case where these stay lit.
      var ghosted = emphasis !== null && emphasis !== CATS.length;
      return chartRows.map(function (r) {
        if (r.projected) return GHOST_LINE;
        if (ghosted) return GHOST_LINE;
        if (hoverMonth !== null && r.month !== hoverMonth) return GHOST_LINE;
        return ink;
      });
    }

    /* One row per bar group, whatever the view is showing. Everything
       downstream (labels, datasets, flag markers, tooltips) reads this rather
       than reaching into state.range, so a view is a data question and not a
       second rendering path. */
    var chartRows = [];
    function buildRows() {
      var p = projectRest();
      chartProjection = p;
      return state.months.map(function (m) {
        var projected = m.month >= p.from;
        var c = projected ? (p.creative[m.month] || 0) : m.creative;
        var o = projected ? (p.nonCreative[m.month] || 0) : m.nonCreative;
        return { kind: 'month', month: m.month, projected: projected,
                 creative: c, nonCreative: o, total: c + o };
      });
    }
    var chartProjection = null;
    /* The total line, and so the band hanging off it, only exists in the
       vertical layout. The key under the chart reads this so it does not
       describe a band nobody can see. */
    var chartHasTotal = false;

    function rowLabel(r) { return MONTH_ABBR[r.month]; }
    function rowTitle(r) {
      return MONTH_NAMES[r.month] + ' ' + YEAR + (r.projected ? ' · projected' : '');
    }

    function drawChart() {
      var el = document.getElementById('overviewChart');
      if (!el || typeof Chart === 'undefined') return;
      emphasis = null;
      /* Switching views redraws onto the same canvas, which Chart.js refuses
         until the instance holding it is released. */
      if (chart) { chart.destroy(); chart = null; }

      /* Seven months of paired vertical bars on a 390px screen leaves each bar
         about 14px wide, with the figures unreadable and the flag markers
         floating in space. Rotated, every month gets a full row: the bars are
         thick, the month labels are horizontal, and the hours sit at the end of
         each bar. Height grows with the range so bar thickness is constant. */
      chartRows = buildRows();
      var day = view.mode === 'day';
      /* The rotated layout exists so seven fat month rows beat seven hair-thin
         columns on a phone. A month of days is 28 to 31 rows, which would be a
         metre of scrolling, so the day view stays vertical at every width. */
      var horiz = isNarrow() && !day;
      chartHasTotal = !horiz && !day;
      var wrap = el.parentNode;
      // Height of the floating legend, reserved at the top of the plot area so
      // the tallest bar or the total line can never run underneath it.
      var LEGEND_H = window.matchMedia('(max-width: 700px)').matches ? 0 : 78;
      wrap.style.height = horiz ? (chartRows.length * 52 + 26 + LEGEND_H) + 'px' : '';

      /* The widest bar and whether it carries a flag, which together size the
         right-hand gutter the end labels are written into. */
      var peak = 0, peakFlagged = false;
      chartRows.forEach(function (r) {
        CATS.forEach(function (c) {
          if (r[c.hours] > peak) {
            peak = r[c.hours];
            peakFlagged = r.kind === 'month' && !!flagFor(YEAR, r.month, c.key);
          }
        });
      });
      var gutter = Math.ceil(fmtH(peak).length * 8.1) + END_GAP + 12 + (peakFlagged ? FLAG_W : 0);

      /* The value axis is sized from the plotted data, which knows nothing about
         the band drawn around the total line, so its top edge would be clipped
         off. Asked for as a suggestion: real hours still win if they run higher. */
      var bandTop = 0;
      if (chartHasTotal && chartProjection && chartProjection.high) {
        chartRows.forEach(function (r) {
          if (r.projected) bandTop = Math.max(bandTop, chartProjection.high[r.month] || 0);
        });
      }

      /* A bar squared off against nothing reads as cropped rather than as
         finished, so the plot is given a floor: gridlines heavy enough to
         register as ruled lines, and a distinctly stronger one on the axis
         itself for the bars to stand on. */
      var TICK = 'rgba(255,255,255,0.62)', GRID = 'rgba(255,255,255,0.13)';
      var AXIS = 'rgba(255,255,255,0.34)';
      var scales = horiz
        ? {
            /* Value axis: gridlines only, since the numbers are on the bars.
               Pinned to the data rather than rounded up to a nice 150h, which
               on a 354px canvas left a quarter of the width empty. Pinning it
               to every series, not the visible ones, also means hiding a series
               does not silently rescale the bars still on screen. */
            x: { ticks: { display: false }, grid: { color: GRID },
                 border: { display: false }, beginAtZero: true, max: peak || undefined },
            y: { ticks: { font: { size: 13.5, weight: '600' }, color: TICK, padding: 4 },
                 grid: { display: false }, border: { display: true, color: AXIS, width: 1 } }
          }
        : {
            /* A month of days will not carry 31 labels at this width, so the day
               axis thins them out rather than rotating them to fit. */
            x: { ticks: { autoSkip: day, maxTicksLimit: day ? 10 : undefined,
                          maxRotation: 0, font: { size: 13 }, color: TICK },
                 grid: { display: false }, border: { display: true, color: AXIS, width: 1 },
                 stacked: day },
            y: { ticks: { font: { size: 12.5 }, color: 'rgba(255,255,255,0.55)',
                          callback: function (v) { return v + 'h'; }, padding: 6 },
                 grid: { color: GRID }, border: { display: false },
                 beginAtZero: true, grace: '10%', stacked: day,
                 suggestedMax: bandTop || undefined }
          };

      chart = new Chart(el, {
        type: 'bar',
        // projBand after projBoundary: the band sits over the textured ground.
        plugins: [barEndLabels, projBoundary, projBand],
        data: {
          labels: chartRows.map(rowLabel),
          datasets: CATS.map(function (c, i) {
            return {
              label: c.label,
              data: chartRows.map(function (r) { return r[c.hours]; }),
              backgroundColor: barColors(i, 'fill'),
              borderColor: barColors(i, 'line'),
              borderWidth: 1.5,
              borderRadius: 4,
              // Square off the axis end, round the value end.
              borderSkipped: horiz ? 'left' : 'bottom',
              hidden: !!state.hidden[i],
              categoryPercentage: horiz ? 0.74 : (day ? 0.9 : 0.66),
              barPercentage: horiz ? 0.9 : (day ? 0.92 : 0.86),
              borderRadius: day ? 2 : 4,
              stack: day ? 'd' : undefined,
              order: 1
            };
          }).concat(horiz || day ? [] : [totalLineDataset()])
        },
        options: {
          indexAxis: horiz ? 'y' : 'x',
          responsive: true,
          maintainAspectRatio: false,
          // Right gutter holds the end labels; "113h 4m" plus a flag is the
          // widest thing that has to fit beside the longest bar.
          layout: { padding: horiz
            ? { right: gutter, top: LEGEND_H, bottom: 2 }
            : { top: LEGEND_H } },
          /* Desktop gets the note on hover via the tooltip, but a tap on a touch
             device raises no tooltip at all, so a flagged bar is also clickable
             and opens the same modal the flag buttons use. */
          /* A bar is a month, and the thing a reader wants after pointing at one
             is that month's tasks. Clicking one opens its row below and closes
             whichever was open. Projected months have nothing to open. */
          onClick: function (evt, elements) {
            if (!elements.length) return;
            var r = chartRows[elements[0].index];
            // A day belongs to the month being viewed, so it opens the same row.
            if (!r || r.projected) return;
            openMonth(r.month, true);
          },
          onHover: function (evt, elements) {
            var r = elements.length ? chartRows[elements[0].index] : null;
            var live = !!(r && r.kind === 'month' && !r.projected);
            evt.native.target.style.cursor = live ? 'pointer' : 'default';
            // Pointing at a bar dims every month but that one, in both places.
            linkHover(live ? r.month : null, 'chart');
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: 'rgba(12,12,12,0.96)',
              borderColor: 'rgba(255,255,255,0.14)',
              borderWidth: 1,
              padding: 12,
              titleFont: { size: 13, weight: '700' },
              bodyFont: { size: 13 },
              footerFont: { size: 12, weight: '500' },
              footerColor: '#F5C26B',
              displayColors: true,
              boxWidth: 9, boxHeight: 9, boxPadding: 5, usePointStyle: false,
              callbacks: {
                title: function (items) {
                  var r = chartRows[items[0].dataIndex];
                  return r ? rowTitle(r) : '';
                },
                label: function (c) {
                  // The value lives on whichever axis is not the category one.
                  var v = c.chart.options.indexAxis === 'y' ? c.parsed.x : c.parsed.y;
                  var cat = CATS[c.datasetIndex];
                  if (!cat) return ' Total: ' + fmtH(v);
                  var txt = ' ' + cat.label + ': ' + fmtH(v);
                  if (cat.budgeted) txt += '  ·  ' + pctOf(v, BUDGET) + '% of ' + BUDGET + 'h';
                  return txt;
                },
                footer: function (items) {
                  var r = chartRows[items[0].dataIndex];
                  if (r && r.projected) return 'Estimate, not tracked time.';
                  var notes = [];
                  items.forEach(function (it) {
                    if (isTotalSeries(it.datasetIndex)) return;
                    var row = chartRows[it.dataIndex];
                    if (!row || row.kind !== 'month') return;
                    var f = flagFor(YEAR, row.month, CATS[it.datasetIndex].key);
                    if (f && notes.indexOf(f.label) === -1) notes.push(f.label);
                  });
                  return notes.length ? '⚠ ' + notes.join(', ') + '. Select for detail.' : '';
                }
              }
            }
          },
          scales: scales
        }
      });
      if (printing) chartTheme(true);
    }

    /* Crossing the breakpoint changes the chart's whole geometry, which Chart.js
       cannot do in place, so it is rebuilt. Hidden series survive because
       drawChart reads state.hidden. */
    function onBreakpointChange() {
      if (!chart) return;
      chart.destroy();
      chart = null;
      drawChart();
      // The band, and so the sentence describing it, only exists in one layout.
      updateChartNote();
    }
    if (NARROW.addEventListener) NARROW.addEventListener('change', onBreakpointChange);
    else if (NARROW.addListener) NARROW.addListener(onBreakpointChange);

    /* ═══════════════════════════════════════════════════════════════
       Comparison line

       A dense page of hour totals is hard to feel. Each of these turns the
       headline number into something with a shape, and they rotate slowly so
       the page has one small moving part. Every figure is computed from the
       real total, so they stay true as the number grows.
       ═══════════════════════════════════════════════════════════════ */
    /* Two kinds of emphasis, and only two: the figure, which carries the same
       animated gradient as the headline total so the two read as the same kind
       of number, and the subject being compared against, in plain bold. */
    function ffN(s) { return '<span class="ff-n grad num">' + s + '</span>'; }
    function ffS(s) { return '<b class="ff-s">' + s + '</b>'; }

    var FUN_FACTS = [
      { line: function (h) {
        return 'That is ' + ffN(fmt1(h / 24) + ' full days') + ' of ' + ffS('round-the-clock work') + ', without stopping to sleep.'; } },
      { line: function (h) {
        return 'Long enough to watch the extended ' + ffS('Lord of the Rings') + ' trilogy ' + ffN(fmt1(h / 11.4) + ' times') + ' back to back.'; } },
      { line: function (h) {
        return 'The ' + ffS('International Space Station') + ' would circle the Earth ' + ffN(Math.round(h / 1.533) + ' times') + ' in that span.'; } },
      { line: function (h) {
        return 'Enough time to fly ' + ffN(fmt1(h / 7.5) + ' round trips') + ' between ' + ffS('New York and London') + '.'; } },
      { line: function (h) {
        return 'A ' + ffS('three-toed sloth') + ', moving flat out, would cover ' + ffN(fmt1(h * 0.15) + ' miles') + '.'; } },
      { line: function (h) {
        return 'That is ' + ffN(Math.round(h / 1.5) + ' sleep cycles') + ' worth of ' + ffS('sleep') + ', if anyone were getting any.'; } },
      { line: function (h) {
        return ffS('Sunlight') + ' takes 8 minutes 20 seconds to reach us. This is ' + ffN(Math.round(h * 60 / 8.33) + ' of those journeys') + '.'; } },
      { line: function (h) {
        return 'Roughly ' + ffN(Math.round(h / 2.01) + ' marathons') + ' at ' + ffS('world-record pace') + '.'; } },
      { line: function (h) {
        return 'You could listen to every ' + ffS('Beatles') + ' studio album ' + ffN(fmt1(h / 10.2) + ' times') + ' through.'; } },
      // One gradient figure per fact: two of them side by side read as a colour
      // effect rather than as the number carrying the point.
      { line: function (h) {
        return 'About ' + ffN(fmt1(h / 8) + ' standard working days') + ', or ' + fmt1(h / 40) + ' ' + ffS('working weeks') + '.'; } },
      { line: function (h) {
        return 'A ' + ffS('hummingbird') + ' would beat its wings about ' + ffN(Math.round(h * 3600 * 53 / 1e6) + ' million times') + '.'; } },
      { line: function (h) {
        return 'Long enough to put the ' + ffS('kettle') + ' on ' + ffN(Math.round(h * 60 / 4) + ' times') + ', one after another.'; } }
    ];
    function fmt1(n) {
      return (Math.round(n * 10) / 10).toLocaleString(undefined, { maximumFractionDigits: 1 });
    }

    /* Every fact is rendered at once, stacked in a single grid cell, with only
       one visible. The block is therefore always as tall as the longest fact it
       could ever show, at any width, and rotating cannot move anything under
       it. The old approach reserved a height per breakpoint, which had to be
       re-measured whenever the copy or the type size changed. */
    function factStackHtml(totalHours) {
      return '<span class="ff-stack">' + FUN_FACTS.map(function (f, i) {
        return '<span class="ff-line" data-i="' + i + '" data-on="false" aria-hidden="true">' +
          f.line(totalHours) + '</span>';
      }).join('') + '</span>';
    }

    var factTimer = null, factIdx = 0, factOrder = [], factHeld = false;
    var FACT_EVERY = 9000;

    function startFunFacts(totalHours) {
      var lines = document.querySelectorAll('.ff-line');
      if (!lines.length || !(totalHours > 0)) return;

      // Shuffled once per render so a reload does not always open the same way.
      factOrder = FUN_FACTS.map(function (_, i) { return i; });
      for (var i = factOrder.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = factOrder[i]; factOrder[i] = factOrder[j]; factOrder[j] = tmp;
      }
      factIdx = 0;
      showFact(factOrder[0]);
      resumeFacts();

      /* Reading at your own pace beats waiting for the carousel, so the arrows
         step it and any interaction with the panel holds the timer. It restarts
         on the way out, so the line still turns over while the reader is
         somewhere else on the page. */
      var panel = document.querySelector('.funfact');
      if (!panel) return;
      panel.querySelectorAll('[data-fact]').forEach(function (b) {
        b.addEventListener('click', function () { stepFact(parseInt(b.dataset.fact)); });
      });
      ['mouseenter', 'focusin'].forEach(function (e) {
        panel.addEventListener(e, function () { factHeld = true; pauseFacts(); });
      });
      ['mouseleave', 'focusout'].forEach(function (e) {
        panel.addEventListener(e, function () { factHeld = false; resumeFacts(); });
      });
    }

    function pauseFacts() { if (factTimer) { clearInterval(factTimer); factTimer = null; } }
    function resumeFacts() {
      pauseFacts();
      if (factHeld || factOrder.length < 2) return;
      factTimer = setInterval(function () { stepFact(1); }, FACT_EVERY);
    }
    function stepFact(delta) {
      if (!factOrder.length) return;
      factIdx = (factIdx + delta + factOrder.length) % factOrder.length;
      showFact(factOrder[factIdx]);
      // A manual step restarts the clock, so the next one is not cut short.
      if (!factHeld) resumeFacts();
    }

    function showFact(idx) {
      document.querySelectorAll('.ff-line').forEach(function (el) {
        var on = parseInt(el.dataset.i) === idx;
        el.dataset.on = on ? 'true' : 'false';
        // Hidden lines are real text in the DOM, so they are taken out of the
        // accessibility tree rather than left to be read as one long run-on.
        el.setAttribute('aria-hidden', on ? 'false' : 'true');
      });
    }

    /* ═══════════════════════════════════════════════════════════════
       Modal
       ═══════════════════════════════════════════════════════════════ */
    var lastFocus = null;
    function openModal(titleHtml, bodyHtml, hazard) {
      lastFocus = document.activeElement;
      document.querySelector('.modal').classList.toggle('hazard', !!hazard);
      document.getElementById('modalTitle').innerHTML = titleHtml;
      document.getElementById('modalBody').innerHTML = bodyHtml;
      document.getElementById('modalBackdrop').hidden = false;
      document.getElementById('modalClose').focus();
    }
    function closeModal() {
      if (document.getElementById('modalBackdrop').hidden) return;
      document.getElementById('modalBackdrop').hidden = true;
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }
    function openFlagModal(flagId) {
      var flag = null;
      DATA_FLAGS.forEach(function (f) { if (f.id === flagId) flag = f; });
      if (!flag) return;
      openModal(ICONS.alert + esc(flag.label),
        '<p><b>' + esc(monthSpanLabel(flag)) + '</b></p><p>' + esc(flag.detail) + '</p>' +
        '<p>Line items for these months link to ClickUp where a task exists. Some of the ' +
        'missing time was never logged against a task at all, which is part of what we are ' +
        'reconstructing.</p>', true);
    }

    function wireModal() {
      document.getElementById('modalClose').innerHTML = ICONS.close;
      document.getElementById('modalClose').addEventListener('click', closeModal);
      document.getElementById('modalBackdrop').addEventListener('click', function (e) {
        if (e.target === this) closeModal();
      });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
      // Delegated so it covers flag buttons in any re-rendered section. Bound in
      // the capture phase: a flag button inside a summary-table row would
      // otherwise hit the row's own bubble listener first, selecting the month
      // before this handler could stop it.
      document.addEventListener('click', function (e) {
        var btn = e.target.closest ? e.target.closest('.flag-btn') : null;
        if (!btn) return;
        e.preventDefault();
        e.stopPropagation();
        openFlagModal(btn.dataset.flag);
      }, true);
    }

    /* ═══════════════════════════════════════════════════════════════
       Export
       ═══════════════════════════════════════════════════════════════ */
    function csvCell(v) {
      var s = String(v == null ? '' : v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }
    function download(filename, rows) {
      var csv = rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
      var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }
    function stampSuffix() {
      var d = state.generatedAt || new Date();
      return d.toISOString().slice(0, 10);
    }

    function exportSummary() {
      var t = totals(), allow = allowance();
      var rows = [['Month', 'Creative hours', 'Retainer budget (h)', 'Creative % used', 'Other hours (SOW)', 'Total hours', 'Data note']];
      state.range.forEach(function (m) {
        var f = flagFor(YEAR, m.month, 'creative');
        rows.push([MONTH_NAMES[m.month] + ' ' + YEAR, m.creative.toFixed(2), BUDGET,
                   pctOf(m.creative, BUDGET) + '%', m.nonCreative.toFixed(2), m.total.toFixed(2),
                   f ? f.label + ': ' + f.detail : '']);
      });
      rows.push([]);
      rows.push(['Year to date', t.creative.toFixed(2), allow, pctOf(t.creative, allow) + '%',
                 t.nonCreative.toFixed(2), t.total.toFixed(2), '']);
      rows.push([]);
      rows.push(['Generated', (state.generatedAt || new Date()).toISOString(), 'Source', 'ClickUp time tracking']);
      download('moss-hours-' + YEAR + '-summary-' + stampSuffix() + '.csv', rows);
    }

    function exportYear() {
      var t = totals(), allow = allowance(), months = allowanceMonths();
      var rows = [['Moss hours report', YEAR + ' year summary']];
      rows.push([]);
      rows.push(['Period', MONTH_NAMES[state.range[0].month] + ' to ' +
                 MONTH_NAMES[state.range[state.range.length - 1].month] + ' ' + YEAR]);
      rows.push(['Months of retainer', months]);
      rows.push(['Retainer budget (h/month)', BUDGET]);
      rows.push([]);
      rows.push(['Category', 'Hours', 'Available (h)', '% used', 'Share of total']);
      rows.push(['Creative (retainer)', t.creative.toFixed(2), allow, pctOf(t.creative, allow) + '%',
                 (t.total > 0 ? Math.round((t.creative / t.total) * 100) : 0) + '%']);
      rows.push(['Other (SOW / project work)', t.nonCreative.toFixed(2), '', '',
                 (t.total > 0 ? Math.round((t.nonCreative / t.total) * 100) : 0) + '%']);
      rows.push(['Total delivered', t.total.toFixed(2), '', '', '100%']);
      rows.push([]);
      rows.push(['Retainer months consumed', fmtMonths(t.creative / BUDGET) + ' of ' + months]);

      var flags = flagsInRange(YEAR, state.range, 'creative');
      if (flags.length) {
        rows.push([]);
        rows.push(['Data note', flags[0].label + ': ' + monthSpanLabel(flags[0])]);
        rows.push(['', flags[0].detail]);
      }
      rows.push([]);
      rows.push(['Generated', (state.generatedAt || new Date()).toISOString(), 'Source', 'ClickUp time tracking']);
      download('moss-hours-' + YEAR + '-year-summary-' + stampSuffix() + '.csv', rows);
    }

    function exportLineItems() {
      var rows = [['Month', 'Category', 'Task', 'Hours', 'ClickUp link', 'Data note']];
      state.range.forEach(function (m) {
        CATS.forEach(function (c) {
          var f = flagFor(YEAR, m.month, c.key);
          sortItems(m[c.items] || []).forEach(function (t) {
            rows.push([MONTH_NAMES[m.month] + ' ' + YEAR, c.label, t.name, t.hours.toFixed(2),
                       t.url || '', f ? f.label : '']);
          });
        });
      });
      rows.push([]);
      rows.push(['Generated', (state.generatedAt || new Date()).toISOString(), 'Source', 'ClickUp time tracking']);
      download('moss-hours-' + YEAR + '-line-items-' + stampSuffix() + '.csv', rows);
    }

    function wireChrome() {
      document.getElementById('refreshBtn').innerHTML = ICONS.refresh;
      document.getElementById('refreshBtn').addEventListener('click', function () { load(true); });
    }

    /* The export control lives inside the section it exports, which is rebuilt
       on every render, so it is wired per render rather than once at boot. */
    function wireExport() {
      var menu = document.getElementById('exportMenu');
      var btn = document.getElementById('exportBtn');
      if (!menu || !btn) return;
      // The qualifier is what makes this read as "this page, as it stands", so
      // it is only dropped where it will not fit beside the year pills.
      btn.innerHTML = ICONS.download + 'Export<span class="x-long"> this report</span>';
      menu.innerHTML =
        '<div class="menu-label">Download</div>' +
        '<button data-a="year">' + ICONS.download + 'Year summary (CSV)</button>' +
        '<button data-a="summary">' + ICONS.download + 'Monthly summary (CSV)</button>' +
        '<button data-a="items">' + ICONS.download + 'Task line items (CSV)</button>' +
        '<div class="menu-label">Share</div>' +
        '<button data-a="print">' + ICONS.printer + 'Print / Save as PDF</button>';

      function close() { menu.dataset.open = 'false'; btn.setAttribute('aria-expanded', 'false'); }
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var open = menu.dataset.open !== 'true';
        menu.dataset.open = String(open);
        btn.setAttribute('aria-expanded', String(open));
      });
      menu.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        if (b.dataset.a === 'year') exportYear();
        else if (b.dataset.a === 'summary') exportSummary();
        else if (b.dataset.a === 'items') exportLineItems();
        else if (b.dataset.a === 'print') window.print();
        close();
      });
      document.addEventListener('click', close);
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    }

    /* ═══════════════════════════════════════════════════════════════
       Boot
       ═══════════════════════════════════════════════════════════════ */
    wireChrome();
    wireModal();
    renderYears();
    tickClock();
    setInterval(tickClock, 1000);
    window.addEventListener('resize', syncMastheadHeight);
    load();
  </script>
</body>
</html>
