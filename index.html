  <script>
    /* ═══════════════════════════════════════════════════════════════
       Config
       ═══════════════════════════════════════════════════════════════ */
    var API_BASE = new URLSearchParams(location.search).get('api') || '/api/time';
    var CURRENT_YEAR = new Date().getFullYear();
    var YEAR = parseInt(new URLSearchParams(location.search).get('year')) || CURRENT_YEAR;
    var YEAR_OPTIONS = [CURRENT_YEAR, CURRENT_YEAR - 1];
    var BUDGET = 50;

    var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    var MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    // Two categorical series. `fill` is the mark color (brand hue, stepped into
    // the dark-mode lightness band); `ink` is the full-brand value used for
    // strokes, swatches and figures.
    var CATS = [
      { key: 'creative',    label: 'Creative',     budgeted: true,
        fill: '#27AC4B', ink: '#7EF893',                                 // literals: Chart.js canvas
        fillVar: 'var(--creative-fill)', inkVar: 'var(--creative-ink)',  // DOM: re-pointable per media
        tint: 'rgba(126, 248, 147, 0.10)',
        items: 'creativeItems', hours: 'creative' },
      { key: 'nonCreative', label: 'Other', budgeted: false,
        fill: '#9B77D0', ink: '#C6A2FF',
        fillVar: 'var(--noncreative-fill)', inkVar: 'var(--noncreative-ink)',
        tint: 'rgba(198, 162, 255, 0.10)',
        items: 'nonCreativeItems', hours: 'nonCreative' }
    ];

    /* Data-integrity annotations. Each entry flags a (year, months, series)
       slice as not fully trustworthy, and surfaces as: a hatched bar + marker
       on the chart, a note in its tooltip, a labelled tag at the top of the
       month's expanded detail, and a Data note row in the CSV exports. Remove
       an entry once its data is repaired. */
    var DATA_FLAGS = [
      {
        id: 'moss-2026-creative-jan-may',
        year: 2026,
        months: [0, 1, 2, 3, 4],           // Jan–May
        series: 'creative',
        label: 'Under-reported',
        detail: 'Creative hours for January–May 2026 come from a partially corrupt ' +
                'time-tracking export. Actual usage was higher than shown; we are ' +
                'reconstructing the missing entries and will restate these months.'
      }
    ];

    function flagFor(year, monthIdx, seriesKey) {
      for (var i = 0; i < DATA_FLAGS.length; i++) {
        var f = DATA_FLAGS[i];
        if (f.year === year && f.series === seriesKey && f.months.indexOf(monthIdx) !== -1) return f;
      }
      return null;
    }
    function flagsInRange(year, range, seriesKey) {
      var out = [];
      range.forEach(function (m) {
        var f = flagFor(year, m.month, seriesKey);
        if (f && out.indexOf(f) === -1) out.push(f);
      });
      return out;
    }

    var chart = null;
    var state = { months: [], range: [], selected: null, hidden: {}, generatedAt: null,
                  team: [], teamById: {}, contributors: null };

    /* One breakpoint drives every layout decision the script makes: the chart
       orientation and the length of the clock string. It matches the CSS
       breakpoint used for the masthead. */
    var NARROW = window.matchMedia('(max-width: 700px)');
    function isNarrow() { return NARROW.matches; }

    /* ═══════════════════════════════════════════════════════════════
       Formatting helpers
       ═══════════════════════════════════════════════════════════════ */
    function fmtH(h) {
      if (h === null || h === undefined) return '0h';
      var hrs = Math.floor(h), mins = Math.round((h - hrs) * 60);
      if (mins === 60) { hrs += 1; mins = 0; }
      if (hrs === 0 && mins === 0) return '0h';
      if (hrs === 0) return mins + 'm';
      if (mins === 0) return hrs + 'h';
      return hrs + 'h ' + mins + 'm';
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }
    function pctOf(used, budget) { return budget > 0 ? Math.round((used / budget) * 100) : 0; }

    function fmtMonths(n) { return (Math.round(n * 10) / 10).toFixed(1); }
    /* Using the retainer is the point, so 90% is not a warning state. Green
       holds to the cap and only going over turns red. Yellow stays reserved for
       data integrity. */
    function pctColor(pct) { return pct > 100 ? 'var(--over)' : 'var(--ok)'; }

    var ICONS = {
      refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>',
      download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
      printer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>',
      external: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>',
      alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
      info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
      spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3"/></svg>',
      close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
      chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>',
    };

    /* ═══════════════════════════════════════════════════════════════
       Live clock + freshness
       ═══════════════════════════════════════════════════════════════ */
    /* The full stamp is "Thu, Jul 30 at 11:37:12 AM MDT", which on a phone
       wrapped the masthead onto a third row on its own. The compact form drops
       the weekday, seconds and zone: the reader is in that zone, and a ticking
       seconds field is noise at this size. */
    function fmtDateTime(d, compact) {
      return d.toLocaleString(undefined, compact
        ? { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }
        : { weekday: 'short', month: 'short', day: 'numeric',
            hour: 'numeric', minute: '2-digit', second: '2-digit', timeZoneName: 'short' });
    }
    function relTime(d) {
      var s = Math.max(0, Math.round((Date.now() - d.getTime()) / 1000));
      if (s < 10) return 'just now';
      if (s < 60) return s + 's ago';
      if (s < 3600) return Math.round(s / 60) + 'm ago';
      return Math.round(s / 3600) + 'h ago';
    }
    function tickClock() {
      var narrow = isNarrow();
      document.getElementById('clockNow').textContent = fmtDateTime(new Date(), narrow);
      var el = document.getElementById('clockFetched');
      if (state.generatedAt) {
        el.textContent = narrow
          ? 'Updated ' + relTime(state.generatedAt)
          : 'Data updated ' + relTime(state.generatedAt) + ' · ' +
            state.generatedAt.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
      }
      syncMastheadHeight();
    }

    /* Publishes the sticky masthead's real height so scroll-margin-top can keep
       jump targets clear of it. It changes with the breakpoint and with how the
       clock string wraps, so it is measured rather than assumed. */
    var lastMastheadH = -1;
    function syncMastheadHeight() {
      var el = document.querySelector('.masthead');
      if (!el) return;
      var h = Math.round(el.getBoundingClientRect().height);
      if (h === lastMastheadH) return;
      lastMastheadH = h;
      document.documentElement.style.setProperty('--mh', h + 'px');
    }

    /* ═══════════════════════════════════════════════════════════════
       Data shaping
       ═══════════════════════════════════════════════════════════════ */
    function normalize(data) {
      return (data.months || []).map(function (m) {
        return {
          month: m.month,
          creative: m.retainerHours || 0,
          nonCreative: m.sowHours || 0,
          total: (m.retainerHours || 0) + (m.sowHours || 0),
          creativeItems: m.retainerItems || [],
          nonCreativeItems: m.sowItems || [],
          contributorIds: m.contributorIds || []
        };
      });
    }
    function sortItems(items) {
      return items.slice().sort(function (a, b) { return b.hours - a.hours; });
    }
    function totals() {
      var t = { creative: 0, nonCreative: 0, total: 0 };
      state.range.forEach(function (m) {
        t.creative += m.creative; t.nonCreative += m.nonCreative; t.total += m.total;
      });
      return t;
    }
    /* Months of retainer the client has actually paid for, which is not the same
       as the months that happen to carry tracked time: the retainer accrues on
       the 1st whether or not anyone logs hours. For the current year that runs
       from the first tracked month through the month we are in now; for a past
       year it runs through the last month with time on it. */
    function allowanceMonths() {
      var first = state.range[0].month;
      var last = state.range[state.range.length - 1].month;
      if (YEAR === CURRENT_YEAR) last = Math.max(last, new Date().getMonth());
      return last - first + 1;
    }
    function allowance() { return BUDGET * allowanceMonths(); }

    /* ═══════════════════════════════════════════════════════════════
       Load
       ═══════════════════════════════════════════════════════════════ */
    function renderYears() {
      var el = document.getElementById('years');
      el.innerHTML = YEAR_OPTIONS.map(function (y) {
        return '<button class="pill" data-y="' + y + '" aria-pressed="' + (y === YEAR) + '">' + y + '</button>';
      }).join('');
      el.querySelectorAll('button').forEach(function (b) {
        b.addEventListener('click', function () {
          if (YEAR === parseInt(b.dataset.y)) return;
          YEAR = parseInt(b.dataset.y);
          renderYears();
          load();
        });
      });
    }

    function load(manual) {
      var content = document.getElementById('content');
      var btn = document.getElementById('refreshBtn');
      btn.setAttribute('aria-busy', 'true');
      if (!manual) content.innerHTML = '<div class="state"><div class="spinner"></div>Loading ' + YEAR + ' hours…</div>';
      document.getElementById('range').textContent = '';
      if (chart) { chart.destroy(); chart = null; }

      // Cache-bust so the refresh button is a genuine round trip to ClickUp.
      var url = API_BASE + '?year=' + YEAR + '&_=' + Date.now();
      fetch(url, { cache: 'no-store' })
        .then(function (r) {
          return r.text().then(function (t) {
            if (!r.ok) throw new Error('API ' + r.status + ': ' + t.slice(0, 200));
            return JSON.parse(t);
          });
        })
        .then(render)
        .catch(function (e) {
          content.innerHTML = '<div class="state err">Couldn’t load data.<code>' + esc(e.message) + '</code>' +
            '<div style="margin-top:12px;color:var(--dim);">Confirm <b>CLICKUP_TOKEN</b> is set in Vercel and the API is reachable at <code>' + esc(API_BASE) + '</code>.</div></div>';
        })
        .then(function () { btn.removeAttribute('aria-busy'); });
    }

    /* ═══════════════════════════════════════════════════════════════
       Render
       ═══════════════════════════════════════════════════════════════ */
    function render(data) {
      BUDGET = data.retainerBudget || 50;
      state.generatedAt = data.generatedAt ? new Date(data.generatedAt) : new Date();
      state.months = normalize(data);
      state.team = data.team || [];
      state.contributors = data.contributors || null;
      // The studio entry is skipped rather than stored: its mark is not shown.
      state.teamById = {};
      state.team.forEach(function (p) { if (!p.isStudio) state.teamById[p.id] = p; });

      var active = [];
      state.months.forEach(function (m) { if (m.total > 0) active.push(m.month); });

      var content = document.getElementById('content');
      if (!active.length) {
        document.getElementById('range').textContent = YEAR;
        content.innerHTML = '<div class="state">No tracked hours for ' + YEAR + ' yet.</div>';
        tickClock();
        return;
      }

      var first = active[0], last = active[active.length - 1];
      state.range = state.months.slice(first, last + 1);
      if (state.selected === null || state.selected < first || state.selected > last) state.selected = last;

      document.getElementById('range').textContent =
        MONTH_NAMES[first] + ' – ' + MONTH_NAMES[last] + ' ' + YEAR + ' · ' + state.range.length +
        (state.range.length === 1 ? ' month' : ' months') + ' of tracked time';

      // The table is part of the overview section now, not a section of its own.
      content.innerHTML = heroHtml() + overviewHtml();

      wireLegend();
      wireSummaryTable();
      wireAvatarFallbacks();
      drawChart();
      startFunFacts(totals().total);
      tickClock();
    }

    /* ── Year-to-date hero ──────────────────────────────────────── */
    function heroHtml() {
      var t = totals();
      var months = allowanceMonths();

      var h = '<section class="sec"><div class="hero">';
      h += '<div class="hero-top">';
      h += '<div class="hero-total"><div class="eyebrow">Total hours delivered · ' + YEAR + '</div>' +
           '<div class="v num">' + fmtH(t.total) + '</div>' +
           '<div class="hero-ctx"><strong>Year to date</strong> · ' +
           months + ' ' + (months === 1 ? 'month' : 'months') + '</div></div>';
      h += '<div class="funfact"><div class="eyebrow">For scale</div>' +
           '<div class="ff-body"><span class="ff-icon">' + ICONS.spark + '</span>' +
           '<span class="ff-text" id="funfact"></span></div></div>';
      h += '</div>';

      /* This space has held the two summary meters and then the team roster.
         Both were repeats of what is charted below. The one thing the reader
         cannot get anywhere else is what the two colours mean and what the
         Creative series is measured against, so that is what sits here. */
      h += '<div class="split">' + defsHtml() + '</div>';

      h += '</div></section>';
      return h;
    }

    /* The two series, named and explained once, where the reader first meets
       them. Also the only place the retainer terms are stated. */
    function defsHtml() {
      var h = '';
      var c = state.contributors;
      if (c && c.contributing === 1 && c.queried > 1) {
        h += '<p class="data-alarm">' + ICONS.alert +
             'Only one account reporting: check data source</p>';
      }
      h += '<div class="defs">';
      h += '<div class="def"><span class="swatch" style="background:' + CATS[0].inkVar + '"></span>' +
           '<div class="def-body"><div class="def-name">' + CATS[0].label +
           '<span class="def-terms">' + BUDGET + 'h per month</span></div>' +
           '<p class="def-text">Retainer work, drawn against your monthly allowance. Every percentage ' +
           'in this report is the share of that allowance used.</p></div></div>';
      h += '<div class="def"><span class="swatch" style="background:' + CATS[1].inkVar + '"></span>' +
           '<div class="def-body"><div class="def-name">' + CATS[1].label + '</div>' +
           '<p class="def-text">Project work, scoped and billed separately. It sits outside the ' +
           'retainer and does not draw against it.</p></div></div>';
      h += '</div>';
      return h;
    }

    function monthSpanLabel(flag) {
      var ms = flag.months.slice().sort(function (a, b) { return a - b; });
      var label = ms.length > 1 ? MONTH_ABBR[ms[0]] + '–' + MONTH_ABBR[ms[ms.length - 1]] : MONTH_ABBR[ms[0]];
      return label + ' ' + flag.year + ' Creative';
    }
    /* A compact affordance that opens the shared modal. Same behaviour on
       desktop and touch, so there is no hover-only information. */
    function flagBtnHtml(flag, labelled) {
      return '<button type="button" class="flag-btn' + (labelled ? ' labelled' : '') +
        '" data-flag="' + esc(flag.id) + '" aria-label="' + esc(flag.label) + ', read the data note">' +
        ICONS.alert + (labelled ? esc(flag.label) : '') + '</button>';
    }

    /* ── Monthly contributors ───────────────────────────────────────
       Built from the team the API resolved through roster.js, so it shows who
       actually worked a month rather than a static brochure list. Names, titles
       and images never come from ClickUp.

       The studio mark is deliberately not rendered: as an avatar among faces it
       read as a person nobody could name. Unrostered ids are simply not shown,
       which is also why nothing here claims to be a count of the team. */
    function stackFor(ids) {
      var out = [];
      (ids || []).forEach(function (id) {
        var p = state.teamById[id];
        if (p) out.push({ img: p.stack, name: p.name, title: p.title });
      });
      return out;
    }

    function stackHtml(ids) {
      var people = stackFor(ids);
      if (!people.length) return '';
      var shown = people.slice(0, 6), extra = people.length - shown.length;
      var h = '<div class="stack-wrap"><div class="stack">';
      shown.forEach(function (p) {
        // The roster's job titles left the page with the roster; they come back
        // here, where the face is the thing that raises the question.
        var label = p.name + (p.title ? ' · ' + p.title : '');
        h += '<img src="' + esc(p.img) + '" alt="' + esc(label) + '" title="' + esc(label) + '" ' +
             'width="48" height="48" loading="lazy" data-fallback="1">';
      });
      if (extra > 0) h += '<span class="av-more" title="' + extra + ' more">+' + extra + '</span>';
      h += '</div><span class="stack-label">Your team this month</span></div>';
      return h;
    }

    /* A missing file used to fall back to the studio mark, which is exactly the
       artwork we no longer show. An avatar that cannot load is dropped instead:
       the name is already on the tooltip of the ones that did. */
    function wireAvatarFallbacks() {
      document.querySelectorAll('img[data-fallback]').forEach(function (img) {
        img.addEventListener('error', function () { img.style.display = 'none'; });
      });
    }

    /* ── Monthly overview ────────────────────────────────────────────
       The chart and the table are one section under one heading: the same year
       drawn, then written out, with each month's task detail folded into its
       own row. Two headings made them read as two separate exhibits. */
    function overviewHtml() {
      var t = totals();
      var h = '<section class="sec"><div class="sec-head">' +
        '<h2 class="sec-title">Monthly overview</h2></div>';
      h += '<div class="chart-wrap"><canvas id="overviewChart" role="img" ' +
        'aria-label="Grouped bar chart of Creative and Other hours by month, with a total hours line"></canvas>';
      h += '<div class="legend" id="legend">';
      CATS.forEach(function (c, i) {
        h += '<button class="legend-item" data-i="' + i + '" data-off="false" aria-pressed="true">' +
          '<span class="lg-name"><span class="swatch" style="background:' + c.inkVar + '"></span>' + c.label + '</span>' +
          '<span class="val">' + fmtH(t[c.hours]) + '</span></button>';
      });
      h += '</div></div>';
      h += summaryHtml();
      h += '</section>';
      return h;
    }

    /* ── Monthly summary table, with the task detail as a per-month
       accordion so a month's figures and its tasks read as one thing ── */
    function summaryHtml() {
      var t = totals(), ytdPct = pctOf(t.creative, allowance());

      var h = '<div class="table-scroll"><table class="table"><thead><tr>' +
        '<th>Month</th>' +
        '<th class="r">Creative</th>' +
        '<th class="r col-gap">' + CATS[1].label + '</th>' +
        '<th class="r col-total">Total</th>' +
        '</tr></thead><tbody>';

      state.range.forEach(function (m) {
        var pct = pctOf(m.creative, BUDGET);
        var open = m.month === state.selected;
        h += '<tr class="mrow" data-m="' + m.month + '" tabindex="0" aria-expanded="' + open +
             '" aria-controls="acc-' + m.month + '">';
        // The data flag used to sit beside the month name here as well. It is
        // stated in full when the row opens, which is both stronger and only
        // one place.
        h += '<td><span class="mo"><span class="caret" aria-hidden="true">' + ICONS.chevron + '</span>' +
             '<span class="mo-full">' + MONTH_NAMES[m.month] + '</span>' +
             '<span class="mo-abbr">' + MONTH_ABBR[m.month] + '</span></span></td>';
        // Each figure carries its series colour, so a row's numbers and the
        // colour-coded task lists it opens onto are read as the same thing.
        h += '<td class="r num"><span style="color:' + CATS[0].inkVar + ';font-weight:600">' + fmtH(m.creative) + '</span>' +
             '<span class="use" style="color:' + pctColor(pct) + '">' + pct + '%</span></td>';
        h += '<td class="r num col-gap" style="color:' + CATS[1].inkVar + '">' + fmtH(m.nonCreative) + '</td>';
        h += '<td class="r num primary col-total">' + fmtH(m.total) + '</td>';
        h += '</tr>';
        h += '<tr class="acc" id="acc-' + m.month + '" data-m="' + m.month + '"' + (open ? '' : ' hidden') +
             '><td colspan="4"><div class="acc-inner">' + monthDetailHtml(m) + '</div></td></tr>';
      });

      h += '</tbody><tfoot><tr>';
      h += '<td><span class="mo-full">Year to date</span><span class="mo-abbr">Total</span></td>';
      h += '<td class="r num" style="color:' + CATS[0].inkVar + '">' + fmtH(t.creative) +
           '<span class="use" style="color:' + pctColor(ytdPct) + '">' + ytdPct + '%</span></td>';
      h += '<td class="r num col-gap" style="color:' + CATS[1].inkVar + '">' + fmtH(t.nonCreative) + '</td>';
      h += '<td class="r num col-total">' + fmtH(t.total) + '</td>';
      h += '</tr></tfoot></table></div>';
      return h;
    }

    /* One month at a time: opening a row closes whichever was open, and
       selecting the open month closes it again. */
    function toggleMonth(monthIdx) {
      state.selected = state.selected === monthIdx ? null : monthIdx;
      document.querySelectorAll('.table tbody tr.mrow').forEach(function (r) {
        r.setAttribute('aria-expanded', parseInt(r.dataset.m) === state.selected);
      });
      document.querySelectorAll('.table tbody tr.acc').forEach(function (r) {
        r.hidden = parseInt(r.dataset.m) !== state.selected;
      });
      if (state.selected === null) return;
      var row = document.querySelector('.table tbody tr.mrow[data-m="' + state.selected + '"]');
      // 'nearest' so a row already on screen does not jump under the reader.
      if (row) row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function wireSummaryTable() {
      document.querySelectorAll('.table tbody tr.mrow').forEach(function (r) {
        // A flag button inside the row is handled in the capture phase by
        // wireModal, which stops the event before it reaches this listener.
        r.addEventListener('click', function () { toggleMonth(parseInt(r.dataset.m)); });
        r.addEventListener('keydown', function (e) {
          // Only the row itself: Enter on the flag button it contains belongs
          // to the button.
          if (e.target !== r) return;
          if (e.key !== 'Enter' && e.key !== ' ') return;
          e.preventDefault();
          toggleMonth(parseInt(r.dataset.m));
        });
      });
    }

    /* What the row itself cannot show: where the hours went, and who worked
       them. The month, its total and its Creative / Other split are all in the
       row this hangs from, so none of them are repeated here. */
    function monthDetailHtml(m) {
      var monthFlag = flagFor(YEAR, m.month, 'creative') || flagFor(YEAR, m.month, 'nonCreative');
      var h = '';
      if (monthFlag) h += '<div class="acc-flag">' + flagBtnHtml(monthFlag, true) + '</div>';

      var stack = stackHtml(m.contributorIds);
      if (stack) h += '<div style="margin:0 0 6px">' + stack + '</div>';

      h += '<div class="cat-grid">';
      CATS.forEach(function (c) {
        var items = m[c.items] || [];
        h += '<div class="cat">';
        h += '<div class="cat-head"><span class="srow-label">' +
             '<span class="swatch" style="background:' + c.inkVar + '"></span>' + c.label + '</span></div>';
        h += taskRows(items, c) || '<p class="empty-note">No ' + c.label.toLowerCase() + ' time tracked this month.</p>';
        h += '</div>';
      });
      h += '</div>';

      h += '<p class="acc-note">Sorted by most hours. Links open the ClickUp task where one exists.</p>';
      return h;
    }

    function taskRows(items, cat) {
      if (!items || !items.length) return '';
      var max = items.reduce(function (a, t) { return Math.max(a, t.hours); }, 0);
      return '<div style="margin-top:6px">' + sortItems(items).map(function (t) {
        var w = max > 0 ? Math.round((t.hours / max) * 100) : 0;
        // Short tasks arrive rolled up into one row so the lines still sum to
        // the header; show how many were folded in.
        var name = t.aggregated
          ? t.name + ' (' + t.count + (t.count === 1 ? ' task' : ' tasks') + ')'
          : t.name;
        var link = t.url
          ? '<a class="link" href="' + esc(t.url) + '" target="_blank" rel="noopener" title="Open “' + esc(t.name) + '” in ClickUp" aria-label="Open ' + esc(t.name) + ' in ClickUp">' + ICONS.external + '</a>'
          : '<span class="link placeholder" title="No ClickUp link available" aria-hidden="true">' + ICONS.external + '</span>';
        return '<div class="row">' +
          '<span class="name" title="' + esc(name) + '">' + esc(name) + '</span>' +
          '<span class="track"><span class="fill" style="width:' + w + '%;background:' + cat.fillVar + '"></span></span>' +
          '<span class="hrs">' + fmtH(t.hours) + '</span>' +
          link +
        '</div>';
      }).join('') + '</div>';
    }

    /* ═══════════════════════════════════════════════════════════════
       Chart: grouped bars, hatched where data is flagged
       ═══════════════════════════════════════════════════════════════ */
    var patternCache = {};
    function hatch(color) {
      if (patternCache[color]) return patternCache[color];
      var c = document.createElement('canvas');
      c.width = c.height = 8;
      var g = c.getContext('2d');
      g.fillStyle = color; g.fillRect(0, 0, 8, 8);
      g.strokeStyle = 'rgba(255,255,255,0.42)'; g.lineWidth = 2;
      g.beginPath();
      g.moveTo(-2, 10); g.lineTo(10, -2);
      g.moveTo(2, 14); g.lineTo(14, 2);
      g.moveTo(-6, 6); g.lineTo(6, -6);
      g.stroke();
      patternCache[color] = g.createPattern(c, 'repeat');
      return patternCache[color];
    }

    // emphasis: index of the isolated series, or null for "show everything".
    var emphasis = null;
    var GHOST = 'rgba(255,255,255,0.06)';
    var GHOST_LINE = 'rgba(255,255,255,0.14)';

    /* The total overlay is the one series that is not a category, so it is
       drawn in neutral ink rather than competing with Creative or Other. */
    function totalInk() { return printing ? '#444444' : 'rgba(255,255,255,0.78)'; }
    function isTotalSeries(i) { return !CATS[i]; }

    function barColors(catIdx, which) {
      var c = CATS[catIdx];
      var ghosted = emphasis !== null && emphasis !== catIdx;
      return state.range.map(function (m) {
        if (ghosted) return which === 'fill' ? GHOST : GHOST_LINE;
        var flagged = !!flagFor(YEAR, m.month, c.key);
        if (which === 'fill') return flagged ? hatch(c.fill) : c.fill;
        return c.ink;
      });
    }

    function applyEmphasis(next) {
      emphasis = next;
      if (!chart) return;
      chart.data.datasets.forEach(function (ds, i) {
        if (isTotalSeries(i)) {
          // Isolating a category means isolating it from the total as well.
          var ink = emphasis === null ? totalInk() : GHOST_LINE;
          ds.borderColor = ink;
          ds.pointBackgroundColor = ink;
          ds.pointBorderColor = ink;
          return;
        }
        ds.backgroundColor = barColors(i, 'fill');
        ds.borderColor = barColors(i, 'line');
      });
      chart.update('none');
    }

    function wireLegend() {
      document.querySelectorAll('#legend .legend-item').forEach(function (b) {
        var i = parseInt(b.dataset.i);
        b.addEventListener('mouseenter', function () { if (!state.hidden[i]) applyEmphasis(i); });
        b.addEventListener('focus', function () { if (!state.hidden[i]) applyEmphasis(i); });
        b.addEventListener('mouseleave', function () { applyEmphasis(null); });
        b.addEventListener('blur', function () { applyEmphasis(null); });
        b.addEventListener('click', function () {
          state.hidden[i] = !state.hidden[i];
          b.dataset.off = state.hidden[i] ? 'true' : 'false';
          b.setAttribute('aria-pressed', String(!state.hidden[i]));
          if (chart) { chart.setDatasetVisibility(i, !state.hidden[i]); chart.update(); }
          applyEmphasis(null);
        });
      });
    }

    /* The chart is drawn to a canvas, so the print stylesheet can't reach its
       axis text, gridlines or markers, so re-theme it around the print events. */
    var printing = false;
    function chartTheme(isPrint) {
      printing = isPrint;
      if (!chart) return;
      var s = chart.options.scales;
      // Which axis carries the months flips with the orientation.
      var horiz = chart.options.indexAxis === 'y';
      var cat = horiz ? s.y : s.x, val = horiz ? s.x : s.y;
      cat.ticks.color = isPrint ? 'rgba(0,0,0,0.62)' : 'rgba(255,255,255,0.62)';
      val.ticks.color = isPrint ? 'rgba(0,0,0,0.55)' : 'rgba(255,255,255,0.55)';
      val.grid.color = isPrint ? 'rgba(0,0,0,0.16)' : 'rgba(255,255,255,0.13)';
      // The floor the bars stand on, which is on the category axis.
      cat.border.color = isPrint ? 'rgba(0,0,0,0.42)' : 'rgba(255,255,255,0.34)';
      chart.data.datasets.forEach(function (ds, i) {
        if (!isTotalSeries(i)) return;
        ds.borderColor = ds.pointBackgroundColor = ds.pointBorderColor = totalInk();
      });
      chart.update('none');
    }
    window.addEventListener('beforeprint', function () { chartTheme(true); });
    window.addEventListener('afterprint', function () { chartTheme(false); });

    /* The same warning triangle as ICONS.alert, drawn onto the canvas so the
       chart marker matches the flag buttons elsewhere. Path2D
       takes the icon's own path data; a plain triangle stands in if the browser
       cannot parse it. */
    var ALERT_PATH = 'M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z';
    var alertPath2D = null;
    try { alertPath2D = new Path2D(ALERT_PATH); } catch (e) { alertPath2D = null; }

    function drawWarnIcon(g, cx, cy, size, color) {
      g.save();
      g.translate(cx - size / 2, cy - size / 2);
      g.scale(size / 24, size / 24);
      g.strokeStyle = color;
      g.lineWidth = 2.2;
      g.lineJoin = 'round';
      g.lineCap = 'round';
      if (alertPath2D) {
        g.stroke(alertPath2D);
      } else {
        g.beginPath();
        g.moveTo(12, 3); g.lineTo(22.5, 21); g.lineTo(1.5, 21); g.closePath();
        g.stroke();
      }
      g.beginPath(); g.moveTo(12, 9); g.lineTo(12, 13.5); g.stroke();
      g.beginPath(); g.moveTo(12, 17); g.lineTo(12.01, 17); g.stroke();
      g.restore();
    }

    // Marks flagged bars with the warning icon above the column. Vertical
    // layout only: horizontal puts the same marker inline with the end label.
    var flagMarkers = {
      id: 'flagMarkers',
      afterDatasetsDraw: function (c) {
        if (c.options.indexAxis === 'y') return;
        var g = c.ctx;
        c.data.datasets.forEach(function (ds, di) {
          if (isTotalSeries(di) || !c.isDatasetVisible(di)) return;
          if (emphasis !== null && emphasis !== di) return;
          var meta = c.getDatasetMeta(di);
          meta.data.forEach(function (bar, bi) {
            var m = state.range[bi];
            if (!m || !flagFor(YEAR, m.month, CATS[di].key)) return;
            drawWarnIcon(g, bar.x, bar.y - 11, 15, printing ? '#9A6512' : '#F5C26B');
          });
        });
      }
    };

    /* Horizontal only. A phone has no room for a value axis worth reading, so
       the hours are written at the end of each bar instead, in the series
       colour, with the data flag (where there is one) leading them. That also
       gives a touch reader the figure a hover tooltip would have given. */
    var END_GAP = 9, FLAG_W = 20;
    var barEndLabels = {
      id: 'barEndLabels',
      afterDatasetsDraw: function (c) {
        if (c.options.indexAxis !== 'y') return;
        var g = c.ctx;
        var font = getComputedStyle(document.body).fontFamily;
        c.data.datasets.forEach(function (ds, di) {
          if (isTotalSeries(di) || !c.isDatasetVisible(di)) return;
          var ghosted = emphasis !== null && emphasis !== di;
          var meta = c.getDatasetMeta(di);
          meta.data.forEach(function (bar, bi) {
            var m = state.range[bi];
            if (!m) return;
            var x = bar.x + END_GAP;
            if (flagFor(YEAR, m.month, CATS[di].key)) {
              drawWarnIcon(g, x + 7, bar.y, 14,
                ghosted ? GHOST_LINE : (printing ? '#9A6512' : '#F5C26B'));
              x += FLAG_W;
            }
            g.save();
            g.font = '600 12.5px ' + font;
            g.textAlign = 'left';
            g.textBaseline = 'middle';
            g.fillStyle = ghosted ? GHOST_LINE : (printing ? '#333333' : CATS[di].ink);
            g.fillText(fmtH(ds.data[bi]), x, bar.y);
            g.restore();
          });
        });
      }
    };

    /* Total hours per month, drawn over the paired bars so the shape of the
       month-to-month workload reads without adding the two bars up by eye.
       Vertical layout only: the horizontal one pins its value axis to the
       largest single bar, and a line of totals would run off the end of it. */
    function totalLineDataset() {
      var ink = totalInk();
      return {
        type: 'line',
        label: 'Total',
        data: state.range.map(function (m) { return m.total; }),
        borderColor: ink,
        backgroundColor: 'transparent',
        borderWidth: 2,
        borderDash: [5, 4],
        tension: 0.32,
        pointRadius: 3.5,
        pointHoverRadius: 6,
        pointBackgroundColor: ink,
        pointBorderColor: ink,
        fill: false,
        // Lower order draws on top of the bars.
        order: 0
      };
    }

    function drawChart() {
      var el = document.getElementById('overviewChart');
      if (!el || typeof Chart === 'undefined') return;
      emphasis = null;

      /* Seven months of paired vertical bars on a 390px screen leaves each bar
         about 14px wide, with the figures unreadable and the flag markers
         floating in space. Rotated, every month gets a full row: the bars are
         thick, the month labels are horizontal, and the hours sit at the end of
         each bar. Height grows with the range so bar thickness is constant. */
      var horiz = isNarrow();
      var wrap = el.parentNode;
      // Height of the floating legend, reserved at the top of the plot area so
      // the tallest bar or the total line can never run underneath it.
      var LEGEND_H = 78;
      wrap.style.height = horiz ? (state.range.length * 62 + 30 + LEGEND_H) + 'px' : '';

      /* The widest bar and whether it carries a flag, which together size the
         right-hand gutter the end labels are written into. */
      var peak = 0, peakFlagged = false;
      state.range.forEach(function (m) {
        CATS.forEach(function (c) {
          if (m[c.hours] > peak) { peak = m[c.hours]; peakFlagged = !!flagFor(YEAR, m.month, c.key); }
        });
      });
      var gutter = Math.ceil(fmtH(peak).length * 7.4) + END_GAP + 10 + (peakFlagged ? FLAG_W : 0);

      /* A bar squared off against nothing reads as cropped rather than as
         finished, so the plot is given a floor: gridlines heavy enough to
         register as ruled lines, and a distinctly stronger one on the axis
         itself for the bars to stand on. */
      var TICK = 'rgba(255,255,255,0.62)', GRID = 'rgba(255,255,255,0.13)';
      var AXIS = 'rgba(255,255,255,0.34)';
      var scales = horiz
        ? {
            /* Value axis: gridlines only, since the numbers are on the bars.
               Pinned to the data rather than rounded up to a nice 150h, which
               on a 354px canvas left a quarter of the width empty. Pinning it
               to every series, not the visible ones, also means hiding a series
               does not silently rescale the bars still on screen. */
            x: { ticks: { display: false }, grid: { color: GRID },
                 border: { display: false }, beginAtZero: true, max: peak || undefined },
            y: { ticks: { font: { size: 13.5, weight: '600' }, color: TICK, padding: 4 },
                 grid: { display: false }, border: { display: true, color: AXIS, width: 1 } }
          }
        : {
            x: { ticks: { autoSkip: false, maxRotation: 0, font: { size: 13 }, color: TICK },
                 grid: { display: false }, border: { display: true, color: AXIS, width: 1 } },
            y: { ticks: { font: { size: 12.5 }, color: 'rgba(255,255,255,0.55)',
                          callback: function (v) { return v + 'h'; }, padding: 6 },
                 grid: { color: GRID }, border: { display: false },
                 beginAtZero: true, grace: '10%' }
          };

      chart = new Chart(el, {
        type: 'bar',
        plugins: [flagMarkers, barEndLabels],
        data: {
          labels: state.range.map(function (m) { return MONTH_ABBR[m.month]; }),
          datasets: CATS.map(function (c, i) {
            return {
              label: c.label,
              data: state.range.map(function (m) { return m[c.hours]; }),
              backgroundColor: barColors(i, 'fill'),
              borderColor: barColors(i, 'line'),
              borderWidth: 1.5,
              borderRadius: 4,
              // Square off the axis end, round the value end.
              borderSkipped: horiz ? 'left' : 'bottom',
              hidden: !!state.hidden[i],
              categoryPercentage: horiz ? 0.74 : 0.66,
              barPercentage: horiz ? 0.9 : 0.86,
              order: 1
            };
          }).concat(horiz ? [] : [totalLineDataset()])
        },
        options: {
          indexAxis: horiz ? 'y' : 'x',
          responsive: true,
          maintainAspectRatio: false,
          // Right gutter holds the end labels; "113h 4m" plus a flag is the
          // widest thing that has to fit beside the longest bar.
          layout: { padding: horiz
            ? { right: gutter, top: LEGEND_H, bottom: 2 }
            : { top: LEGEND_H } },
          /* Desktop gets the note on hover via the tooltip, but a tap on a touch
             device raises no tooltip at all, so a flagged bar is also clickable
             and opens the same modal the flag buttons use. */
          onClick: function (evt, elements) {
            if (!elements.length) return;
            var el = elements[0];
            var m = state.range[el.index];
            if (!m || isTotalSeries(el.datasetIndex)) return;
            var f = flagFor(YEAR, m.month, CATS[el.datasetIndex].key);
            if (f) openFlagModal(f.id);
          },
          onHover: function (evt, elements) {
            var over = elements.length && (function () {
              var e = elements[0], m = state.range[e.index];
              return m && !isTotalSeries(e.datasetIndex) && flagFor(YEAR, m.month, CATS[e.datasetIndex].key);
            })();
            evt.native.target.style.cursor = over ? 'pointer' : 'default';
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: 'rgba(12,12,12,0.96)',
              borderColor: 'rgba(255,255,255,0.14)',
              borderWidth: 1,
              padding: 12,
              titleFont: { size: 13, weight: '700' },
              bodyFont: { size: 13 },
              footerFont: { size: 12, weight: '500' },
              footerColor: '#F5C26B',
              displayColors: true,
              boxWidth: 9, boxHeight: 9, boxPadding: 5, usePointStyle: false,
              callbacks: {
                title: function (items) {
                  var m = state.range[items[0].dataIndex];
                  return MONTH_NAMES[m.month] + ' ' + YEAR;
                },
                label: function (c) {
                  // The value lives on whichever axis is not the category one.
                  var v = c.chart.options.indexAxis === 'y' ? c.parsed.x : c.parsed.y;
                  var cat = CATS[c.datasetIndex];
                  if (!cat) return ' Total: ' + fmtH(v);
                  var txt = ' ' + cat.label + ': ' + fmtH(v);
                  if (cat.budgeted) txt += '  ·  ' + pctOf(v, BUDGET) + '% of ' + BUDGET + 'h';
                  return txt;
                },
                footer: function (items) {
                  var notes = [];
                  items.forEach(function (it) {
                    if (isTotalSeries(it.datasetIndex)) return;
                    var m = state.range[it.dataIndex];
                    var f = flagFor(YEAR, m.month, CATS[it.datasetIndex].key);
                    if (f && notes.indexOf(f.label) === -1) notes.push(f.label);
                  });
                  return notes.length ? '⚠ ' + notes.join(', ') + '. Select for detail.' : '';
                }
              }
            }
          },
          scales: scales
        }
      });
      if (printing) chartTheme(true);
    }

    /* Crossing the breakpoint changes the chart's whole geometry, which Chart.js
       cannot do in place, so it is rebuilt. Hidden series survive because
       drawChart reads state.hidden. */
    function onBreakpointChange() {
      if (!chart) return;
      chart.destroy();
      chart = null;
      drawChart();
    }
    if (NARROW.addEventListener) NARROW.addEventListener('change', onBreakpointChange);
    else if (NARROW.addListener) NARROW.addListener(onBreakpointChange);

    /* ═══════════════════════════════════════════════════════════════
       Comparison line

       A dense page of hour totals is hard to feel. Each of these turns the
       headline number into something with a shape, and they rotate slowly so
       the page has one small moving part. Every figure is computed from the
       real total, so they stay true as the number grows.
       ═══════════════════════════════════════════════════════════════ */
    var FUN_FACTS = [
      function (h) {
        return 'That is <b>' + fmt1(h / 24) + ' full days</b> of round-the-clock work, without stopping to sleep.';
      },
      function (h) {
        return 'Long enough to watch the extended Lord of the Rings trilogy <b>' + fmt1(h / 11.4) + ' times</b> back to back.';
      },
      function (h) {
        return 'The International Space Station would circle the Earth <b>' + Math.round(h / 1.533) + ' times</b> in that span.';
      },
      function (h) {
        return 'Enough time to fly <b>' + fmt1(h / 7.5) + ' round trips</b> between New York and London.';
      },
      function (h) {
        return 'A three-toed sloth, moving flat out, would cover <b>' + fmt1(h * 0.15) + ' miles</b>.';
      },
      function (h) {
        return 'That is <b>' + Math.round(h / 1.5) + ' sleep cycles</b>, if anyone were getting any.';
      },
      function (h) {
        return 'Sunlight takes 8 minutes 20 seconds to reach us. This is <b>' + Math.round(h * 60 / 8.33) + ' of those journeys</b>.';
      },
      function (h) {
        return 'Roughly <b>' + Math.round(h / 2.01) + ' marathons</b> at world-record pace.';
      },
      function (h) {
        return 'You could listen to every Beatles studio album <b>' + fmt1(h / 10.2) + ' times</b> through.';
      },
      function (h) {
        return 'About <b>' + fmt1(h / 8) + ' standard working days</b>, or ' + fmt1(h / 40) + ' working weeks.';
      },
      function (h) {
        return 'A hummingbird would beat its wings about <b>' + Math.round(h * 3600 * 53 / 1e6) + ' million times</b>.';
      },
      function (h) {
        return 'Long enough to boil <b>' + Math.round(h * 60 / 4) + ' kettles</b>, one after another.';
      }
    ];
    function fmt1(n) {
      return (Math.round(n * 10) / 10).toLocaleString(undefined, { maximumFractionDigits: 1 });
    }

    var factTimer = null, factIdx = 0, factOrder = [];
    function startFunFacts(totalHours) {
      var el = document.getElementById('funfact');
      if (!el || !(totalHours > 0)) return;
      if (factTimer) clearInterval(factTimer);

      // Shuffled once per render so a reload does not always open the same way.
      factOrder = FUN_FACTS.map(function (_, i) { return i; });
      for (var i = factOrder.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = factOrder[i]; factOrder[i] = factOrder[j]; factOrder[j] = tmp;
      }
      factIdx = 0;
      el.innerHTML = FUN_FACTS[factOrder[0]](totalHours);

      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      factTimer = setInterval(function () {
        factIdx = (factIdx + 1) % factOrder.length;
        var next = FUN_FACTS[factOrder[factIdx]](totalHours);
        if (reduce) { el.innerHTML = next; return; }
        el.dataset.out = 'true';
        setTimeout(function () {
          el.innerHTML = next;
          el.dataset.out = 'false';
        }, 600);
      }, 9000);
    }

    /* ═══════════════════════════════════════════════════════════════
       Modal
       ═══════════════════════════════════════════════════════════════ */
    var lastFocus = null;
    function openModal(titleHtml, bodyHtml) {
      lastFocus = document.activeElement;
      document.getElementById('modalTitle').innerHTML = titleHtml;
      document.getElementById('modalBody').innerHTML = bodyHtml;
      document.getElementById('modalBackdrop').hidden = false;
      document.getElementById('modalClose').focus();
    }
    function closeModal() {
      if (document.getElementById('modalBackdrop').hidden) return;
      document.getElementById('modalBackdrop').hidden = true;
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }
    function openFlagModal(flagId) {
      var flag = null;
      DATA_FLAGS.forEach(function (f) { if (f.id === flagId) flag = f; });
      if (!flag) return;
      openModal(ICONS.alert + esc(flag.label),
        '<p><b>' + esc(monthSpanLabel(flag)) + '</b></p><p>' + esc(flag.detail) + '</p>' +
        '<p>Line items for these months link to ClickUp where a task exists. Some of the ' +
        'missing time was never logged against a task at all, which is part of what we are ' +
        'reconstructing.</p>');
    }

    function wireModal() {
      document.getElementById('modalClose').innerHTML = ICONS.close;
      document.getElementById('modalClose').addEventListener('click', closeModal);
      document.getElementById('modalBackdrop').addEventListener('click', function (e) {
        if (e.target === this) closeModal();
      });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
      // Delegated so it covers flag buttons in any re-rendered section. Bound in
      // the capture phase: a flag button inside a summary-table row would
      // otherwise hit the row's own bubble listener first, selecting the month
      // before this handler could stop it.
      document.addEventListener('click', function (e) {
        var btn = e.target.closest ? e.target.closest('.flag-btn') : null;
        if (!btn) return;
        e.preventDefault();
        e.stopPropagation();
        openFlagModal(btn.dataset.flag);
      }, true);
    }

    /* ═══════════════════════════════════════════════════════════════
       Export
       ═══════════════════════════════════════════════════════════════ */
    function csvCell(v) {
      var s = String(v == null ? '' : v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }
    function download(filename, rows) {
      var csv = rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
      var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }
    function stampSuffix() {
      var d = state.generatedAt || new Date();
      return d.toISOString().slice(0, 10);
    }

    function exportSummary() {
      var t = totals(), allow = allowance();
      var rows = [['Month', 'Creative hours', 'Retainer budget (h)', 'Creative % used', 'Other hours (SOW)', 'Total hours', 'Data note']];
      state.range.forEach(function (m) {
        var f = flagFor(YEAR, m.month, 'creative');
        rows.push([MONTH_NAMES[m.month] + ' ' + YEAR, m.creative.toFixed(2), BUDGET,
                   pctOf(m.creative, BUDGET) + '%', m.nonCreative.toFixed(2), m.total.toFixed(2),
                   f ? f.label + ': ' + f.detail : '']);
      });
      rows.push([]);
      rows.push(['Year to date', t.creative.toFixed(2), allow, pctOf(t.creative, allow) + '%',
                 t.nonCreative.toFixed(2), t.total.toFixed(2), '']);
      rows.push([]);
      rows.push(['Generated', (state.generatedAt || new Date()).toISOString(), 'Source', 'ClickUp time tracking']);
      download('moss-hours-' + YEAR + '-summary-' + stampSuffix() + '.csv', rows);
    }

    function exportYear() {
      var t = totals(), allow = allowance(), months = allowanceMonths();
      var rows = [['Moss hours report', YEAR + ' year summary']];
      rows.push([]);
      rows.push(['Period', MONTH_NAMES[state.range[0].month] + ' to ' +
                 MONTH_NAMES[state.range[state.range.length - 1].month] + ' ' + YEAR]);
      rows.push(['Months of retainer', months]);
      rows.push(['Retainer budget (h/month)', BUDGET]);
      rows.push([]);
      rows.push(['Category', 'Hours', 'Available (h)', '% used', 'Share of total']);
      rows.push(['Creative (retainer)', t.creative.toFixed(2), allow, pctOf(t.creative, allow) + '%',
                 (t.total > 0 ? Math.round((t.creative / t.total) * 100) : 0) + '%']);
      rows.push(['Other (SOW / project work)', t.nonCreative.toFixed(2), '', '',
                 (t.total > 0 ? Math.round((t.nonCreative / t.total) * 100) : 0) + '%']);
      rows.push(['Total delivered', t.total.toFixed(2), '', '', '100%']);
      rows.push([]);
      rows.push(['Retainer months consumed', fmtMonths(t.creative / BUDGET) + ' of ' + months]);

      var flags = flagsInRange(YEAR, state.range, 'creative');
      if (flags.length) {
        rows.push([]);
        rows.push(['Data note', flags[0].label + ': ' + monthSpanLabel(flags[0])]);
        rows.push(['', flags[0].detail]);
      }
      rows.push([]);
      rows.push(['Generated', (state.generatedAt || new Date()).toISOString(), 'Source', 'ClickUp time tracking']);
      download('moss-hours-' + YEAR + '-year-summary-' + stampSuffix() + '.csv', rows);
    }

    function exportLineItems() {
      var rows = [['Month', 'Category', 'Task', 'Hours', 'ClickUp link', 'Data note']];
      state.range.forEach(function (m) {
        CATS.forEach(function (c) {
          var f = flagFor(YEAR, m.month, c.key);
          sortItems(m[c.items] || []).forEach(function (t) {
            rows.push([MONTH_NAMES[m.month] + ' ' + YEAR, c.label, t.name, t.hours.toFixed(2),
                       t.url || '', f ? f.label : '']);
          });
        });
      });
      rows.push([]);
      rows.push(['Generated', (state.generatedAt || new Date()).toISOString(), 'Source', 'ClickUp time tracking']);
      download('moss-hours-' + YEAR + '-line-items-' + stampSuffix() + '.csv', rows);
    }

    function wireChrome() {
      document.getElementById('refreshBtn').innerHTML = ICONS.refresh;
      document.getElementById('refreshBtn').addEventListener('click', function () { load(true); });

      var menu = document.getElementById('exportMenu');
      var btn = document.getElementById('exportBtn');
      // The qualifier is what makes this read as "this page, as it stands", so
      // it is only dropped where it will not fit beside the year pills.
      btn.innerHTML = ICONS.download + 'Export<span class="x-long"> this report</span>';
      menu.innerHTML =
        '<div class="menu-label">Download</div>' +
        '<button data-a="year">' + ICONS.download + 'Year summary (CSV)</button>' +
        '<button data-a="summary">' + ICONS.download + 'Monthly summary (CSV)</button>' +
        '<button data-a="items">' + ICONS.download + 'Task line items (CSV)</button>' +
        '<div class="menu-label">Share</div>' +
        '<button data-a="print">' + ICONS.printer + 'Print / Save as PDF</button>';

      function close() { menu.dataset.open = 'false'; btn.setAttribute('aria-expanded', 'false'); }
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var open = menu.dataset.open !== 'true';
        menu.dataset.open = String(open);
        btn.setAttribute('aria-expanded', String(open));
      });
      menu.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        if (b.dataset.a === 'year') exportYear();
        else if (b.dataset.a === 'summary') exportSummary();
        else if (b.dataset.a === 'items') exportLineItems();
        else if (b.dataset.a === 'print') window.print();
        close();
      });
      document.addEventListener('click', close);
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    }

    /* ═══════════════════════════════════════════════════════════════
       Boot
       ═══════════════════════════════════════════════════════════════ */
    wireChrome();
    wireModal();
    renderYears();
    tickClock();
    setInterval(tickClock, 1000);
    window.addEventListener('resize', syncMastheadHeight);
    load();
  </script>
</body>
</html>
