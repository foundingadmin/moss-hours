        <img src="assets/fc-icon-white.svg" alt="" />
        <span>foundingcreative.com</span>
      </a>
      <!-- Rendered only when SLA_DOCUMENT_URL is set. Empty by default, and
           empty means nothing renders here at all. -->
      <div class="foot-sla" id="footSla"></div>
      <div class="foot-data">
        <span class="fetched" id="clockFetched">Loading data…</span>
        <button class="btn icon-only" id="refreshBtn" title="Refresh data from ClickUp" aria-label="Refresh data from ClickUp"></button>
      </div>
    </footer>

    <!-- Reusable detail modal: used by the data-integrity flags, and available
         to any future note that would otherwise clutter the layout. -->
    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-head">
          <h2 class="modal-title" id="modalTitle"></h2>
          <button class="btn icon-only" id="modalClose" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>
  </div>

  <script>
    /* ═══════════════════════════════════════════════════════════════
       Config
       ═══════════════════════════════════════════════════════════════ */
    var API_BASE = new URLSearchParams(location.search).get('api') || '/api/time';
    var CURRENT_YEAR = new Date().getFullYear();
    var YEAR = parseInt(new URLSearchParams(location.search).get('year')) || CURRENT_YEAR;
    /* Which years the selector offers. The prior-year tab is hidden, not
       removed: the loader, the API and the pill rendering all still take any
       year, and ?year= still reaches one that is not listed here, so putting
       the tab back is adding CURRENT_YEAR - 1 to this list. */
    var YEAR_OPTIONS = [CURRENT_YEAR];
    var BUDGET = 50;

    /* Export is hidden, not removed. The CSV builders, the print stylesheet and
       the menu wiring are all still here and still correct; this switch is the
       only thing standing between them and the page, so bringing the feature
       back is one word. */
    var SHOW_EXPORT = false;

    /* The signed agreement, hosted somewhere the client can open it. Every
       factual claim this report makes cites a clause of that document, so a
       reader who wants to check one should not have to ask us for the file.

       Empty until Josh supplies the URL. While it is empty the footer renders
       exactly as it did before, because a link to nowhere is worse than no link
       at all: it tells the reader the document exists and then fails them. */
    var SLA_DOCUMENT_URL = '';

    /* Projections are hidden, not removed. With this off the chart stops at the
       last tracked month, the textured ground and the estimate band are never
       drawn, and the key naming them is suppressed. projectRest() and its
       plugins are untouched, so switching this back on is one word. */
    var SHOW_PROJECTIONS = false;

    var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    var MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    /* One series in one hue, split three ways by how well each hour is
       evidenced. `fill` is the mark colour (brand mint, stepped into the
       dark-mode lightness band); `ink` is the full-brand value used for
       strokes, swatches and figures. Both are canvas literals, because
       Chart.js draws to a canvas and cannot read a custom property.

       Every one of the three carries the same green. The pattern is the only
       difference, and it runs denser where the evidence is stronger. Read
       bottom to top, this is also the stacking order on the chart. */
    var SERIES_INK = '#7EF893';
    var SERIES_FILL = '#27AC4B';
    var SERIES = [
      { key: 'logged',     label: 'Logged as it happened',
        hatch: null,          markClass: '' },
      { key: 'documented', label: 'Reconstructed, documented',
        hatch: 'documented',  markClass: 'hatch-doc' },
      { key: 'estimated',  label: 'Reconstructed, estimated',
        hatch: 'estimated',   markClass: 'hatch-est' }
    ];

    /* Data-integrity annotations. Each entry flags a (year, months, series)
       slice as not fully trustworthy, and surfaces as a warn-outlined bar and
       marker on the chart, a mark beside that month's figure in the summary
       table, a note in the bar's tooltip, a labelled tag at the top of the
       month's expanded detail, and a Data note row in the CSV exports. Remove
       an entry once its data is repaired.

       `detail` names no months and no dates. The chart already shows which
       months are flagged, and the summary table marks them again, so writing a
       span into the copy only fixed a second thing to keep in step with the
       `months` array above. It explains why the figures are low, and nothing
       else. */
    /* Empty on purpose, and the mechanism is kept.

       The one entry this held flagged January through May 2026 as
       under-reported, with a note saying we were recovering the missing entries
       and would restate the figures. That is precisely what the reconstruction
       encoding now does, in the chart itself: those months are restated, and
       the stripes say which hours came from records rather than from a timer.
       Leaving the flag would put a warning triangle on exactly the months the
       chart already explains, attached to copy that is no longer true.

       The machinery stays because the next data problem will not be this one,
       and a warn treatment that is already built and already checked is worth
       more than the twenty lines it costs. */
    var DATA_FLAGS = [];

    function flagFor(year, monthIdx, seriesKey) {
      for (var i = 0; i < DATA_FLAGS.length; i++) {
        var f = DATA_FLAGS[i];
        if (f.year === year && f.series === seriesKey && f.months.indexOf(monthIdx) !== -1) return f;
      }
      return null;
    }
    function flagsInRange(year, range, seriesKey) {
      var out = [];
      range.forEach(function (m) {
        var f = flagFor(year, m.month, seriesKey);
        if (f && out.indexOf(f) === -1) out.push(f);
      });
      return out;
    }

    var chart = null;
    var state = { months: [], range: [], selected: null, hidden: {}, generatedAt: null };

    var view = { mode: 'year' };
    var priorYear = { year: null, months: null, state: 'idle' };  // 'idle' | 'loading' | 'done' | 'none'

    /* The last month that can carry a complete figure: for the current year the
       month we are in is still filling up, so it is never a basis for a mean. */
    function lastCompleteMonth() {
      if (YEAR !== CURRENT_YEAR) return 11;
      return new Date().getMonth() - 1;
    }
    function lastActualMonth() {
      var last = -1;
      state.months.forEach(function (m) { if (m.total > 0) last = m.month; });
      if (YEAR === CURRENT_YEAR) last = Math.max(last, new Date().getMonth());
      return last;
    }

    /* Projection for the months that have not happened yet.

       Basis: the mean of the completed months that carry time. If last year is
       available, each future month is then shaped by how that month compared
       with its own year's mean, which is what carries a seasonal pattern like a
       quiet August. The factor is clamped, so one freak month last year cannot
       throw a forecast twice as far as anything ever observed.

       Range: a single line of estimate reads as a promise. The spread of the
       months already tracked is the only honest measure of how far a future
       month might land from the average, so it becomes a high/low band around
       each projected total: the coefficient of variation of the completed
       months, floored so a short or unusually even history still admits some
       uncertainty, and capped so a single wild month does not open the band
       wider than it can mean anything. */
    var SPREAD_MIN = 0.12, SPREAD_MAX = 0.45;
    function projectRest() {
      var lastActual = lastActualMonth();
      var lastComplete = lastCompleteMonth();
      var out = { from: lastActual + 1, total: [],
                  low: [], high: [], spread: 0, basis: 'none' };
      if (out.from > 11) return out;

      var done = state.months.filter(function (m) {
        return m.month <= lastComplete && m.total > 0;
      });
      if (!done.length) return out;

      /* Projected against the month's total, not against the logged /
         reconstructed split. A future month has no evidence class: it has not
         happened, so there is nothing yet to have documented or estimated. The
         texture and the hollow bar are what say the figure is projected. */
      var meanT = done.reduce(function (a, m) { return a + m.total; }, 0) / done.length;
      out.basis = 'average';

      var shape = null;
      if (priorYear.state === 'done' && priorYear.months) {
        var pr = priorYear.months.filter(function (m) { return m.total > 0; });
        if (pr.length >= 6) {
          var pMean = pr.reduce(function (a, m) { return a + m.total; }, 0) / pr.length;
          if (pMean > 0) {
            shape = priorYear.months.map(function (m) {
              if (!(m.total > 0)) return 1;
              return Math.min(1.8, Math.max(0.45, m.total / pMean));
            });
            out.basis = 'prior-year';
          }
        }
      }

      /* How far a tracked month has typically sat from the average, as a
         fraction of it. Population spread, not a sample estimate: these are all
         the months there are, not a draw from a larger set. */
      var sd = Math.sqrt(done.reduce(function (a, m) {
        return a + (m.total - meanT) * (m.total - meanT);
      }, 0) / done.length);
      out.spread = meanT > 0
        ? Math.min(SPREAD_MAX, Math.max(SPREAD_MIN, sd / meanT))
        : SPREAD_MIN;

      for (var i = out.from; i <= 11; i++) {
        var mid = meanT * (shape ? shape[i] : 1);
        out.total[i] = mid;
        out.low[i] = Math.max(0, mid * (1 - out.spread));
        out.high[i] = mid * (1 + out.spread);
      }
      return out;
    }

    /* Last year is only worth a round trip when the reader asks for the full
       year, so it is fetched on demand and the chart redrawn if it lands. */
    function ensurePriorYear(then) {
      if (priorYear.year === YEAR - 1 && priorYear.state !== 'idle') return then && then();
      priorYear = { year: YEAR - 1, months: null, state: 'loading' };
      fetch(API_BASE + '?year=' + (YEAR - 1))
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (!d || !d.months) { priorYear.state = 'none'; return; }
          priorYear.months = normalize(d);
          priorYear.state = priorYear.months.some(function (m) { return m.total > 0; }) ? 'done' : 'none';
        })
        .catch(function () { priorYear.state = 'none'; })
        .then(function () { if (then) then(); });
    }

    /* One breakpoint drives every layout decision the script makes: the chart
       orientation and the length of the clock string. It matches the CSS
       breakpoint used for the masthead. */
    var NARROW = window.matchMedia('(max-width: 700px)');
    function isNarrow() { return NARROW.matches; }

    /* ═══════════════════════════════════════════════════════════════
       Formatting helpers
       ═══════════════════════════════════════════════════════════════ */
    function fmtH(h) {
      if (h === null || h === undefined) return '0h';
      var hrs = Math.floor(h), mins = Math.round((h - hrs) * 60);
      if (mins === 60) { hrs += 1; mins = 0; }
      if (hrs === 0 && mins === 0) return '0h';
      if (hrs === 0) return mins + 'm';
      if (mins === 0) return hrs + 'h';
      return hrs + 'h ' + mins + 'm';
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }
    function pctOf(used, budget) { return budget > 0 ? Math.round((used / budget) * 100) : 0; }

    function fmtMonths(n) { return (Math.round(n * 10) / 10).toFixed(1); }
    /* Using the retainer is the point, so 90% is not a warning state. Green
       holds to the cap and only going over turns red. Yellow stays reserved for
       data integrity. */
    function pctColor(pct) { return pct > 100 ? 'var(--over)' : 'var(--ok)'; }

    var ICONS = {
      refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>',
      download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
      printer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>',
      external: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>',
      alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
      info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
      spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3"/></svg>',
      close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
      chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>',
    };


    /* ═══════════════════════════════════════════════════════════════
       Freshness
       ═══════════════════════════════════════════════════════════════ */
    /* One readout, not two. The footer used to carry a live wall clock above
       the freshness note, which told the reader the time on their own machine:
       a moving part that answered a question nobody had. What is left is the
       only thing here worth stating, which is how old the data is. */
    function relTime(d) {
      var s = Math.max(0, Math.round((Date.now() - d.getTime()) / 1000));
      if (s < 10) return 'just now';
      if (s < 60) return s + 's ago';
      if (s < 3600) return Math.round(s / 60) + 'm ago';
      // A past year is cached for a day and served stale for up to a week, so
      // ages beyond 24h are reachable and should not read as "168h ago".
      if (s < 86400) return Math.round(s / 3600) + 'h ago';
      return Math.round(s / 86400) + 'd ago';
    }
    /* The stamp beside the relative age. Responses are cached at the edge, and a
       past year is held for days, so `generatedAt` is not always today: "3d ago
       · 6:25 PM" states an hour on an unnamed day, which is worse than saying
       nothing. The date is added as soon as the payload is not from today, and
       left off when it is, since naming today back to the reader is noise. */
    function fmtStamp(d) {
      var now = new Date();
      var sameDay = d.getFullYear() === now.getFullYear() &&
                    d.getMonth() === now.getMonth() &&
                    d.getDate() === now.getDate();
      return d.toLocaleString(undefined, sameDay
        ? { hour: 'numeric', minute: '2-digit' }
        : { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    }
    function tickClock() {
      var el = document.getElementById('clockFetched');
      if (state.generatedAt) {
        el.textContent = isNarrow()
          ? 'Updated ' + relTime(state.generatedAt)
          : 'Data updated ' + relTime(state.generatedAt) + ' · ' + fmtStamp(state.generatedAt);
      }
      syncMastheadHeight();
    }

    /* Publishes the sticky masthead's real height so scroll-margin-top can keep
       jump targets clear of it. It changes with the breakpoint and with how the
       clock string wraps, so it is measured rather than assumed. */
    var lastMastheadH = -1;
    function syncMastheadHeight() {
      var el = document.querySelector('.masthead');
      if (!el) return;
      var h = Math.round(el.getBoundingClientRect().height);
      if (h === lastMastheadH) return;
      lastMastheadH = h;
      document.documentElement.style.setProperty('--mh', h + 'px');
    }

    /* ═══════════════════════════════════════════════════════════════
       Data shaping
       ═══════════════════════════════════════════════════════════════ */
    function normalize(data) {
      /* The API is authoritative for the arithmetic: it emits every figure
         already rounded, and derives a month's totals from the same items it
         lists under it, so nothing is re-added here and the drawer can never
         disagree with the row it hangs from. The fallbacks cover a payload from
         an older deploy reaching a newer page: that lands on zeroes rather than
         on NaN spread across the chart. */
      return (data.months || []).map(function (m) {
        var h = m.hours || {};
        return {
          month: m.month,
          logged: h.logged || 0,
          documented: h.documented || 0,
          estimated: h.estimated || 0,
          reconstructed: m.reconstructed || 0,
          total: m.total || 0,
          items: m.items || []
        };
      });
    }
    function sortItems(items) {
      return items.slice().sort(function (a, b) { return b.total - a.total; });
    }
    function totals() {
      var t = { logged: 0, documented: 0, estimated: 0, reconstructed: 0, total: 0 };
      state.range.forEach(function (m) {
        t.logged += m.logged; t.documented += m.documented; t.estimated += m.estimated;
        t.reconstructed += m.reconstructed; t.total += m.total;
      });
      // Summed from figures the API already rounded, so anything past two
      // decimals here is float noise rather than real precision.
      Object.keys(t).forEach(function (k) { t[k] = Math.round(t[k] * 100) / 100; });
      return t;
    }
    /* Months of retainer the client has actually paid for, which is not the same
       as the months that happen to carry tracked time: the retainer accrues on
       the 1st whether or not anyone logs hours. For the current year that runs
       from the first tracked month through the month we are in now; for a past
       year it runs through the last month with time on it. */
    function allowanceMonths() {
      var first = state.range[0].month;
      var last = state.range[state.range.length - 1].month;
      if (YEAR === CURRENT_YEAR) last = Math.max(last, new Date().getMonth());
      return last - first + 1;
    }
    function allowance() { return BUDGET * allowanceMonths(); }

    /* ═══════════════════════════════════════════════════════════════
       Load
       ═══════════════════════════════════════════════════════════════ */
    // Rendered into every .years container, so the two title-row layouts can be
    // compared with a working selector in each.
    function renderYears() {
      // ?year= can reach a year the selector does not offer. The year on screen
      // has to be one of the pills, or the control names a year the report is
      // not showing, so it is added back when that happens.
      var opts = YEAR_OPTIONS.indexOf(YEAR) === -1
        ? YEAR_OPTIONS.concat([YEAR]).sort(function (a, b) { return b - a; })
        : YEAR_OPTIONS;
      document.querySelectorAll('.years').forEach(function (el) {
        el.innerHTML = opts.map(function (y) {
          return '<button class="pill" data-y="' + y + '" aria-pressed="' + (y === YEAR) + '">' + y + '</button>';
        }).join('');
        el.querySelectorAll('button').forEach(function (b) {
          b.addEventListener('click', function () {
            if (YEAR === parseInt(b.dataset.y)) return;
            YEAR = parseInt(b.dataset.y);
            renderYears();
            load();
          });
        });
      });
    }
    function setRangeText(txt) {
      document.querySelectorAll('[data-range]').forEach(function (el) { el.textContent = txt; });
    }

    function load(manual) {
      var content = document.getElementById('content');
      var btn = document.getElementById('refreshBtn');
      btn.setAttribute('aria-busy', 'true');
      if (!manual) content.innerHTML = '<div class="state"><div class="spinner"></div>Loading ' + YEAR + ' hours…</div>';
      setRangeText('');
      if (chart) { chart.destroy(); chart = null; }

      // An ordinary load is served from the edge cache, so it costs nothing at
      // ClickUp. Only the refresh button asks for a genuine round trip. Nothing
      // cache-busts: a unique URL per load is a unique cache key, which is what
      // made every visit a fresh pull.
      var url = API_BASE + '?year=' + YEAR + (manual ? '&fresh=1' : '');
      fetch(url)
        .then(function (r) {
          return r.text().then(function (t) {
            if (!r.ok) throw new Error('API ' + r.status + ': ' + t.slice(0, 200));
            return JSON.parse(t);
          });
        })
        .then(render)
        .catch(function (e) {
          content.innerHTML = '<div class="state err">Couldn’t load data.<code>' + esc(e.message) + '</code>' +
            '<div style="margin-top:12px;color:var(--dim);">Confirm <b>MOSS_CLICKUP_TOKEN</b> is set in Vercel and the API is reachable at <code>' + esc(API_BASE) + '</code>.</div></div>';
        })
        .then(function () { btn.removeAttribute('aria-busy'); });
    }

    /* ═══════════════════════════════════════════════════════════════
       Render
       ═══════════════════════════════════════════════════════════════ */
    function render(data) {
      BUDGET = data.retainerBudget || 50;
      state.generatedAt = data.generatedAt ? new Date(data.generatedAt) : new Date();
      state.months = normalize(data);

      var active = [];
      state.months.forEach(function (m) { if (m.total > 0) active.push(m.month); });

      var content = document.getElementById('content');
      if (!active.length) {
        setRangeText(String(YEAR));
        content.innerHTML = '<div class="state">No tracked hours for ' + YEAR + ' yet.</div>';
        tickClock();
        return;
      }

      var first = active[0], last = active[active.length - 1];
      state.range = state.months.slice(first, last + 1);
      // Closed on arrival. The table is a list of figures until the reader asks
      // one of them a question.
      if (state.selected !== null && (state.selected < first || state.selected > last)) state.selected = null;

      setRangeText(state.range.length + (state.range.length === 1 ? ' month' : ' months') +
        ' of tracked time · ' + MONTH_NAMES[first] + ' – ' + MONTH_NAMES[last] + ' ' + YEAR);

      // The table is part of the overview section now, not a section of its own.
      content.innerHTML = heroHtml() + teamHtml() + overviewHtml();

      wireLegend();
      wireSummaryTable();
      wireTeamImages();
      wireExport();
      drawChart();
      updateChartNote();
      startFunFacts(totals().total);
      tickClock();
    }

    /* ── Year-to-date hero ──────────────────────────────────────── */
    function heroHtml() {
      var t = totals();
      var months = allowanceMonths();

      var h = '<section class="sec"><div class="hero">';
      h += '<div class="hero-top">';
      h += '<div class="hero-total"><div class="eyebrow">Retainer hours delivered · ' + YEAR + '</div>' +
           '<div class="v grad num">' + fmtH(t.total) + '</div>' +
           '<div class="hero-ctx"><strong>Year to date</strong> · ' +
           months + ' ' + (months === 1 ? 'month' : 'months') + '</div></div>';
      h += '<div class="funfact"><div class="eyebrow">For scale</div>' +
           '<div class="ff-body">' + factStackHtml(t.total) + '</div>' +
           '<div class="ff-nav">' +
           '<button class="step-btn" data-fact="-1" aria-label="Previous comparison">' + ICONS.chevron + '</button>' +
           '<button class="step-btn" data-fact="1" aria-label="Next comparison">' + ICONS.chevron + '</button>' +
           '</div></div>';
      h += '</div>';

      /* This space has held the two summary meters and then the team roster.
         Both were repeats of what is charted below. The one thing the reader
         cannot get anywhere else is what the retainer is and what these
         percentages are measured against, so that is what sits here. */
      h += '<div class="split">' + defsHtml() + '</div>';

      h += '</div></section>';
      return h;
    }

    /* The retainer, stated once, where the reader first meets the figures.

       Written for a reader who has never seen the agreement, because this
       report is read by people with no context and a stake in the outcome.
       Every claim maps to a numbered clause so any of it can be checked:
       3.1 for the allowance and the term, 4.1 for rollover, 2.2.2 for what is
       excluded and why.

       Note what it does not say. The agreement does not restrict retainer work
       to one department or one contact, so nothing here implies that. The
       accurate claim, and the stronger one, is that work already covered by a
       separate signed agreement is fulfilled under that agreement. */
    function defsHtml() {
      var h = '<div class="defs">';
      h += '<div class="def"><span class="swatch" style="background:var(--creative-ink)"></span>' +
           '<div class="def-body"><div class="def-name">Retainer' +
           '<span class="def-terms">' + BUDGET + 'h per month</span></div>' +
           '<p class="def-text">Moss holds ' + BUDGET + ' agency hours a month under a service level ' +
           'agreement running February 2025 to February 2027, with up to 10 unused hours rolling ' +
           'into the following month (clauses 3.1 and 4.1). This report covers retainer work only. ' +
           'Work running under a separate signed agreement is fulfilled under that agreement and ' +
           'does not draw on these hours (clause 2.2.2). Every percentage here is the share of the ' +
           BUDGET + ' hour monthly allowance used.</p></div></div>';
      h += '</div>';
      return h;
    }

    /* ── Team ───────────────────────────────────────────────────────
       A hardcoded list, not a query. The block this replaced was built from
       whichever ClickUp accounts had logged time in a given month, which put
       the client's view of their own team at the mercy of our timesheets and
       let a renamed account render a name they had never heard.

       No hours, no percentages, no ordering by contribution. Who is on the
       account is not a leaderboard. */
    var TEAM = [
      { name: 'Josh Titus', title: 'Partner and Creative Director', image: '/team/roster/titus.webp' }
      /* TODO: Josh to supply the remaining members. Same three fields, and the
         image is a 160px square webp committed under team/roster/. A member
         whose image is missing renders as text rather than as a broken tile,
         so an entry can be added before its artwork is. */
    ];

    function teamHtml() {
      if (!TEAM.length) return '';
      var h = '<section class="sec"><div class="sec-head">' +
        '<h2 class="sec-title">Your team</h2></div>';
      h += '<div class="team-grid">';
      TEAM.forEach(function (p) {
        h += '<div class="team-member">' +
          '<img src="' + esc(p.image) + '" alt="' + esc(p.name) + '" ' +
          'width="160" height="160" loading="lazy" data-team-img="1">' +
          '<p class="team-name">' + esc(p.name) + '</p>' +
          '<p class="team-title">' + esc(p.title) + '</p>' +
          '</div>';
      });
      h += '</div></section>';
      return h;
    }

    /* A missing file hides its own tile rather than rendering the browser's
       broken-image glyph on a page a client is reading. The name and title
       beside it stay, so the person is still listed. */
    function wireTeamImages() {
      document.querySelectorAll('img[data-team-img]').forEach(function (img) {
        img.addEventListener('error', function () { img.style.display = 'none'; });
      });
    }

    function monthSpanLabel(flag) {
      var ms = flag.months.slice().sort(function (a, b) { return a - b; });
      var label = ms.length > 1 ? MONTH_ABBR[ms[0]] + '–' + MONTH_ABBR[ms[ms.length - 1]] : MONTH_ABBR[ms[0]];
      return label + ' ' + flag.year + ' Creative';
    }
    /* A compact affordance that opens the shared modal. Same behaviour on
       desktop and touch, so there is no hover-only information. */
    function flagBtnHtml(flag, labelled) {
      return '<button type="button" class="flag-btn' + (labelled ? ' labelled' : '') +
        '" data-flag="' + esc(flag.id) + '" aria-label="' + esc(flag.label) + ', read the data note">' +
        ICONS.alert + (labelled ? esc(flag.label) : '') + '</button>';
    }

    /* ── Monthly overview ────────────────────────────────────────────
       The chart and the table are one section under one heading: the same year
       drawn, then written out, with each month's task detail folded into its
       own row. Two headings made them read as two separate exhibits. */
    function overviewHtml() {
      var t = totals();
      var h = '<section class="sec"><div class="sec-head">' +
        '<h2 class="sec-title">Monthly overview</h2>' +
        (SHOW_EXPORT
          ? '<div class="menu-wrap">' +
            '<button class="export-link" id="exportBtn" aria-haspopup="true" aria-expanded="false">Export</button>' +
            '<div class="menu" id="exportMenu" role="menu"></div></div>'
          : '') +
        '</div>';
      h += '<div class="chart-block">';
      /* Three entries, each with its swatch and its label in words. The pattern
         is carrying the entire honesty claim this report makes, and a texture
         nobody has named is just a texture. */
      h += '<div class="legend" id="legend">';
      SERIES.forEach(function (s, i) {
        h += '<button class="legend-item" data-i="' + i + '" data-off="false" aria-pressed="true">' +
          '<span class="swatch ' + s.markClass + '"' +
          (s.hatch ? '' : ' style="background:var(--creative-ink)"') + '></span>' +
          '<span class="lg-stack"><span class="lg-name">' + s.label + '</span>' +
          '<span class="val">' + fmtH(t[s.key]) + '</span></span></button>';
      });
      h += '</div>';
      h += '<div class="chart-wrap"><canvas id="overviewChart" role="img" ' +
        'aria-label="Stacked bar chart of retainer hours per month, split into hours logged as ' +
        'they happened and hours reconstructed from records"></canvas></div>';
      h += '</div>';
      h += '<div class="chart-key" id="chartNote"></div>';
      h += reconNoteHtml();
      h += summaryHtml();
      h += '</section>';
      return h;
    }


    /* The note under the chart. It is placed here, above the table, because a
       reader who has just seen striped bars asks what they mean before they
       start reading figures, and an answer parked in a footnote arrives after
       they have already decided what to think.

       No apology in it. The process changed and the record got better, which is
       the whole story and a good one. */
    function reconNoteHtml() {
      return '<div class="recon-note">' +
        '<p>January through May 2026 were rebuilt from records rather than tracked as the work ' +
        'happened. <b>Documented</b> hours trace to an existing record: an invoice, a calendar ' +
        'event, an email thread or a dated work log. <b>Estimated</b> hours are work the team ' +
        'knows was delivered, sized from direct knowledge of it.</p>' +
        '<p>Requests from Moss in May 2026 prompted a change in process. From June 2026 every ' +
        'piece of retainer work carries its own task and is tracked to the minute as it happens, ' +
        'which is why the bars from June onward are solid.</p>' +
        '</div>';
    }

    /* ── Monthly summary table, with the task detail as a per-month
       accordion so a month's figures and its tasks read as one thing ── */
    function summaryHtml() {
      var t = totals();
      var ytdPct = pctOf(t.total, allowance());
      var anyOver = state.range.some(function (m) { return pctOf(m.total, BUDGET) > 100; });

      var h = '<div class="table-scroll"><table class="table"><thead><tr>' +
        '<th>Month</th>' +
        '<th class="r">Logged</th>' +
        '<th class="r">Reconstructed</th>' +
        '<th class="r col-gap col-total">Total</th>' +
        '<th class="r">Allowance used</th>' +
        '</tr></thead><tbody>';

      state.range.forEach(function (m) {
        /* Percent of the contracted 50 hours per month (clause 3.1), flat.
           Clause 4.1 also rolls up to 10 unused hours into the following month,
           so a month following an underused one has more than 50 available. The
           ruling is to report against the contracted 50 regardless, because a
           denominator that moves month to month is a figure the reader cannot
           check against anything in their own agreement. The definition block
           above states both the rollover and the basis, so the two are never
           read as the same number. */
        var pct = pctOf(m.total, BUDGET);
        var open = m.month === state.selected;
        h += '<tr class="mrow" data-m="' + m.month + '" tabindex="0" aria-expanded="' + open +
             '" aria-controls="acc-' + m.month + '">';
        h += '<td><span class="mo"><span class="caret" aria-hidden="true">' + ICONS.chevron + '</span>' +
             '<span class="mo-full">' + MONTH_NAMES[m.month] + '</span>' +
             '<span class="mo-abbr">' + MONTH_ABBR[m.month] + '</span></span></td>';
        h += '<td class="r num col-series" style="color:var(--creative-ink)">' + fmtH(m.logged) + '</td>';
        // Same hue as Logged, marked by the hatch rather than recoloured: these
        // are the same hours in the same unit, differently evidenced.
        h += '<td class="r num col-series" style="color:var(--creative-ink)">' +
             (m.reconstructed > 0 ? '<span class="recon-mark" aria-hidden="true"></span>' : '') +
             fmtH(m.reconstructed) + '</td>';
        /* The Total column is a helper, not a headline: it saves the reader
           adding two figures in their head. Where a month has no reconstructed
           hours there is nothing to add, so the cell is left empty rather than
           repeating the Logged figure. Silence is the signal that nothing
           needed adding. */
        h += '<td class="r num primary col-gap col-total">' +
             (m.logged > 0 && m.reconstructed > 0 ? fmtH(m.total) : '') + '</td>';
        h += '<td class="r num">' + usePctHtml(pct) + '</td>';
        h += '</tr>';
        h += '<tr class="acc" id="acc-' + m.month + '" data-m="' + m.month + '"' + (open ? '' : ' hidden') +
             '><td colspan="5"><div class="acc-inner">' + monthDetailHtml(m) + '</div></td></tr>';
      });

      h += '</tbody><tfoot><tr>';
      h += '<td class="ytd-label"><span class="mo-full">Year to date</span><span class="mo-abbr">Total</span></td>';
      h += '<td class="r num" style="color:var(--creative-ink)">' + fmtH(t.logged) + '</td>';
      h += '<td class="r num" style="color:var(--creative-ink)">' + fmtH(t.reconstructed) + '</td>';
      // The year-to-date row always states every column, including this one:
      // it is the figure the whole page is about.
      h += '<td class="r num col-gap col-total"><span class="grad">' + fmtH(t.total) + '</span></td>';
      h += '<td class="r num">' + usePctHtml(ytdPct) + '</td>';
      h += '</tr></tfoot></table></div>';

      /* Stated once, under the table, and only when there is an over month to
         explain. Clause 6.1 makes hours beyond the retainer a negotiated
         supplement billed quarterly, so an over month is a contract mechanism
         working rather than a budget breach, and the report says so plainly
         instead of colouring it red and leaving the reader to guess. */
      if (anyOver) {
        h += '<p class="table-note"><b>Over 100% is not an overrun.</b> Hours beyond the monthly ' +
             'allowance are supplemental overage, negotiated and billed quarterly under clause 6.1 ' +
             'of the agreement.</p>';
      }
      return h;
    }

    /* The share of the allowance, and where it runs over, what that means.
       Plain white rather than an alarm colour: see the note under the table. */
    function usePctHtml(pct) {
      var over = pct > 100;
      return '<span class="use' + (over ? ' is-over' : '') + '"' +
        (over ? '' : ' style="color:' + pctColor(pct) + '"') + '>' + pct + '%</span>' +
        (over ? '<span class="over-tag">Overage</span>' : '');
    }

    /* One month at a time: opening a row closes whichever was open, and
       selecting the open month closes it again. */
    function toggleMonth(monthIdx) {
      openMonth(state.selected === monthIdx ? null : monthIdx);
    }

    // Unconditional, for the chart: clicking a bar opens that month whether or
    // not it was already the open one.
    function openMonth(monthIdx, scroll) {
      state.selected = monthIdx;
      document.querySelectorAll('.table tbody tr.mrow').forEach(function (r) {
        r.setAttribute('aria-expanded', parseInt(r.dataset.m) === state.selected);
      });
      document.querySelectorAll('.table tbody tr.acc').forEach(function (r) {
        r.hidden = parseInt(r.dataset.m) !== state.selected;
      });
      // The category axis names the open month, so it is repainted whenever the
      // open month changes, including on closing.
      if (chart) chart.update('none');
      if (state.selected === null) return;
      var row = document.querySelector('.table tbody tr.mrow[data-m="' + state.selected + '"]');
      // 'nearest' so a row already on screen does not jump under the reader.
      if (row && scroll !== false) row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function wireSummaryTable() {
      document.querySelectorAll('.table tbody tr.mrow').forEach(function (r) {
        var month = parseInt(r.dataset.m);
        // A flag button inside the row is handled in the capture phase by
        // wireModal, which stops the event before it reaches this listener.
        r.addEventListener('click', function () { toggleMonth(month); });
        r.addEventListener('keydown', function (e) {
          // Only the row itself: Enter on the flag button it contains belongs
          // to the button.
          if (e.target !== r) return;
          if (e.key !== 'Enter' && e.key !== ' ') return;
          e.preventDefault();
          toggleMonth(month);
        });
        // Pointing at a month here dims every other month in the chart above.
        r.addEventListener('mouseenter', function () { linkHover(month); });
        r.addEventListener('focus', function () { linkHover(month); });
        r.addEventListener('mouseleave', function () { linkHover(null); });
        r.addEventListener('blur', function () { linkHover(null); });
      });
      // Leaving the table by any route clears it.
      var tbl = document.querySelector('.table');
      if (tbl) tbl.addEventListener('mouseleave', function () { linkHover(null); });

    }

    /* What the row itself cannot show: where the hours went. The month, its
       split and its total are all in the row this hangs from, so none of them
       are repeated at the top. */
    function drawerHeadHtml(m) {
      var n = (m.items || []).length;
      var flag = flagFor(YEAR, m.month, 'retainer');
      return '<div class="acc-top">' +
        (flag ? flagBtnHtml(flag, true) : '<span></span>') +
        '<span class="dh-meta">' + n + (n === 1 ? ' task' : ' tasks') + ' this month</span>' +
        '</div>';
    }

    function monthDetailHtml(m) {
      var h = drawerHeadHtml(m);
      h += '<div class="cat">';
      h += taskRows(m.items) ||
           '<p class="empty-note">No retainer time tracked this month.</p>';
      h += catFootHtml(m);
      h += '</div>';
      h += '<p class="acc-note">Sorted by most hours. Links open the task where one exists.</p>';
      return h;
    }

    /* The foot of the task list. The figure is the month's own stored total
       rather than a fresh sum of the rows, so the drawer can never disagree
       with the row it hangs from. The two reconcile by construction anyway: the
       API derives a month's totals from the same items it emits.

       It also states what the month came to against its allowance. The month
       row above carries that percentage too, and it is repeated here because
       the reader has just finished going down the rows and this is where the
       question comes up. */
    function catFootHtml(m) {
      var pct = pctOf(m.total, BUDGET);
      var h = '<div class="cat-foot"><div class="cat-total">' +
        '<span class="ct-label">Retainer total</span>' +
        '<span class="ct-val" style="color:var(--creative-ink)">' + fmtH(m.total) + '</span>' +
        '</div>';
      h += '<p class="ct-note">' +
        (pct > 100
          ? '<b>' + pct + '%</b> of monthly allowance, billed as overage under clause 6.1'
          : '<b style="color:' + pctColor(pct) + '">' + pct + '%</b> of monthly allowance') +
        '</p>';
      return h + '</div>';
    }

    /* One row per task, with its bar split the way the chart splits a month.
       A single task can hold logged and reconstructed time at once, which is
       why the split is drawn here rather than only on the month: the bar shows
       that a task was partly watched and partly rebuilt, and the alternative
       was making the reader take that on trust. */
    function taskRows(items) {
      if (!items || !items.length) return '';
      var max = items.reduce(function (a, t) { return Math.max(a, t.total); }, 0);
      return '<div style="margin-top:6px">' + sortItems(items).map(function (t) {
        var hrs = t.hours || {};
        // Short tasks arrive rolled up into one row so the lines still sum to
        // the header; show how many were folded in.
        var name = t.aggregated
          ? t.name + ' (' + t.count + (t.count === 1 ? ' task' : ' tasks') + ')'
          : t.name;
        var link = t.url
          ? '<a class="link" href="' + esc(t.url) + '" target="_blank" rel="noopener" title="Open “' + esc(t.name) + '”" aria-label="Open ' + esc(t.name) + '">' + ICONS.external + '</a>'
          : '<span class="link placeholder" title="No link available" aria-hidden="true">' + ICONS.external + '</span>';
        // Widths are a share of the widest task in the month, so the segments
        // of one row are to the same scale as every other row's.
        var seg = SERIES.map(function (s) {
          var v = hrs[s.key] || 0;
          if (!(v > 0) || !(max > 0)) return '';
          return '<span class="fill ' + (s.hatch === 'documented' ? 'doc' : s.hatch === 'estimated' ? 'est' : '') +
                 '" style="width:' + ((v / max) * 100) + '%"></span>';
        }).join('');
        // Named in the tooltip as well as drawn, because a hatch on a 6px bar
        // is a hint and the figures behind it should be readable.
        var tip = t.reconstructed > 0

    }

    /* ═══════════════════════════════════════════════════════════════
       Chart: grouped bars, outlined in warn ink where data is flagged
       ═══════════════════════════════════════════════════════════════ */
    // emphasis: index of the isolated series, or null for "show everything".
    var emphasis = null;

    /* Ghosting is a step back, not a change of material. Everything dimmed
       keeps its own colour and drops a fifth of its opacity, which is enough to
       say "not this one" without the rest of the chart going dark. The old flat
       greys took a green bar down to a smudge, so pointing at one month cost
       the reader every other month on the page. A tenth was then too little to
       register at all, so this sits between the two. The CSS side of the same
       effect, on the summary table's rows, has to be kept in step by hand. */
    var GHOST_A = 0.8;
    /* Projected months are a separate treatment, not a ghost: they stay at the
       weight they have always had, whatever is hovered. */
    var PROJ_INK = 'rgba(255,255,255,0.14)';
    // Flagged bars wear the warn ink as their outline, the same yellow the
    // markers and the summary table use.
    var WARN_INK = '#F5C26B';
    // The action colour, as a canvas literal. Same value as --action / the
    // brand's holo-cyan, which the canvas cannot read from CSS.
    var ACTION_INK = '#69EEFF';

    /* The open month is named on the category axis as well as outlined in the
       summary table, so the chart says which row is open without the reader
       having to hold the two together. Scriptable rather than baked in, so
       opening a different month is a chart.update and not a rebuild. */

    // Not on paper. Which month is open is a screen state, and the print
    // stylesheet drops the rest of it for the same reason.
    function tickSelected(ctx) {

    }

    }

    /* The total overlay is the one dataset that is not part of the stack, so it
       is drawn in neutral ink rather than competing with the series. */
    function totalInk() { return printing ? '#444444' : 'rgba(255,255,255,0.78)'; }
    function isTotalSeries(i) { return !SERIES[i]; }

    /* The two reconstruction hatches, drawn once onto an offscreen tile and
       repeated by the canvas. Both are the series green on a transparent
       ground at 45 degrees, and they differ only in how much of the tile the
       stripe covers: documented is dense, estimated is sparse.

       The tile is 6px for the dense hatch and 7px for the sparse one, sized so
       the stripe and its gap divide the tile exactly. A tile that does not
       divide evenly produces a visible seam every repeat, which at bar width
       reads as a defect in the data rather than in the pattern.

       A pattern is a bitmap, so it cannot be faded the way fade() handles a
       colour and it will not follow a re-pointed token. Ghosting and the print
       re-step are therefore baked into the tile, and the cache is keyed on
       both. */
    var hatchCache = {};
    function hatchPattern(g, kind, alpha) {

      var period = kind === 'documented' ? 6 : 7;   // stripe 3 / gap 3, stripe 2 / gap 5
      var base = printing ? '#2E9950' : SERIES_FILL;

         transform, rather than drawn as diagonals into a square tile.

         A 45 degree stripe of period P needs a tile of P times root two to
         repeat without a seam, which is never a whole number of pixels, and the
         rounded tile leaves a break every repeat: the hatch renders as rows of
         dashes and reads as a defect in the data rather than as a texture.

         finished pattern, so the geometry stays whole. */
      var c = document.createElement('canvas');
      c.width = period;
      c.height = 1;
      var x = c.getContext('2d');

         transparent ground let the page's black through the gaps, and at half
         coverage a reconstructed bar read as a different, darker colour rather
         than as the same green with a texture over it. The wash keeps the whole
         stack in one family; stripe density carries the distinction. */
      x.fillStyle = rgba(base, 0.22 * alpha);
      x.fillRect(0, 0, period, 1);
      x.fillStyle = rgba(base, alpha);
      x.fillRect(0, 0, stripe, 1);

      // Chromium, Firefox and Safari all carry these. If a browser does not,
      // the hatch simply renders upright, which still reads as reconstructed.

        p.setTransform(new DOMMatrix().rotate(45));
      }

      return p;
    }

    /* Projected bars must not be readable as delivered hours: they are drawn as
       outlines over a textured ground, and named in the key under the chart. */
    function projFill() { return 'transparent'; }

       than a second palette to keep in step with the first. */

      var p = m[1].split(',').map(function (s) { return s.trim(); });

    /* Per-bar fills and strokes for one series. `g` is the chart's own 2d
       context, which is what a canvas pattern has to be created against.

       Every series returns the same green. Where a series is reconstructed the
       fill is a hatch of that green rather than a different colour, so the
       whole stack reads as one quantity with a texture running through part of
       it, which is what it is. */

      var s = SERIES[seriesIdx];
      var ghosted = emphasis !== null && emphasis !== seriesIdx;
      return chartRows.map(function (r) {
        var dim = ghosted || (hoverMonth !== null && !(r.kind === 'month' && r.month === hoverMonth));
        var a = dim ? GHOST_A : 1;
        if (r.projected) return which === 'fill' ? projFill() : fade(projLine(), a);
        var flagged = r.kind === 'month' && !!flagFor(YEAR, r.month, 'retainer');
        if (which === 'fill') {

      });
    }

    /* Per-bar corner radius for one series in the stack. A segment is rounded
       only where it is the last one with hours in it, so a month with logged
       and reconstructed time is one bar with one rounded end, not three
       lozenges piled up.

       Hidden series count as absent: switching a legend entry off has to hand
       the rounded end to whatever is now on top. */
    function topOfStackRadius(seriesIdx) {
      return chartRows.map(function (r) {
        for (var i = SERIES.length - 1; i >= 0; i--) {
          if (state.hidden[i]) continue;

        }
        // An empty month has nothing on top, so the first series carries it.
        return seriesIdx === 0 ? 4 : 0;
      });
    }

    /* The warn outline has to read as deliberate rather than as the hairline
       every other bar carries, so a flagged bar's stroke is drawn heavier. */
    function barWidths() {
      return chartRows.map(function (r) {
        return (r.kind === 'month' && !r.projected && flagFor(YEAR, r.month, 'retainer')) ? 2.4 : 1.5;
      });
    }

    function applyEmphasis(next) {
      emphasis = next;
      paintBars();
    }

    function wireLegend() {
      document.querySelectorAll('#legend .legend-item:not(.is-key)').forEach(function (b) {
        var i = parseInt(b.dataset.i);
        if (isNaN(i)) return;
        b.addEventListener('mouseenter', function () { if (!state.hidden[i]) applyEmphasis(i); });
        b.addEventListener('focus', function () { if (!state.hidden[i]) applyEmphasis(i); });
        b.addEventListener('mouseleave', function () { applyEmphasis(null); });
        b.addEventListener('blur', function () { applyEmphasis(null); });
        b.addEventListener('click', function () {
          state.hidden[i] = !state.hidden[i];
          b.dataset.off = state.hidden[i] ? 'true' : 'false';
          b.setAttribute('aria-pressed', String(!state.hidden[i]));
          if (chart) { chart.setDatasetVisibility(i, !state.hidden[i]); chart.update(); }
          applyEmphasis(null);

    /* The chart is drawn to a canvas, so the print stylesheet can't reach its
       axis text, gridlines or markers, so re-theme it around the print events. */
    var printing = false;
    function chartTheme(isPrint) {
      printing = isPrint;

      // with the projection ground and rebuilt against the print palette.
      hatchCache = {};
      if (!chart) return;
      var s = chart.options.scales;
      // Which axis carries the months flips with the orientation.
      var horiz = chart.options.indexAxis === 'y';
      var cat = horiz ? s.y : s.x, val = horiz ? s.x : s.y;
      // Left as the scriptable function, which reads `printing` itself and also
      // carries the open month's highlight. Overwriting it with a flat colour
      // here is what used to drop that highlight on the way to the printer.
      cat.ticks.color = catTickColor;
      val.ticks.color = isPrint ? 'rgba(0,0,0,0.55)' : 'rgba(255,255,255,0.55)';
      val.grid.color = isPrint ? 'rgba(0,0,0,0.16)' : 'rgba(255,255,255,0.13)';

      cat.border.color = isPrint ? 'rgba(0,0,0,0.42)' : 'rgba(255,255,255,0.34)';

    window.addEventListener('afterprint', function () { chartTheme(false); });

    /* The same warning triangle as ICONS.alert, drawn onto the canvas so the
       chart marker matches the flag buttons elsewhere. Path2D
       takes the icon's own path data; a plain triangle stands in if the browser
       cannot parse it. */
    var ALERT_PATH = 'M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z';

      g.lineWidth = 2.2;
      g.lineJoin = 'round';
      g.lineCap = 'round';

        g.stroke(alertPath2D);

        g.beginPath();
        g.moveTo(12, 3); g.lineTo(22.5, 21); g.lineTo(1.5, 21); g.closePath();

      g.restore();
    }

    /* Horizontal only. A phone has no room for a value axis worth reading, so
       the hours are written at the end of each bar instead, in the series
       colour, with the data flag (where there is one) leading them. That also
       gives a touch reader the figure a hover tooltip would have given. */
    var END_GAP = 9, FLAG_W = 20;
    var barEndLabels = {
      id: 'barEndLabels',
      afterDatasetsDraw: function (c) {
        if (c.options.indexAxis !== 'y') return;
        var g = c.ctx;
        var font = getComputedStyle(document.body).fontFamily;
        /* One figure per month, not one per series. The three series are
           stacked into a single bar now, so three labels would land on top of
           each other at the same y. The month's total is what the reader wants
           off the end of a bar anyway; the split is in the table below and in
           the tooltip. The last visible segment is what the label is placed
           against, so it clears whatever the stack actually ends on. */
        var last = null;

    };

    /* The estimated stretch of the year gets its own ground: a hairline where
       tracked time stops and a diagonal texture over everything after it. The
       texture is what the key under the chart names, which is why there is no
       longer a word floating in the plot. */
    var projGroundPattern = null;
    function projGround(g) {
      if (projGroundPattern) return projGroundPattern;
      var c = document.createElement('canvas');
      c.width = c.height = 9;

    /* The monthly allowance, drawn across the plot.

       Without it a reader has to count gridlines to see where 50 hours sits,
       which is the one comparison every figure on this page is making. It is
       drawn in neutral ink rather than in a series or status colour: the line
       is the contract, not a verdict on the bars that cross it. Dashed, so it
       reads as a threshold rather than as another month of data.

       Vertical layout only. Rotated, the value axis runs left to right and the
       hours are written at the end of each bar instead, so a vertical rule
       through eight rows of labels would cost more than it explains. */
    var allowanceLine = {
      id: 'allowanceLine',

      }

    /* Curvature for the total line and for everything drawn alongside it. Set

       a set of ruled segments: an estimate should not look surveyed. */
    var LINE_TENSION = 0.42;

    /* Chart.js keeps its spline maths to itself, so the band drawn around the
       total line would be a polygon laid over a curve, disagreeing with it
       between every pair of months. This is the same calculation Chart.js runs
       on the line (helpers.splineCurve): each point's control points sit along
       the chord between its two neighbours, weighted by how far away each
       neighbour is. An endpoint stands in as its own missing neighbour, which
       is what leaves the first and last spans slack rather than straight. */
    function splineCtrl(a, b, c, t) {

      if (!c) c = b;
      var d01 = Math.hypot(b.x - a.x, b.y - a.y);
      var d12 = Math.hypot(c.x - b.x, c.y - b.y);

       wherever the path already is, which is what the filled band needs when it
       turns the corner at the far end and comes back along its other edge.

       Control points are held inside the plot, as Chart.js holds the line's:
       a steep last month can throw one past the top of the frame, and the band
       would billow out over the axis rather than following the line. */
    function curveThrough(g, pts, t, area, join) {

      var hold = function (p) {
        return area
          ? { x: clamp(p.x, area.left, area.right), y: clamp(p.y, area.top, area.bottom) }

      if (join) g.lineTo(pts[0].x, pts[0].y);
      else g.moveTo(pts[0].x, pts[0].y);
      for (var i = 0; i < pts.length - 1; i++) {
        var out = hold(splineCtrl(pts[i - 1], pts[i], pts[i + 1], t).next);

       figure the reader can check rather than appearing from nowhere. */
    var projBand = {
      id: 'projBand',
      beforeDatasetsDraw: function (c) {
        if (c.options.indexAxis === 'y') return;
        var p = chartProjection;
        if (!p || p.from > 11 || !p.spread) return;
        var meta = c.getDatasetMeta(SERIES.length);
        if (!meta || !meta.data || !meta.data.length) return;
        var val = c.scales.y;
        if (!val) return;

        for (var i = Math.max(0, p.from - 1); i < chartRows.length; i++) {

        var g = c.ctx;
        var hiPts = pts.map(function (pt) { return { x: pt.x, y: pt.hi }; });

        g.save();

        // curve the total line runs down the middle of.
        g.beginPath();
        curveThrough(g, hiPts, LINE_TENSION, c.chartArea, false);
        curveThrough(g, loPts.slice().reverse(), LINE_TENSION, c.chartArea, true);

          ? 'rgba(0,0,0,0.05)'

        g.setLineDash([4, 4]);

          ? 'rgba(0,0,0,0.26)'
          : 'rgba(255,255,255,' + (faded ? 0.11 : 0.24) + ')';
        [hiPts, loPts].forEach(function (edge) {
          g.beginPath();
          curveThrough(g, edge, LINE_TENSION, c.chartArea, false);
          g.stroke();
        });
        g.restore();
      }
    };

    /* Total hours per month, drawn over the paired bars so the shape of the
       month-to-month workload reads without adding the two bars up by eye.
       Vertical layout only: the horizontal one pins its value axis to the
       largest single bar, and a line of totals would run off the end of it. */
    function totalLineDataset() {
      var ink = totalInk();
      return {
        type: 'line',
        label: 'Total',
        data: chartRows.map(function (r) { return r.total; }),
        borderColor: ink,
        backgroundColor: 'transparent',
        borderWidth: 2,
        borderDash: [5, 4],
        /* Ghosted from the boundary onward: past it the line is an estimate too,
