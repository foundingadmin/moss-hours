<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moss · Hours Report</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="https://brand.foundingcreative.com/favicon.svg" />

  <!-- Founding Creative design-system tokens, same source as the report. Every
       token below carries a fallback: this page is what a visitor sees when the
       report is off, so it has to stand up on its own if the CDN does not
       answer. -->
  <link rel="stylesheet" href="https://brand.foundingcreative.com/css/tokens.css" />

  <style>
    * { box-sizing: border-box; }

    body {
      /* The report's own ground, so switching the routes off is a change of
         content rather than a change of site. */
      margin: 0;
      background:
        radial-gradient(1100px 560px at 82% -8%, rgba(126, 248, 147, 0.10), transparent 60%),
        radial-gradient(820px 460px at -10% 6%, rgba(198, 162, 255, 0.08), transparent 55%),
        var(--n-black, #0A0A0A);
      background-attachment: fixed;
      color: rgba(255, 255, 255, 0.78);
      font-family: var(--font-body, 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif);
      font-size: 17px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    /* One centred column. There is no masthead here because there is nothing
       under it: the mark, the message and the way back are the whole page. */
    .page {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 34px;
      max-width: 620px;
      margin: 0 auto;
      padding: 64px 28px;
      text-align: center;
    }

    .lockup img { display: block; height: 30px; width: auto; }

    .card {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: var(--r-lg, 18px);
      padding: 48px 34px;
    }

    /* Every line in the card is centred, so each one is centred on its own
       terms rather than through a shared `p` rule. A generic `p` selector used
       to set `max-width` and `margin-inline: auto` here, and `.eyebrow`'s own
       `margin` shorthand outranked the auto margins, so the eyebrow got the
       narrow box without the centring and sat flush left inside it. */
    .eyebrow {
      margin: 0 auto 14px;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      /* Tracking adds its space after the last letter too, so a centred line
         sits half a space left of true centre. The indent shifts the line by
         its full value rather than being halved by the centring, so it is half
         the tracking, not all of it. Measured, not guessed. */
      text-indent: 0.04em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.62);
    }

    h1 {
      margin: 0 auto 14px;
      font-family: var(--font-display, 'Gelasio', Georgia, serif);
      /* Sized like the report title, which is the heading this one stands in
         for. */
      font-size: clamp(30px, 5vw, 44px);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: var(--tracking-display, -0.01em);
      color: var(--white, #FFFFFF);
    }

    /* Balanced rather than filled, so two lines come out near equal instead of
       a full line above a stub. */
    .lede {
      margin: 0 auto;
      max-width: 32ch;
      text-wrap: balance;
    }

    @media (max-width: 560px) {
      .page { gap: 28px; padding: 48px 18px; }
      .card { padding: 36px 22px; }
      .lockup img { height: 24px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="lockup">
      <img src="assets/fc-wordmark-white.svg" alt="Founding Creative" />
    </div>

    <div class="card">
      <p class="eyebrow">Moss · Hours Report</p>
      <h1>Punch list in progress</h1>
      <p class="lede">A few last items before handover. Back shortly.</p>
    </div>
  </main>
</body>
</html>
